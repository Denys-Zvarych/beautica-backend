name: Nightly

# Nightly full-suite run on main (phase 359 D5; retargeted dev -> main 2026-11-16, "only main").
#
# GitHub runs `schedule:` triggers from the DEFAULT branch's copy of a workflow file, so this file (the
# only one with a schedule) lives on main. It merely dispatches pr-validate.yml on `main`, which then
# runs main's workflow against main's code, always as a full run with --rerun (reason=nightly).
# pr-validate.yml itself has no `schedule:`.
#
# Takes effect only once it is on main (via the dev -> main release PR; never a hotfix). Requires the repo setting
# "Workflow permissions" to allow the GITHUB_TOKEN `actions: write` scope below.
#
# Failure notification (phase 567 L4, fire-and-forget): this job dispatches, confirms the run exists
# (fails when it never appears) and exits; it no longer idles a runner for the whole suite. The
# dispatched run's own `Nightly report` job (pr-validate.yml, reason=nightly only) opens or comments on
# the one open `nightly-red` issue and fails when the run's CI Gate is not green, cancelled included.
# (Not a `workflow_run` reporter: CiInfraCoverageTest denies that trigger repo-wide.)
#
# Skip rule: a scheduled run is skipped when the newest NIGHTLY run on main (run title
# `dispatch:nightly:*`, i.e. reason=nightly, which always runs with --rerun) succeeded on the current
# main HEAD. Manual dispatches (any other reason) never satisfy it, since they may not have re-executed
# cached tests. A manual run of this workflow never skips.
#
# Identifying the dispatched run: pr-validate.yml titles dispatched runs `dispatch:<reason>:<token>` and
# gives each its own concurrency group, so this job passes token=<this run id>-<attempt> and finds the
# run by that exact title. No createdAt/clock comparison, and no other run can replace or cancel it.
#
# Timeout: 5 min = dispatch + up to 2 min polling for the run to appear.

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-full-run:
    name: Dispatch full run on main
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No checkout needed anywhere: GH_REPO names the repo.
      - name: Skip when main HEAD already passed a full run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            last_ok=$(gh run list --workflow pr-validate.yml --event workflow_dispatch --branch main --limit 30 \
              --json headSha,conclusion,displayTitle,createdAt \
              --jq 'map(select(.displayTitle | startswith("dispatch:nightly:"))) | sort_by(.createdAt) | last
                    | select(. != null and .conclusion == "success") | .headSha // empty')
            if [[ "$last_ok" == "$head" ]]; then
              skip=true
              echo "main HEAD $head already passed the last full run; skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN is allowed to trigger workflow_dispatch (the one exception to the
      # "no recursive workflow triggers" rule).
      - name: Dispatch pr-validate on main
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="dispatch:nightly:$token"
          gh workflow run pr-validate.yml --ref main -f reason=nightly -f token="$token"
          id=""
          for _ in $(seq 1 20); do
            id=$(gh run list --workflow pr-validate.yml --event workflow_dispatch --branch main --limit 30 \
              --json databaseId,displayTitle \
              --jq "map(select(.displayTitle == \"$title\")) | first | .databaseId // empty")
            [[ -n "$id" ]] && break
            sleep 6
          done
          [[ -n "$id" ]] || { echo "::error::dispatched run '$title' did not appear"; exit 1; }
          echo "Dispatched run: https://github.com/$GH_REPO/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
          # No watcher (phase 567 L4): the dispatched run reports a red result itself (Nightly report job).
