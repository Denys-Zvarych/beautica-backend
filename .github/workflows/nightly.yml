name: Nightly

# Nightly full-suite run (phase 359 D5).
#
# GitHub runs `schedule:` triggers from the DEFAULT branch's copy of a workflow file, and dev runs
# ahead of main. So this file (the only one with a schedule) lives on main and merely dispatches
# pr-validate.yml on `dev`, which then runs dev's workflow against dev's code, always as a full
# run with --rerun (reason=nightly). pr-validate.yml itself has no `schedule:`.
#
# Takes effect only once it is on main (hotfix PR). Requires the repo setting
# "Workflow permissions" to allow the GITHUB_TOKEN `actions: write` scope below.
#
# Failure notification: a dispatched run is fire-and-forget, so a red nightly would be invisible. This
# job therefore finds the run it dispatched and WAITS for it, failing when it fails. A failed run of
# THIS workflow is what GitHub e-mails/notifies (the user who last touched the cron), so the dispatched
# result needs no extra notification plumbing. Cost: one idle runner for the length of the suite.
#
# Skip rule: a scheduled run is skipped when the newest NIGHTLY run on dev (run title
# `dispatch:nightly:*`, i.e. reason=nightly, which always runs with --rerun) succeeded on the current
# dev HEAD. Manual dispatches (any other reason) never satisfy it, since they may not have re-executed
# cached tests. A manual run of this workflow never skips.
#
# Identifying the dispatched run: pr-validate.yml titles dispatched runs `dispatch:<reason>:<token>` and
# gives each its own concurrency group, so this job passes token=<this run id>-<attempt> and finds the
# run by that exact title. No createdAt/clock comparison, and no other run can replace or cancel it.
#
# Timeout: 75 min = plan 10 + test 45 + verify 10 plus slack, the dispatched workflow's own ceiling.
# The watcher idles one runner for that whole time; accepted as the price of a visible red nightly.

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-full-run:
    name: Dispatch full run on dev
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No checkout needed anywhere: GH_REPO names the repo.
      - name: Skip when dev HEAD already passed a full run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            head=$(gh api "repos/$GH_REPO/commits/dev" --jq .sha)
            last_ok=$(gh run list --workflow pr-validate.yml --event workflow_dispatch --branch dev --limit 30 \
              --json headSha,conclusion,displayTitle,createdAt \
              --jq 'map(select(.displayTitle | startswith("dispatch:nightly:"))) | sort_by(.createdAt) | last
                    | select(. != null and .conclusion == "success") | .headSha // empty')
            if [[ "$last_ok" == "$head" ]]; then
              skip=true
              echo "dev HEAD $head already passed the last full run; skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN is allowed to trigger workflow_dispatch (the one exception to the
      # "no recursive workflow triggers" rule).
      - name: Dispatch pr-validate on dev and wait for it
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="dispatch:nightly:$token"
          gh workflow run pr-validate.yml --ref dev -f reason=nightly -f token="$token"
          id=""
          for _ in $(seq 1 20); do
            id=$(gh run list --workflow pr-validate.yml --event workflow_dispatch --branch dev --limit 30 \
              --json databaseId,displayTitle \
              --jq "map(select(.displayTitle == \"$title\")) | first | .databaseId // empty")
            [[ -n "$id" ]] && break
            sleep 6
          done
          [[ -n "$id" ]] || { echo "::error::dispatched run '$title' did not appear"; exit 1; }
          echo "Dispatched run: https://github.com/$GH_REPO/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
          # --exit-status: non-zero when the dispatched run fails or is cancelled, which fails this job.
          gh run watch "$id" --interval 60 --exit-status >/dev/null
