          #   DETACH PARTITION, NO INHERIT, ENABLE | FORCE ROW LEVEL SECURITY (each changes which rows
          #       the previous app version's queries see or write)
          # Deliberately NOT destructive: REVOKE (role grants only; the app connects as the owner role
          # that runs Flyway), DROP DEFAULT (the standard last step of add-with-default expand
