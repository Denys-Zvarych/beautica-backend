name: Migration Immutability

on:
  pull_request:
    branches:
      - main
      - dev
  # Defense-in-depth: re-run the gates on the merged tip of the
  # protected branches. A bad migration that reaches dev/main via a
  # merge-commit (or a direct push) is NOT covered by the
  # pull_request trigger and would otherwise deploy to prod
  # unchecked (this exact gap crash-looped Railway on a V49
  # checksum mismatch). The base-revision resolution step below is
  # event-aware: PR -> pull_request.base.sha; push ->
  # github.event.before with a safe merge-base fallback.
  push:
    branches:
      - main
      - dev

jobs:
  check-migration-immutability:
    name: Check Migration Immutability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # REQUIRED: full history so the three-dot merge-base diff
          # ("$BASE_SHA...HEAD") can resolve. Do not lower this.
          fetch-depth: 0
          persist-credentials: false

      # Event-aware base-revision resolution. This is the ONLY place
      # event type is interpreted; the gate step (and its hermetic
      # mirror) consume the resulting $BASE_SHA verbatim, so the
      # SHARED block stays byte-identical and verify-gate-mirror-parity
      # still passes.
      #   pull_request -> the PR base tip (unchanged behavior).
      #   push         -> github.event.before, the pre-push tip; the
      #                    before...HEAD diff catches a V49-style
      #                    mutation introduced by the merge-commit.
      #   zero-SHA / unresolved (branch creation, first push,
      #   force-push, shallow) -> fall back to merge-base vs
      #   origin/main, then HEAD^, and FAIL loudly if neither
      #   resolves (a poisoned push must never silently pass).
      - name: Resolve base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # >>> SHARED-BLOCK:baserev:BEGIN
          # =========================================================
          # SHARED BASE-REVISION RESOLVER LOGIC -- keep this block
          # BYTE-IDENTICAL with the copy in
          # `check-migration-version-monotonicity` and the hermetic
          # mirror in `self-test-base-revision-resolution`. The
          # `verify-gate-mirror-parity` job diffs all extracted copies
          # and fails CI if they drift, so a typo in one place is
          # caught before it can ship.
          # =========================================================
          #
          # Event-aware base-revision resolution. This is the ONLY
          # place event type is interpreted; the gate step (and its
          # hermetic mirror) consume the resulting SHA verbatim as
          # $BASE_SHA, so the gate SHARED blocks stay byte-identical.
          #   pull_request -> the PR base tip (unchanged behavior).
          #   push         -> github.event.before, the pre-push tip;
          #                    the before...HEAD diff catches a
          #                    V49-style mutation introduced by the
          #                    merge-commit.
          #   zero-SHA / unresolved (branch creation, first push,
          #   force-push, shallow) -> fall back to merge-base vs
          #   origin/main, then HEAD^, and FAIL loudly if neither
          #   resolves (a poisoned push must never silently pass).
          #
          # Reads EVENT_NAME / PR_BASE_SHA / PUSH_BEFORE_SHA from the
          # environment. Prints ONLY the resolved SHA on stdout (the
          # caller is responsible for exporting it to $GITHUB_ENV, so
          # this block is hermetic and reusable from the self-test).
          # Diagnostics go to stderr. Exits 1 (fail-loud) if no safe
          # base can be resolved.
          resolve_base_revision() {
            local zero_sha="0000000000000000000000000000000000000000"
            local candidate

            resolve_base_revision_fallback() {
              # Prefer the merge-base against the protected mainline so
              # only commits unique to this push/tip are evaluated.
              if git rev-parse --verify --quiet origin/main >/dev/null; then
                local mb
                if mb="$(git merge-base origin/main HEAD 2>/dev/null)" && [ -n "$mb" ]; then
                  printf '%s' "$mb"
                  return 0
                fi
              fi
              # Otherwise the immediate parent, if HEAD has one.
              if git rev-parse --verify --quiet "HEAD^" >/dev/null; then
                git rev-parse "HEAD^"
                return 0
              fi
              return 1
            }

            if [ "${EVENT_NAME:-}" = "pull_request" ]; then
              candidate="${PR_BASE_SHA:-}"
            else
              candidate="${PUSH_BEFORE_SHA:-}"
            fi

            # Treat the zero-SHA sentinel or any non-resolvable value
            # as unresolved and fall back; never let it silently pass.
            if [ -z "$candidate" ] || [ "$candidate" = "$zero_sha" ] \
               || ! git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
              echo "Base revision '$candidate' for event '${EVENT_NAME:-}' is unresolved (zero-SHA, missing, or shallow). Falling back." >&2
              if ! candidate="$(resolve_base_revision_fallback)"; then
                echo "ERROR: could not resolve any safe base revision (no origin/main merge-base and no HEAD parent)." >&2
                echo "Refusing to pass the migration gate without a base to diff against." >&2
                return 1
              fi
              echo "Resolved fallback base revision: $candidate" >&2
            fi

            printf '%s' "$candidate"
            return 0
          }
          # =========================================================
          # END SHARED BASE-REVISION RESOLVER LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:baserev:END

          if ! BASE_SHA="$(resolve_base_revision)"; then
            exit 1
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Using BASE_SHA=$BASE_SHA (event=$EVENT_NAME)"

      - name: Detect modified or deleted migrations
        run: |
          set -euo pipefail

          MIGRATION_PATH="src/main/resources/db/migration"
          JAVA_MIGRATION_PATH="src/main/java/db/migration"
          DATA_PATH="src/main/resources/db/data"

          # >>> SHARED-BLOCK:immutability:BEGIN
          # =========================================================
          # SHARED IMMUTABILITY GATE LOGIC -- keep this block
          # BYTE-IDENTICAL with the mirror in
          # `self-test-immutability-gate`. The hermetic
          # `verify-gate-mirror-parity` job diffs the two extracted
          # copies and fails CI if they drift, so a typo or a dropped
          # filter letter in one place is caught before it can ship.
          # =========================================================
          #
          # Collect files that are Modified (M), Deleted (D), Renamed
          # (R), Copied (C), or Type-changed (T) relative to the PR
          # merge-base. The three-dot form ("$base_sha...HEAD") diffs
          # against the merge-base of the two tips rather than the raw
          # base tip, so advances on the base branch never attribute
          # base-side mutations to this PR.  Added (A) files are
          # intentionally excluded so brand-new migrations always pass.
          # Renamed migrations are caught because Flyway uses the
          # script name as part of its checksum identity -- a rename
          # changes that identity and will fail validation in prod.
          # C and T are practically unreachable for text V*.sql
          # migrations but are included for defensive completeness
          # (zero behaviour change for normal new-file adds).
          #
          # The pathspec is scoped to the three file kinds that carry
          # a Flyway checksum identity, NOT to whole directories:
          #   "$MIGRATION_PATH/*.sql"        -- SQL scripts, any depth (a
          #                                     plain git pathspec '*' also
          #                                     crosses '/', so db/migration/
          #                                     sub/V9__x.sql is covered; Flyway
          #                                     scans subfolders)
          #   ":(glob)$JAVA_MIGRATION_PATH/**/V*.java"
          #                                  -- Java migrations (V171+), any
          #                                     depth. NOT "$JAVA_.../V*.java":
          #                                     that needs the 'V' directly
          #                                     after the directory and misses
          #                                     db/migration/sub/V9__x.java.
          #   "$DATA_PATH/*.csv"             -- data resources a Java
          #                                     migration derives its
          #                                     own checksum from
          # Housekeeping files that happen to live in those directories
          # (a '.gitkeep' placeholder, a README) carry no checksum
          # identity, so removing one can never break 'flyway validate'.
          # Scoping on the directory made the gate fail a dev->main PR
          # purely because the original '.gitkeep' had been deleted once
          # real migrations landed. Scenario 9 in the mirror pins this.
          #
          # The CSV arm is NOT cosmetic. V171__import_free_settlements
          # overrides getChecksum() to return a CRC32 over the BYTES of
          # db/data/settlements.csv, so editing that CSV silently
          # mutates an already-applied migration's checksum -- the exact
          # defect class that crash-looped Railway on V49. Refreshing
          # the settlement list is ROUTINE maintenance (Order 376
          # changes every few weeks), which makes the unguarded path the
          # likely one to be taken. Scenarios 11 and 12 in the mirror
          # pin the two new arms.
          run_gate() {
            local base_sha="$1"
            local changed
            changed=$(git diff --name-status --diff-filter=MDRCT "${base_sha}...HEAD" -- \
              "$MIGRATION_PATH/*.sql" ":(glob)$JAVA_MIGRATION_PATH/**/V*.java" "$DATA_PATH/*.csv")
            if [ -z "$changed" ]; then
              return 0
            fi
            return 1
          }
          # =========================================================
          # END SHARED IMMUTABILITY GATE LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:immutability:END

          CHANGED=$(git diff --name-status --diff-filter=MDRCT "$BASE_SHA...HEAD" -- \
            "$MIGRATION_PATH/*.sql" ":(glob)$JAVA_MIGRATION_PATH/**/V*.java" "$DATA_PATH/*.csv")

          if run_gate "$BASE_SHA"; then
            echo "No existing migration files were modified, deleted, or renamed. Check passed."
            exit 0
          fi

          echo "ERROR: The following already-merged Flyway migration file(s) were modified, deleted, or renamed:"
          echo ""
          echo "$CHANGED"
          echo ""
          echo "Applied/merged migrations are immutable -- never edit or rename V*.sql after it is merged."
          echo "Add a new forward migration with the next version number instead."
          echo "If you did NOT touch the file(s) listed above, rebase your branch onto the base branch to bring your history up to date."
          exit 1

      # Release-PR exemption (see the SHARED scope block). Decides ONLY the destructive step below.
      - name: Decide destructive-gate scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # >>> SHARED-BLOCK:scope:BEGIN
          # =========================================================
          # SHARED DESTRUCTIVE-GATE SCOPE DECISION -- keep this block
          # BYTE-IDENTICAL with the mirror in
          # `self-test-base-revision-resolution`. The
          # `verify-gate-mirror-parity` job diffs the two copies.
          # =========================================================
          #
          # Prints exactly one word: `skip-release-pr`, `skip-release-merge` or `gate`.
          # Only the destructive (expand/contract) step consults it; the
          # immutability and monotonicity gates ALWAYS run.
          #
          # Why a release is exempt: its range holds only migrations that
          # already passed this gate in their PR into dev, and merged
          # migrations are immutable, so a failure there is unfixable.
          #
          # pull_request: skip ONLY for base main + head branch dev + head repo
          #   == this repo (a fork's dev must not count). Every PR into dev,
          #   hotfix/* into main, and anything else is gated.
          # push to main: BASE_SHA is github.event.before = the OLD main tip, so
          #   after a release MERGE COMMIT the range old-main...HEAD is the whole
          #   release and would fail the same way. Skip ONLY when HEAD is a
          #   two-parent merge whose second parent is already an ancestor of
          #   origin/dev (everything merged came through dev, hence was gated).
          #   A hotfix merge (second parent not in dev), a squash/rebase merge
          #   (one parent), an octopus merge, a direct push, or a missing
          #   origin/dev all stay gated (fail closed).
          # Reads EVENT_NAME / BASE_REF / HEAD_REF / HEAD_REPO / REPO / REF from the environment.
          destructive_gate_scope() {
            local p2
            if [ "${EVENT_NAME:-}" = "pull_request" ]; then
              if [ "${BASE_REF:-}" = "main" ] && [ "${HEAD_REF:-}" = "dev" ] \
                 && [ -n "${REPO:-}" ] && [ "${HEAD_REPO:-}" = "${REPO}" ]; then
                echo "skip-release-pr"
                return 0
              fi
              echo "gate"
              return 0
            fi
            if [ "${EVENT_NAME:-}" = "push" ] && [ "${REF:-}" = "refs/heads/main" ]; then
              if p2="$(git rev-parse --verify --quiet "HEAD^2^{commit}")" \
                 && ! git rev-parse --verify --quiet "HEAD^3" >/dev/null \
                 && git rev-parse --verify --quiet "origin/dev^{commit}" >/dev/null \
                 && git merge-base --is-ancestor "$p2" origin/dev; then
                echo "skip-release-merge"
                return 0
              fi
            fi
            echo "gate"
            return 0
          }
          # =========================================================
          # END SHARED DESTRUCTIVE-GATE SCOPE DECISION
          # =========================================================
          # >>> SHARED-BLOCK:scope:END

          decision="$(destructive_gate_scope)"
          case "$decision" in
            skip-release-pr)
              echo "SKIPPING destructive-migration gate: release PR dev -> main from this repo (every migration in range already passed this gate in its PR into dev)."
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            skip-release-merge)
              echo "SKIPPING destructive-migration gate: push to main is a merge commit whose second parent is already in origin/dev (release merge; its migrations were gated in their PRs into dev)."
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Destructive-migration gate applies (event=$EVENT_NAME, base=${BASE_REF:-n/a}, head=${HEAD_REF:-n/a})."
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Phase 370 D6: expand/contract gate. Reuses $BASE_SHA from "Resolve base revision" above.
      - name: Require contract-of header on destructive migrations
        if: steps.scope.outputs.skip != 'true'
        run: |
          set -euo pipefail

          MIGRATION_PATH="src/main/resources/db/migration"
          JAVA_MIGRATION_PATH="src/main/java/db/migration"

          # >>> SHARED-BLOCK:destructive:BEGIN
          # =========================================================
          # SHARED DESTRUCTIVE-MIGRATION GATE LOGIC (phase 370 D6) -- keep
          # this block BYTE-IDENTICAL with the mirror in
          # `self-test-base-revision-resolution`. The hermetic
          # `verify-gate-mirror-parity` job diffs the two extracted copies
          # and fails CI if they drift.
          # =========================================================
          #
          # Expand/contract: Railway rollback redeploys the PREVIOUS image
          # against the ALREADY-MIGRATED schema, so a migration that breaks
          # the previous app version (a "contract" step) may only ship after
          # the release that stopped using the object is live. CI cannot
          # know what is in prod; the release checklist covers that. CI
          # enforces that the author states it.
          #
          # Scope: migration files ADDED relative to the merge-base only
          # (--diff-filter=A, same three-dot form as the other gates), so the
          # existing V1..V198 are exempt. Files are listed under the WHOLE
          # migration directory and filtered on the BASENAME, never with a
          # directory-anchored glob: Flyway scans SUBFOLDERS, and the pathspec
          # `db/migration/V*.sql` does not match `db/migration/sub/V200__x.sql`,
          # so a destructive migration could hide one directory down.
          #   * SQL: any added V*.sql at any depth under src/main/resources/db/migration.
          #   * Repeatable R__*.sql files are REJECTED outright (the repo has none):
          #     Flyway re-applies them whenever their checksum changes, so they are not
          #     one-shot contract steps, a header could not express "the earlier expand
          #     migration", and they would otherwise be a silent hole in this gate.
          #   * Java: an added V*.java at any depth under src/main/java/db/migration is not
          #     parsed; it must carry `// contract-of: V<n>` (destructive) or
          #     `// non-destructive` (author's statement), otherwise the gate fails.
          #   * SQL `-- non-destructive` marker: same semantics as the Java one. A line that is
          #     EXACTLY `-- non-destructive` (surrounding whitespace only, nothing after it) is the
          #     author's statement that a parser hit is a false positive, e.g. an ADD CHECK / CREATE
          #     UNIQUE INDEX on a column the SAME file adds NULL, which no existing row or
          #     previous-app write can violate. The file is then not judged. Put the reason on the
          #     next comment line; review owns it. It replaces abusing `-- contract-of: V<n>` as an
          #     escape hatch for such files.
          #
          # SQL is read by ONE left-to-right tokenizer (no regex stripping, which
          # was evadable: `VALUES ('--'); DROP TABLE x;` hid the DROP behind a
          # fake comment). It understands: '...' with '' escapes,
          # E'...' with backslash escapes, U&'...' (Unicode-escape strings), "quoted
          # identifiers" with "" escapes (U&"..." identifiers tokenize the same way, the
          # U& stays in the code text), $tag$...$tag$ dollar quoting, -- comments and
          # NESTED /* */ comments. The dollar-tag scan is a linear \G match (a
          # substr($s,$i) copy per `$` made a 5 MB run of `$` quadratic).
          # FAIL CLOSED: an unbalanced quote, dollar tag or comment makes the whole
          # file destructive (reason UNPARSEABLE).
          #
          # Each statement (split on top-level ;) is DESTRUCTIVE when its code
          # (comments dropped, literals blanked) contains:
          #   DROP <anything>, EXCEPT an allow-list. EVERY DROP <kind> is destructive
          #       (TABLE, SEQUENCE, TYPE, DOMAIN, VIEW, FUNCTION, TRIGGER, SCHEMA, EXTENSION,
          #       OWNED BY, FOREIGN TABLE, POLICY, RULE, AGGREGATE, COLUMN, a bare/quoted
          #       column name, ... and kinds nobody has thought of yet) unless <kind> is:
          #         inside an ALTER statement: INDEX | CONSTRAINT | DEFAULT | NOT NULL |
          #                                    EXPRESSION | IDENTITY
          #         at top level:              INDEX
          #       INDEX / EXPRESSION / IDENTITY are non-reserved words, so a column can be
          #       named that. `ALTER TABLE t DROP identity;` (directly followed by `,`,
          #       `;`, CASCADE or RESTRICT, and NOT preceded by `ALTER [COLUMN] <col>`) is
          #       a column drop and is flagged; `ALTER COLUMN c DROP IDENTITY` is allowed.
          #   TRUNCATE
          #   RENAME (table, column, constraint, index, ...). Index renames are
          #       deliberately kept destructive (fail closed): add a contract-of
          #       header if the rename is intentional.
          #   SET NOT NULL
          #   ALTER [COLUMN] <col> [SET DATA] TYPE
          #   ADD [CONSTRAINT <name>] CHECK | UNIQUE | PRIMARY KEY | FOREIGN KEY |
          #       EXCLUDE, and ADD ... REFERENCES (existing rows / the previous
          #       app version's writes can violate it)
          #   CREATE UNIQUE INDEX (same reason)
          #   SET SCHEMA (the previous app version still addresses the old schema)
          #   DROP INDEX / DROP CONSTRAINT of a UNIQUE or PRIMARY KEY or EXCLUDE object, or of a
          #       DYNAMICALLY named one: a rollback runs the previous app against a schema
          #       without it, and its ON CONFLICT (cols) then fails (e.g. DeviceTokenRepository's
          #       ON CONFLICT (token) needs ux_device_tokens_token). The object name is read
          #       after IF EXISTS / CONCURRENTLY, schema prefix ignored, and all comma-listed
          #       DROP INDEX names are checked. Destructive when the name matches
          #       ux_ uq_ uk_ pk_ unq_ uniq_ prefixes, _key _pkey _pk _ux _uq _uk _unique _unq
          #       suffixes, contains unique / excl / overlap, or is one of the 4 historical
          #       UNIQUE indexes named idx_* (idx_salons_owner_primary,
          #       idx_masters_user_owner_type, idx_masters_booking_slug,
          #       idx_bookings_cancel_token); or is dynamic: %I, a quoted identifier, a variable,
          #       a concatenated name (the literal ends at DROP CONSTRAINT), anything that is not
          #       a plain word. Only names that positively look non-unique (idx_ ix_ chk_ ck_ fk_
          #       prefixes, _fkey _fk _idx _ix _chk _check _ck suffixes) pass, so `DROP INDEX
          #       idx_foo` is allowed and an unknown name fails closed.
          #       Whitespace runs are collapsed once before the 400-char look-ahead (linear, so
          #       padding cannot hide a later name). FAIL CLOSED: a comma with no name after it, a
          #       name touching the window end, or a name followed by anything but whitespace, a
          #       comma or the end (`idx_x$_key` is NOT read as `idx_x`).
          #   ADD [CONSTRAINT <name>] NOT NULL <col> (PG18 table-constraint spelling of SET NOT NULL)
          #   (DEFAULT NULL / DEFAULT (NULL) / DEFAULT NULL::t is NOT a default for the next rule)
          #   ADD [COLUMN] <col> ... NOT NULL without DEFAULT or GENERATED (existing rows / the
          #       previous app version's INSERTs violate it; IS NOT NULL inside a CHECK is ignored)
          #   DETACH PARTITION, NO INHERIT, ENABLE | FORCE ROW LEVEL SECURITY (each changes which rows
          #       the previous app version's queries see or write)
          # Deliberately NOT destructive: REVOKE (role grants only; the app connects as the owner role
          # that runs Flyway), DROP DEFAULT (the standard last step of add-with-default expand
          # migrations, flagging it would block routine safe work), plain CREATE INDEX / ADD COLUMN.
          #
          # LITERALS IN EVERY FILE: a string or dollar body is also scanned in files with no
          # EXECUTE (a previous migration may have created run_sql(text); dblink_exec runs its
          # text argument), but ONLY by DDL shape: a ;-separated part of the literal must BE a
          # full DROP <kind> <names> / TRUNCATE <names> / ALTER <kind> <name> <action> /
          # CREATE UNIQUE INDEX <name> ON statement, which is then judged by the rules above.
          # Prose that merely contains the word drop / truncate / rename ("drop off",
          # "drop table and rename") has no DDL shape and passes. In INSERT / UPDATE / COMMENT ON /
          # COPY statements only a literal that is ONE whole DDL statement counts (a literal with
          # several ;-parts such as 'it''s; DROP TABLE x' is data there). Inside a dynamic
          # context (below) the full rules apply to the literal text instead of the shape rule.
          # Escape-encoded literals (E'..\..', U&'..') outside INSERT / UPDATE / DELETE / COMMENT /
          # CREATE / ALTER / COPY / VALUES statements (i.e. as an argument of SELECT / CALL /
          # PERFORM / DO ...) fail closed in any file. A blanket ban was rejected as too broad
          # (E'a\nb' seed data is legitimate) and a "calls a non-builtin function" test cannot be
          # decided statically; no existing migration contains E'..\..' or U&'..' at all.
          # 
          # Dynamic SQL: a statement that is a DO block, contains EXECUTE, or is a
          # CREATE FUNCTION/PROCEDURE has all of its string and dollar-quoted bodies
          # analysed recursively with the FULL rules (depth-limited; fails closed when
          # too deep). String pieces of one statement are also analysed concatenated, so
          # EXECUTE 'DR' || 'OP TABLE x' is caught.
          # WHOLE-FILE MODE: if EXECUTE appears ANYWHERE in the file, at any nesting
          # depth (a function that runs EXECUTE q is invoked by a plain
          # `SELECT run_sql('DROP TABLE users')` or `CALL p('DROP TABLE x')` elsewhere,
          # and `s := 'DR'; s := s || 'OP TABLE x'; EXECUTE s` splits across
          # statements), EVERY literal in the file is analysed, at every depth, and so
          # is the join of all innermost literals in file order.
          # ESCAPES: in a file with EXECUTE, any E'...' literal that contains a
          # backslash, or any U&'...' literal, fails closed with "escape-encoded literal
          # in dynamic-SQL file; add contract-of if intentional". Chosen over decoding
          # \xHH / \NNN / \uXXXX / U& escapes because a decoder is one more surface to
          # get wrong (UESCAPE, octal, surrogate pairs, standard_conforming_strings) and
          # a legitimate migration has no reason to hide SQL behind escapes; the author
          # can state intent with a contract-of header.
          # A file that only mentions EXECUTE (GRANT/REVOKE EXECUTE ON FUNCTION) is analysed in the
          # same wide mode: more literals checked, never fewer.
          # OBFUSCATION PRIMITIVES (fail closed): code (not data) anywhere in the file, at any depth,
          # that calls decode( / convert_from( / dblink*, or format( together with EXECUTE or
          # PERFORM, is destructive ("obfuscation-capable dynamic SQL"). The only way through is a
          # `-- contract-of: V<n>` header. Chosen over a new `-- dynamic-sql-reviewed` marker
          # because it adds no parser path and no unvalidated escape hatch: the header is already
          # checked against a real earlier migration. Historical cost: 4 of the 195 existing
          # migrations use format() with EXECUTE/PERFORM; new ones need the header too.
          # HARDENING: EXECUTE of anything but a literal chain (EXECUTE t, EXECUTE format(..)) in any
          # dynamic body is destructive; EXECUTE FUNCTION/PROCEDURE and GRANT EXECUTE ON are exempt.
          # REMAINING RESIDUAL (not detectable statically, covered by the release checklist and
          # review): SQL assembled with primitives other than the four above, e.g. chr(68) ||
          # 'ROP', string_agg / array_to_string / concat over generated pieces, translate() /
          # regexp_replace() on a literal, a function body stored by an EARLIER migration that
          # builds the DDL itself, text read from a table at run time, and a UNIQUE index that is
          # named like a plain index (idx_foo) and not in the 4-name list above.
          #
          # A destructive file must carry one header line anywhere in it:
          #   -- contract-of: V<n>        (Java: // contract-of: V<n>)
          # or, for a parser false positive, the `-- non-destructive` marker line (see above).
          # where V<n> is the EXPAND migration that already stopped the
          # previous app using the object. <n> must be plain digits, strictly
          # lower than this file's own version, and a V<n>__*.sql|java file must
          # exist in the HEAD tree (any depth); otherwise the gate fails.
          #
          # Prints the destructive reason (first match) or nothing; reads SQL
          # on stdin. Single-quote is written \x27 inside the perl body so it can live in a
          # shell single-quoted string.
          destructive_reason() {
            perl -0777 -ne '
              our $ESC = 0;
              our $WIDE = 0;
              our $NONLIT = 0;

              sub tokenize {
                my ($s) = @_;
                my $n = length $s;
                my $i = 0;
                my @stmts;
                my $code = "";
                my @bodies;
                my $stesc = 0;
                while ($i < $n) {
                  my $c = substr($s, $i, 1);
                  my $two = substr($s, $i, 2);
                  if ($two eq "--") {
                    my $e = index($s, "\n", $i);
                    $i = $e < 0 ? $n : $e;
                    $code .= " ";
                    next;
                  }
                  if ($two eq "/*") {
                    my $d = 1;
                    $i += 2;
                    while ($d > 0) {
                      return undef if $i >= $n;
                      my $t = substr($s, $i, 2);
                      if ($t eq "/*") { $d++; $i += 2 }
                      elsif ($t eq "*/") { $d--; $i += 2 }
                      else { $i++ }
                    }
                    $code .= " ";
                    next;
                  }
                  if ($c eq "\x27") {
                    my $esc = ($i > 0 && substr($s, $i - 1, 1) =~ /[eE]/ && ($i < 2 || substr($s, $i - 2, 1) !~ /[\w\$]/));
                    my $uamp = ($i > 1 && substr($s, $i - 1, 1) eq "&" && substr($s, $i - 2, 1) =~ /[uU]/ && ($i < 3 || substr($s, $i - 3, 1) !~ /[\w\$]/));
                    $ESC = 1 if $uamp;
                    $stesc = 1 if $uamp;
                    my $j = $i + 1;
                    my $b = "";
                    while (1) {
                      return undef if $j >= $n;
                      my $ch = substr($s, $j, 1);
                      if ($esc && $ch eq "\\") {
                        return undef if $j + 1 >= $n;
                        $b .= substr($s, $j, 2);
                        $j += 2;
                        next;
                      }
                      if ($ch eq "\x27") {
                        if (substr($s, $j + 1, 1) eq "\x27") { $b .= "\x27"; $j += 2; next }
                        last;
                      }
                      $b .= $ch;
                      $j++;
                    }
                    $ESC = 1 if $esc && index($b, "\\") >= 0;
                    $stesc = 1 if $esc && index($b, "\\") >= 0;
                    push @bodies, $b;
                    $code .= "\x27\x27";
                    $i = $j + 1;
                    next;
                  }
                  if ($c eq "\"") {
                    my $j = $i + 1;
                    while (1) {
                      return undef if $j >= $n;
                      if (substr($s, $j, 1) eq "\"") {
                        if (substr($s, $j + 1, 1) eq "\"") { $j += 2; next }
                        last;
                      }
                      $j++;
                    }
                    $code .= "\"q\"";
                    $i = $j + 1;
                    next;
                  }
                  if ($c eq "\$" && ($i == 0 || substr($s, $i - 1, 1) !~ /[\w\$]/)) {
                    pos($s) = $i;
                    if ($s =~ /\G(\$(?:[A-Za-z_\x80-\xff][\w\x80-\xff]*)?\$)/gc) {
                      my $tag = $1;
                      my $from = $i + length $tag;
                      my $e = index($s, $tag, $from);
                      return undef if $e < 0;
                      push @bodies, substr($s, $from, $e - $from);
                      $code .= " \x27\x27 ";
                      $i = $e + length $tag;
                      next;
                    }
                  }
                  if ($c eq ";") {
                    push @stmts, [$code, [@bodies], $stesc];
                    $code = "";
                    @bodies = ();
                    $stesc = 0;
                    $i++;
                    next;
                  }
                  $code .= $c;
                  $i++;
                }
                push @stmts, [$code, [@bodies], $stesc] if $code =~ /\S/ || @bodies;
                return \@stmts;
              }

              sub code_reason {
                my ($c) = @_;
                # Collapse every whitespace run ONCE (linear) so padding cannot push a later
                # name out of the fixed 400-char look-ahead window in drop_name_reason.
                $c =~ s/\s+/ /g;
                my $alter = ($c =~ /ALTER/i) ? 1 : 0;
                while ($c =~ /\bDROP\b\s*(NOT\s+NULL\b|\w+|"q"|\S?)/gi) {
                  my $start = $-[0];
                  my $end = $+[0];
                  my $k = uc $1;
                  $k =~ s/\s+/ /g;
                  my $ok = $alter ? ($k =~ /\A(?:INDEX|CONSTRAINT|DEFAULT|NOT NULL|EXPRESSION|IDENTITY)\z/ ? 1 : 0) : ($k eq "INDEX" ? 1 : 0);
                  if ($ok && $alter && $k =~ /\A(?:INDEX|EXPRESSION|IDENTITY)\z/) {
                    my $after = substr($c, $end, 40);
                    if ($after =~ /\A\s*(?:,|\z|(?:CASCADE|RESTRICT)\b)/i) {
                      my $before = substr($c, $start > 200 ? $start - 200 : 0, $start > 200 ? 200 : $start);
                      $ok = 0 unless $before =~ /\bALTER\s+(?:COLUMN\s+)?(?:"q"|\w+)\s*\z/i;
                    }
                  }
                  if ($ok && ($k eq "INDEX" || $k eq "CONSTRAINT")) {
                    my $nr = drop_name_reason(substr($c, $end, 400), $k, length($c) - $end > 400);
                    return $nr if $nr;
                  }
                  next if $ok;
                  return "DROP COLUMN" if $k eq "COLUMN" || $k eq "IF" || $k =~ /\A[^A-Z]/;
                  return "DROP COLUMN" if $alter && $k !~ /\A(?:TABLE|SEQUENCE|TYPE|DOMAIN|VIEW|MATERIALIZED|FUNCTION|PROCEDURE|TRIGGER|SCHEMA|EXTENSION|OWNED|FOREIGN|POLICY|RULE|AGGREGATE|ATTRIBUTE|PUBLICATION|SUBSCRIPTION|COLLATION|CAST|OPERATOR|ROLE|USER|GROUP|EVENT|TABLESPACE|DATABASE|LANGUAGE|STATISTICS|ACCESS|TRANSFORM|CONVERSION|ROUTINE|SERVER|TEXT|LARGE)\z/;
                  return "DROP $k";
                }
                return "TRUNCATE" if $c =~ /\bTRUNCATE\b/i;
                return "RENAME" if $c =~ /\bRENAME\b/i;
                return "SET NOT NULL" if $c =~ /\bSET\s+NOT\s+NULL\b/i;
                return "ADD NOT NULL (table-constraint form)" if $c =~ /\bADD\s+(?:CONSTRAINT\s+\S+\s+)?NOT\s+NULL\b/i;
                return "ADD COLUMN NOT NULL without DEFAULT/GENERATED" if add_column_not_null($c);
                return "DETACH PARTITION" if $c =~ /\bDETACH\s+PARTITION\b/i;
                return "NO INHERIT" if $c =~ /\bNO\s+INHERIT\b/i;
                return "ENABLE/FORCE ROW LEVEL SECURITY" if $c =~ /\b(?:ENABLE|FORCE)\s+ROW\s+LEVEL\s+SECURITY\b/i;
                return "ALTER COLUMN TYPE" if $c =~ /\bALTER\s+(?:COLUMN\s+)?(?:"[^"]+"|\w+)\s+(?:SET\s+DATA\s+)?TYPE\b/i;
                return "ADD CHECK/UNIQUE CONSTRAINT" if $c =~ /\bADD\s+(?:CONSTRAINT\s+\S+\s+)?(?:CHECK|UNIQUE)\b/i;
                return "CREATE UNIQUE INDEX" if $c =~ /\bCREATE\s+UNIQUE\s+INDEX\b/i;
                return "ADD " . uc($1) if $c =~ /\bADD\s+(?:CONSTRAINT\s+\S+\s+)?(PRIMARY\s+KEY|FOREIGN\s+KEY|EXCLUDE)\b/i;
                if ($c =~ /\bADD\b/i) {
                  pos($c) = $+[0];
                  return "ADD ... REFERENCES" if $c =~ /\G.*?\bREFERENCES\b/is;
                }
                return "SET SCHEMA" if $c =~ /\bSET\s+SCHEMA\b/i;
                return "";
              }

              sub unique_or_dynamic_name {
                my ($n) = @_;
                return 1 if $n eq "" || $n =~ /\A"q"\z/ || $n !~ /\A\w+\z/;
                return 1 if $n =~ /\A(?:ux|uq|uk|pk|unq|uniq)_|(?:_key|_pkey|_pk|_ux|_uq|_uk|_unique|_unq)\z|unique|excl|overlap|\Aidx_(?:salons_owner_primary|masters_user_owner_type|masters_booking_slug|bookings_cancel_token)\z/i;
                return 0 if $n =~ /\A(?:idx|ix|chk|ck|fk)_|(?:_fkey|_fk|_idx|_ix|_chk|_check|_ck)\z/i;
                return 1;
              }

              sub drop_name_reason {
                my ($after, $k, $trunc) = @_;
                $after =~ s/\A\s*(?:CONCURRENTLY\s+)?(?:IF\s+EXISTS\s+)?//i;
                return "DROP $k of a dynamic-named object" unless $after =~ /\A\s*\S/;
                pos($after) = 0;
                my $comma = 0;
                while ($after =~ /\G\s*((?:"q"|\w+)(?:\s*\.\s*(?:"q"|\w+))*|\S)/gc) {
                  $comma = 0;
                  my $last = $1;
                  $last =~ s/\A.*\.\s*//s;
                  return "DROP $k of a unique/primary-key/exclusion/dynamic-named object" if unique_or_dynamic_name($last);
                  # FAIL CLOSED: a name followed by anything but whitespace, comma or end
                  # (`idx_x$_key` is read as `idx_x`), or a name touching the look-ahead window end.
                  my $p = pos($after);
                  return "DROP $k name not terminated cleanly (unparsed identifier or window end)" if ($p < length($after) && substr($after, $p, 1) !~ /[\s,]/) || ($trunc && $p >= length($after));
                  last if $k ne "INDEX";
                  last unless $after =~ /\G\s*,/gc;
                  $comma = 1;
                }
                # FAIL CLOSED: a comma with no name after it (hidden past the window).
                return "DROP $k list ends after a comma without a name" if $comma;
                return "";
              }

              sub add_column_not_null {
                my ($c) = @_;
                return 0 unless $c =~ /\bALTER\s+TABLE\b/i;
                my ($d, $cur, @cl) = (0, "");
                while ($c =~ /\G([^(),]+|[(),])/gc) {
                  my $t = $1;
                  if ($t eq "(") { $d++; $cur .= $t }
                  elsif ($t eq ")") { $d-- if $d > 0; $cur .= $t }
                  elsif ($t eq "," && $d == 0) { push @cl, $cur; $cur = "" }
                  else { $cur .= $t }
                }
                push @cl, $cur;
                for my $cl (@cl) {
                  next unless $cl =~ /\bADD\s+(?:(COLUMN)\s+)?(?:IF\s+NOT\s+EXISTS\s+)?("q"|\w+)\s+(.*)\z/is;
                  my ($explicit, $name, $rest) = ($1, $2, $3);
                  next if !$explicit && uc($name) =~ /\A(?:CONSTRAINT|CHECK|UNIQUE|PRIMARY|FOREIGN|EXCLUDE|NOT)\z/;
                  $rest =~ s/\bIS\s+NOT\s+NULL\b//ig;
                  # DEFAULT NULL (also (NULL), NULL::type) is no usable default for NOT NULL.
                  $rest =~ s/\bDEFAULT\s*(?:\(\s*NULL(?:\s*::\s*\w+)?\s*\)|NULL\b(?:\s*::\s*\w+)?)//ig;
                  next unless $rest =~ /\bNOT\s+NULL\b/i;
                  next if $rest =~ /\b(?:DEFAULT|GENERATED)\b/i;
                  return 1;
                }
                return 0;
              }

              sub ddl_shape_reason {
                my ($c) = @_;
                my $id = qr/(?:"q"|[\w.%]+)/;
                my $nm = qr/$id(?:\s*\([^()]*\))?/;
                if ($c =~ /\A\s*DROP\s+(?:TABLE|VIEW|MATERIALIZED\s+VIEW|SEQUENCE|TYPE|DOMAIN|FUNCTION|PROCEDURE|SCHEMA|EXTENSION|TRIGGER|POLICY|RULE|AGGREGATE|FOREIGN\s+TABLE|ROLE|USER|DATABASE|OWNED\s+BY|COLUMN|INDEX(?:\s+CONCURRENTLY)?|CONSTRAINT)\b(?:\s+IF\s+EXISTS)?\s+$nm(?:\s*,\s*$nm)*(?:\s+ON\s+$id)?(?:\s+(?:CASCADE|RESTRICT))?\s*\z/i) {
                  return code_reason($c);
                }
                if ($c =~ /\A\s*TRUNCATE\s+(?:TABLE\s+)?(?:ONLY\s+)?$id(?:\s*,\s*$id)*(?:\s+(?:RESTART|CONTINUE)\s+IDENTITY)?(?:\s+(?:CASCADE|RESTRICT))?\s*\z/i) {
                  return "TRUNCATE";
                }
                if ($c =~ /\A\s*ALTER\s+(?:TABLE|INDEX|SEQUENCE|VIEW|MATERIALIZED\s+VIEW|TYPE|DOMAIN|FOREIGN\s+TABLE)\s+(?:IF\s+EXISTS\s+)?(?:ONLY\s+)?$id\s+\S/i) {
                  return code_reason($c);
                }
                if ($c =~ /\A\s*CREATE\s+UNIQUE\s+INDEX\s+(?:CONCURRENTLY\s+)?(?:IF\s+NOT\s+EXISTS\s+)?$id\s+ON\b/i) {
                  return "CREATE UNIQUE INDEX";
                }
                return "";
              }

              sub all_code {
                my ($sql, $depth, $acc) = @_;
                return if $depth > 6;
                my $st = tokenize($sql);
                if (!defined $st) { $$acc .= " $sql "; return }
                for my $x (@$st) {
                  $$acc .= " " . $x->[0] . " ";
                  for my $b (@{$x->[1]}) { all_code($b, $depth + 1, $acc) }
                }
              }

              sub has_exec {
                my ($sql, $depth) = @_;
                return 1 if $depth > 6;
                my $st = tokenize($sql);
                if (!defined $st) {
                  $ESC = 1 if $sql =~ /\\|U&/i;
                  return ($sql =~ /\bEXECUTE\b/i) ? 1 : 0;
                }
                my $found = 0;
                for my $x (@$st) {
                  $found = 1 if $x->[0] =~ /\bEXECUTE\b/i;
                  for my $b (@{$x->[1]}) {
                    $found = 1 if has_exec($b, $depth + 1);
                  }
                }
                return $found;
              }

              sub inner_bodies {
                my ($b) = @_;
                my $st = tokenize($b);
                return () unless defined $st;
                my @r;
                for my $x (@$st) { push @r, @{$x->[1]} }
                return @r;
              }

              sub leaves {
                my ($sql, $depth, $out) = @_;
                return if $depth > 6;
                my $st = tokenize($sql);
                return unless defined $st;
                for my $x (@$st) {
                  for my $b (@{$x->[1]}) {
                    my @in = inner_bodies($b);
                    if (@in) { leaves($b, $depth + 1, $out) } else { push @$out, $b }
                  }
                }
              }

              sub analyze {
                # mode: 0 = file top level (code), 1 = literal in a non-dynamic context
                # (only full DDL-shaped statements count), 2 = dynamic-SQL context (full rules).
                my ($sql, $depth, $mode, $data) = @_;
                return "NESTING TOO DEEP" if $depth > 6;
                my $stmts = tokenize($sql);
                if (!defined $stmts) {
                  return "UNPARSEABLE (unbalanced quote, dollar tag or comment)" if $depth == 0;
                  my @parts = split /;/, $sql;
                  return "" if $mode == 1 && $data && (grep { /\S/ } @parts) > 1;
                  for my $st (@parts) {
                    my $r = $mode == 1 ? ddl_shape_reason($st) : code_reason($st);
                    return $r if $r;
                  }
                  return "";
                }
                if ($depth == 0) {
                  $WIDE = has_exec($sql, 0);
                  return "escape-encoded literal in dynamic-SQL file; add contract-of if intentional" if $WIDE && $ESC;
                }
                return "" if $mode == 1 && $data && (grep { $_->[0] =~ /\S/ || @{$_->[1]} } @$stmts) > 1;
                for my $st (@$stmts) {
                  my ($code, $bodies, $stesc) = @$st;
                  my $r = $mode == 1 ? ddl_shape_reason($code) : code_reason($code);
                  return $r if $r;
                  # EXECUTE of anything but a literal chain (EXECUTE FUNCTION/PROCEDURE and GRANT EXECUTE ON excepted).
                  $NONLIT = 1 if $mode != 1 && $code =~ /\bEXECUTE\b/i && $code !~ /\bEXECUTE\s+(?:FUNCTION|PROCEDURE|ON)\b/i && $code !~ /\bEXECUTE\s+\x27\x27(?:\s*\|\|\s*\x27\x27)*\s*(?:USING\b|INTO\b|\z)/i;
                  return "escape-encoded literal in a non-data statement; add contract-of if intentional" if $stesc && $code !~ /\A\s*(?:INSERT|UPDATE|DELETE|COMMENT|CREATE|ALTER|COPY|VALUES)\b/i;
                  my $dyn = $WIDE || $code =~ /\A\s*DO\b/i || $code =~ /\bEXECUTE\b/i || $code =~ /\bCREATE\s+(?:OR\s+REPLACE\s+)?(?:FUNCTION|PROCEDURE)\b/i;
                  my $cdata = $mode == 0 ? (($code =~ /\A\s*(?:INSERT|UPDATE|COMMENT\s+ON|COPY)\b/i) ? 1 : 0) : $data;
                  my @scan = @$bodies;
                  push @scan, join("", @$bodies) if @$bodies > 1;
                  for my $b (@scan) {
                    $r = analyze($b, $depth + 1, $dyn ? 2 : 1, $cdata);
                    return $r if $r;
                  }
                }
                if ($depth == 0 && $WIDE) {
                  my @all;
                  leaves($sql, 0, \@all);
                  if (@all > 1) {
                    my $r = analyze(join("", @all), 1, 2, 0);
                    return $r if $r;
                  }
                }
                if ($depth == 0) {
                  my $acc = "";
                  all_code($sql, 0, \$acc);
                  if ($acc =~ /\b(?:decode|convert_from)\s*\(/i || $acc =~ /\bdblink/i || ($acc =~ /\bformat\s*\(/i && $acc =~ /\b(?:EXECUTE|PERFORM)\b/i)) {
                    return "obfuscation-capable dynamic SQL (decode/convert_from/dblink/format with EXECUTE|PERFORM); add contract-of if intentional";
                  }
                  return "EXECUTE of a non-literal (variable/parameter/expression) in dynamic SQL; add contract-of if intentional" if $NONLIT;
                }
                return "";
              }

              print analyze($_, 0, 0, 0);
            '
          }

          # check_contract_header <file> <reason> <comment-lead-regex>; prints the error, returns 1 on violation.
          check_contract_header() {
            local f="$1" reason="$2" lead="$3" header ver own refs
            header="$(git show "HEAD:$f" | grep -E "^${lead}contract-of:[[:space:]]*V[0-9]+[[:space:]]*\$" | head -n 1 || true)"
            if [ -z "$header" ]; then
              echo "ERROR: new migration '$f' is destructive ($reason) but has no contract-of: V<n> header (add one if intentional)."
              return 1
            fi
            ver="$(printf '%s' "$header" | sed -E 's/^.*contract-of:[[:space:]]*V([0-9]+)[[:space:]]*$/\1/')"
            own="$(basename "$f" | sed -nE 's/^V([0-9]+)([._][0-9]+)*__.*$/\1/p')"
            if [ -z "$own" ]; then
              echo "ERROR: cannot parse the version of destructive migration '$f'."
              return 1
            fi
            if [ "$((10#$ver))" -ge "$((10#$own))" ]; then
              echo "ERROR: '$f' (V$own, $reason): 'contract-of: V$ver' must name an EARLIER migration."
              return 1
            fi
            refs="$(git ls-tree -r --name-only HEAD -- "$MIGRATION_PATH" "$JAVA_MIGRATION_PATH" | sed 's|.*/||' | grep -E "^V0*${ver}__.*\.(sql|java)$" || true)"
            if [ -z "$refs" ]; then
              echo "ERROR: '$f' (V$own, $reason): 'contract-of: V$ver' names no existing migration V${ver}__*."
              return 1
            fi
            return 0
          }

          run_destructive_gate() {
            local since="$1"
            local added f base reason violations=0
            added="$(git diff --name-only --diff-filter=A "${since}...HEAD" -- "$MIGRATION_PATH")"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              base="${f##*/}"
              case "$base" in
                R__*.sql)
                  echo "ERROR: new repeatable migration '$f' is not allowed (the repo has none): a repeatable file is re-applied on every checksum change, so it cannot be an expand/contract step. Use a versioned V<n>__*.sql migration."
                  violations=1
                  continue ;;
                V*.sql) : ;;
                *) continue ;;
              esac
              if git show "HEAD:$f" | grep -qE '^[[:space:]]*--[[:space:]]*non-destructive[[:space:]]*$'; then
                continue
              fi
              reason="$(git show "HEAD:$f" | destructive_reason)"
              [ -z "$reason" ] && continue
              check_contract_header "$f" "$reason" '--[[:space:]]*' || violations=1
            done <<EOF
          $added
          EOF
            added="$(git diff --name-only --diff-filter=A "${since}...HEAD" -- "$JAVA_MIGRATION_PATH")"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              base="${f##*/}"
              case "$base" in
                V*.java) : ;;
                *) continue ;;
              esac
              if git show "HEAD:$f" | grep -qE '^[[:space:]]*//[[:space:]]*non-destructive[[:space:]]*$'; then
                continue
              fi
              check_contract_header "$f" "Java migration is not parsed" '[[:space:]]*//[[:space:]]*' || violations=1
            done <<EOF
          $added
          EOF
            return "$violations"
          }
          # =========================================================
          # END SHARED DESTRUCTIVE-MIGRATION GATE LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:destructive:END

          if run_destructive_gate "$BASE_SHA"; then
            echo "No destructive new migrations without a valid contract-of header. Check passed."
            exit 0
          fi

          echo ""
          echo "Destructive migrations (DROP/TRUNCATE of tables, columns, views, types, ...; RENAME incl. index renames;"
          echo "SET NOT NULL; ALTER COLUMN TYPE; ADD CHECK/UNIQUE) are 'contract' steps: they may only ship after the"
          echo "release that stopped using the object is live in prod."
          echo "Add '-- contract-of: V<n>' (the EARLIER expand migration) to the file if intentional, and tick the release checklist."
          echo "If the hit is a false positive (e.g. ADD CHECK / CREATE UNIQUE INDEX on a column added NULL in the same file),"
          echo "add a line that is exactly '-- non-destructive' with the reason on the next comment line instead."
          echo "Java migrations (not parsed) need '// contract-of: V<n>' or '// non-destructive'."
          exit 1

  self-test-immutability-gate:
    name: Self-test Immutability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Assert gate fails on mutation and passes on clean / add-only
        run: |
          set -euo pipefail

          MIGRATION_PATH="src/main/resources/db/migration"
          JAVA_MIGRATION_PATH="src/main/java/db/migration"
          DATA_PATH="src/main/resources/db/data"

          # >>> SHARED-BLOCK:immutability:BEGIN
          # =========================================================
          # SHARED IMMUTABILITY GATE LOGIC -- keep this block
          # BYTE-IDENTICAL with the mirror in
          # `self-test-immutability-gate`. The hermetic
          # `verify-gate-mirror-parity` job diffs the two extracted
          # copies and fails CI if they drift, so a typo or a dropped
          # filter letter in one place is caught before it can ship.
          # =========================================================
          #
          # Collect files that are Modified (M), Deleted (D), Renamed
          # (R), Copied (C), or Type-changed (T) relative to the PR
          # merge-base. The three-dot form ("$base_sha...HEAD") diffs
          # against the merge-base of the two tips rather than the raw
          # base tip, so advances on the base branch never attribute
          # base-side mutations to this PR.  Added (A) files are
          # intentionally excluded so brand-new migrations always pass.
          # Renamed migrations are caught because Flyway uses the
          # script name as part of its checksum identity -- a rename
          # changes that identity and will fail validation in prod.
          # C and T are practically unreachable for text V*.sql
          # migrations but are included for defensive completeness
          # (zero behaviour change for normal new-file adds).
          #
          # The pathspec is scoped to the three file kinds that carry
          # a Flyway checksum identity, NOT to whole directories:
          #   "$MIGRATION_PATH/*.sql"        -- SQL scripts, any depth (a
          #                                     plain git pathspec '*' also
          #                                     crosses '/', so db/migration/
          #                                     sub/V9__x.sql is covered; Flyway
          #                                     scans subfolders)
          #   ":(glob)$JAVA_MIGRATION_PATH/**/V*.java"
          #                                  -- Java migrations (V171+), any
          #                                     depth. NOT "$JAVA_.../V*.java":
          #                                     that needs the 'V' directly
          #                                     after the directory and misses
          #                                     db/migration/sub/V9__x.java.
          #   "$DATA_PATH/*.csv"             -- data resources a Java
          #                                     migration derives its
          #                                     own checksum from
          # Housekeeping files that happen to live in those directories
          # (a '.gitkeep' placeholder, a README) carry no checksum
          # identity, so removing one can never break 'flyway validate'.
          # Scoping on the directory made the gate fail a dev->main PR
          # purely because the original '.gitkeep' had been deleted once
          # real migrations landed. Scenario 9 in the mirror pins this.
          #
          # The CSV arm is NOT cosmetic. V171__import_free_settlements
          # overrides getChecksum() to return a CRC32 over the BYTES of
          # db/data/settlements.csv, so editing that CSV silently
          # mutates an already-applied migration's checksum -- the exact
          # defect class that crash-looped Railway on V49. Refreshing
          # the settlement list is ROUTINE maintenance (Order 376
          # changes every few weeks), which makes the unguarded path the
          # likely one to be taken. Scenarios 11 and 12 in the mirror
          # pin the two new arms.
          run_gate() {
            local base_sha="$1"
            local changed
            changed=$(git diff --name-status --diff-filter=MDRCT "${base_sha}...HEAD" -- \
              "$MIGRATION_PATH/*.sql" ":(glob)$JAVA_MIGRATION_PATH/**/V*.java" "$DATA_PATH/*.csv")
            if [ -z "$changed" ]; then
              return 0
            fi
            return 1
          }
          # =========================================================
          # END SHARED IMMUTABILITY GATE LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:immutability:END

          WORK="$(mktemp -d)"
          cd "$WORK"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI Self Test"

          mkdir -p "$MIGRATION_PATH" "$JAVA_MIGRATION_PATH" "$DATA_PATH"
          printf 'CREATE TABLE existing (id int);\n' > "$MIGRATION_PATH/V1__existing.sql"
          printf 'CREATE TABLE other (id int);\n' > "$MIGRATION_PATH/V2__other.sql"
          # A Java migration and the data resource it derives its own
          # checksum from -- the V171 shape. Scenarios 11-13 pin them.
          printf 'class V3__load {}\n' > "$JAVA_MIGRATION_PATH/V3__load.java"
          printf 'class Helper {}\n' > "$JAVA_MIGRATION_PATH/Helper.java"
          printf '"code","name"\n"UA1","A"\n' > "$DATA_PATH/rows.csv"
          printf 'notes\n' > "$DATA_PATH/README.md"
          git add -A
          git commit -q -m "base: existing migrations"
          BASE_SHA="$(git rev-parse HEAD)"
          git switch -q -c feature

          fail() { echo "SELF-TEST FAILED: $1"; exit 1; }

          # --- Scenario 1: clean diff (no migration changes) -> exit 0 ---
          git commit -q --allow-empty -m "no migration changes"
          run_gate "$BASE_SHA" || fail "clean diff should pass (exit 0)"
          echo "OK: clean diff passes"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 2: pure add of a new migration -> exit 0 ---
          printf 'CREATE TABLE new_table (id int);\n' > "$MIGRATION_PATH/V3__new.sql"
          git add -A && git commit -q -m "add new migration"
          run_gate "$BASE_SHA" || fail "add-only diff should pass (exit 0)"
          echo "OK: add-only diff passes"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 3: MODIFY an existing migration -> exit 1 ---
          printf 'CREATE TABLE existing (id int, extra text);\n' > "$MIGRATION_PATH/V1__existing.sql"
          git add -A && git commit -q -m "modify existing migration"
          if run_gate "$BASE_SHA"; then fail "modified migration should fail (exit 1)"; fi
          echo "OK: modified migration fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 4: DELETE an existing migration -> exit 1 ---
          # Exercises the 'D' filter letter explicitly. Scenario 5 (a
          # real rename) yields 'R', not 'D', so this scenario is the
          # sole dedicated 'D' coverage and must stay.
          git rm -q "$MIGRATION_PATH/V1__existing.sql"
          git commit -q -m "delete existing migration"
          if run_gate "$BASE_SHA"; then fail "deleted migration should fail (exit 1)"; fi
          echo "OK: deleted migration fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 5: real RENAME (status 'R') of an existing
          # migration -> exit 1 ---
          # `git config diff.renames true` makes git emit a true 'R'
          # status (instead of the config-less D+A pair, which would
          # only ever exercise the 'D' path and silently leave the 'R'
          # filter letter untested). This scenario genuinely exercises
          # the 'R' letter in --diff-filter=MDRCT. Identical file
          # content + a pure path change is the textbook rename git
          # detects as R100.
          git config diff.renames true
          git mv "$MIGRATION_PATH/V1__existing.sql" "$MIGRATION_PATH/V1__existing_renamed.sql"
          git commit -q -m "rename existing migration"
          # Sanity: prove git actually reports an 'R' status here, so a
          # future git/config change that downgrades it to D+A is loud.
          git diff --name-status --diff-filter=R "$BASE_SHA...HEAD" -- "$MIGRATION_PATH" \
            | grep -q '^R' || fail "scenario 5 expected a real 'R' status but git produced none"
          if run_gate "$BASE_SHA"; then fail "renamed migration should fail (exit 1)"; fi
          echo "OK: real renamed (R) migration fails"
          git config --unset diff.renames
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 6: COPY (status 'C') of an existing migration
          # -> exit 1 ---
          # `git config diff.renames copies` enables copy detection.
          # NOTE: a *pure* copy of an unmodified file is reported by
          # `git diff` (without the expensive --find-copies-harder,
          # which the gate deliberately does NOT pass) as a plain 'A'
          # add -- and that is intentionally allowed: a duplicated-
          # content file under a NEW Flyway version is a legitimate new
          # migration; version collisions are the monotonicity job's
          # concern, not immutability's. git only emits a real 'C'
          # status with the default diff when the copy SOURCE is also
          # modified. So this scenario copies an existing migration AND
          # mutates the original in the same commit: the gate then sees
          # both 'M' (the source mutation) and 'C100', genuinely
          # exercising the 'C' filter letter, and must fail (exit 1).
          git config diff.renames copies
          cp "$MIGRATION_PATH/V1__existing.sql" "$MIGRATION_PATH/V1__existing_copy.sql"
          printf 'CREATE TABLE existing (id int, copied text);\n' > "$MIGRATION_PATH/V1__existing.sql"
          git add -A && git commit -q -m "copy existing migration AND modify the source"
          # Sanity: prove git actually reports a 'C' status here using
          # the SAME diff invocation the gate uses (no --find-copies-
          # harder), so a future git/config change is loud.
          git diff --name-status --diff-filter=C "$BASE_SHA...HEAD" -- "$MIGRATION_PATH" \
            | grep -q '^C' || fail "scenario 6 expected a real 'C' status but git produced none"
          if run_gate "$BASE_SHA"; then fail "copied migration should fail (exit 1)"; fi
          echo "OK: copied (C) migration fails"
          git config --unset diff.renames
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 7: TYPE-CHANGE (status 'T') of an existing
          # migration -> exit 1 ---
          # Replace an existing regular-file V*.sql with a symlink of
          # the same name. git reports this as a 'T' (type changed)
          # status. Exercises the 'T' filter letter.
          rm "$MIGRATION_PATH/V1__existing.sql"
          ln -s /dev/null "$MIGRATION_PATH/V1__existing.sql"
          git add -A && git commit -q -m "type-change existing migration to symlink"
          # Sanity: prove git actually reports a 'T' status here.
          git diff --name-status --diff-filter=T "$BASE_SHA...HEAD" -- "$MIGRATION_PATH" \
            | grep -q '^T' || fail "scenario 7 expected a real 'T' status but git produced none"
          if run_gate "$BASE_SHA"; then fail "type-changed migration should fail (exit 1)"; fi
          echo "OK: type-changed (T) migration fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 8: MIXED add + modify in one commit -> exit 1 ---
          # A single commit that adds a brand-new V*.sql AND edits an
          # already-merged one. Proves a legitimate new migration does
          # NOT mask a co-located mutation of an existing migration.
          printf 'CREATE TABLE mixed_new (id int);\n' > "$MIGRATION_PATH/V4__mixed_new.sql"
          printf 'CREATE TABLE existing (id int, mixed text);\n' > "$MIGRATION_PATH/V1__existing.sql"
          git add -A && git commit -q -m "add new migration AND modify existing in one commit"
          if run_gate "$BASE_SHA"; then fail "mixed add+modify should fail (exit 1)"; fi
          echo "OK: mixed add+modify fails (new add does not mask the modify)"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 9: DELETE a non-migration housekeeping file
          # that lives in the migration directory -> exit 0 ---
          # A '.gitkeep' placeholder (or a README) has no Flyway
          # checksum identity, so removing it cannot break 'flyway
          # validate'. A directory-scoped pathspec used to flag this and
          # failed a real dev->main PR on the ancient deletion of the
          # original '.gitkeep'. Pins the '*.sql' scoping.
          git checkout -q "$BASE_SHA" -- . 2>/dev/null || true
          printf '' > "$MIGRATION_PATH/.gitkeep"
          git add -A && git commit -q -m "base: add .gitkeep placeholder"
          KEEP_BASE="$(git rev-parse HEAD)"
          git rm -q "$MIGRATION_PATH/.gitkeep"
          git commit -q -m "delete .gitkeep placeholder"
          run_gate "$KEEP_BASE" || fail ".gitkeep deletion must pass -- it is not a Flyway migration (exit 0)"
          echo "OK: non-migration (.gitkeep) deletion passes"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 10: a real migration deletion in the SAME
          # commit as a .gitkeep deletion -> exit 1 ---
          # Proves the '*.sql' scoping narrowed the pathspec without
          # opening a hole: the housekeeping file is ignored, the
          # co-deleted V*.sql is still caught.
          printf '' > "$MIGRATION_PATH/.gitkeep"
          git add -A && git commit -q -m "re-add .gitkeep placeholder"
          MIXED_BASE="$(git rev-parse HEAD)"
          git rm -q "$MIGRATION_PATH/.gitkeep" "$MIGRATION_PATH/V1__existing.sql"
          git commit -q -m "delete .gitkeep AND an already-merged migration"
          if run_gate "$MIXED_BASE"; then fail ".gitkeep+V1 co-deletion must still fail on the V1 deletion (exit 1)"; fi
          echo "OK: co-deleted migration still caught alongside an ignored .gitkeep"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 11: MODIFY an already-merged data CSV -> exit 1 ---
          # THE headline regression this arm exists for.
          # V171__import_free_settlements derives getChecksum() from the
          # BYTES of db/data/settlements.csv, so a routine "refresh the
          # settlement list" edit mutates an applied migration's
          # checksum and crash-loops Flyway on the next prod boot -- and
          # the pre-Phase-325 pathspec ('*.sql' only) waved it through.
          printf '"code","name"\n"UA1","A"\n"UA2","B"\n' > "$DATA_PATH/rows.csv"
          git add -A && git commit -q -m "refresh the settlement CSV"
          if run_gate "$BASE_SHA"; then fail "modified migration CSV should fail (exit 1)"; fi
          echo "OK: modified data CSV fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 12: MODIFY an already-merged Java migration
          # -> exit 1 ---
          # A Java migration carries the same checksum identity as a
          # V*.sql script (Flyway hashes the class via getChecksum()),
          # so editing one after it has run is the same outage.
          printf 'class V3__load { int x; }\n' > "$JAVA_MIGRATION_PATH/V3__load.java"
          git add -A && git commit -q -m "edit an applied Java migration"
          if run_gate "$BASE_SHA"; then fail "modified Java migration should fail (exit 1)"; fi
          echo "OK: modified Java migration fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 13: the new arms did NOT over-scope -> exit 0 ---
          # Three edits that carry no Flyway checksum identity must all
          # still pass: a brand-new CSV + a brand-new Java migration
          # (adds, filter 'A'), and an edit to a NON-V*.java helper that
          # merely lives in the Java migration package. Without this the
          # widened pathspec could block every legitimate PR that ships
          # a new data-backed migration.
          printf '"code","name"\n"UA9","Z"\n' > "$DATA_PATH/more.csv"
          printf 'class V4__next {}\n' > "$JAVA_MIGRATION_PATH/V4__next.java"
          printf 'class Helper { int y; }\n' > "$JAVA_MIGRATION_PATH/Helper.java"
          git add -A && git commit -q -m "add a new CSV + new Java migration, edit a non-migration helper"
          run_gate "$BASE_SHA" || fail "new CSV + new Java migration + helper edit must pass (exit 0)"
          echo "OK: add-only CSV/Java migration and a non-V*.java helper edit pass"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 14: a CSV mutation hidden behind a legitimate
          # new SQL migration -> exit 1 ---
          # The realistic PR shape: "ship V172 AND refresh the CSV".
          # Proves the add does not mask the co-located CSV mutation,
          # exactly as scenario 8 proves it for V*.sql.
          printf 'CREATE TABLE later (id int);\n' > "$MIGRATION_PATH/V5__later.sql"
          printf '"code","name"\n"UA1","RENAMED"\n' > "$DATA_PATH/rows.csv"
          git add -A && git commit -q -m "add V5 AND refresh the CSV in one commit"
          if run_gate "$BASE_SHA"; then fail "new migration must not mask the CSV mutation (exit 1)"; fi
          echo "OK: co-located CSV mutation still caught behind a legitimate add"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 15: migrations in SUBFOLDERS are gated too ---
          # Flyway scans db/migration recursively, so a nested file carries the
          # same checksum identity. Build a new base that already holds nested
          # files, then mutate each kind. The Java pathspec used to be
          # "$JAVA_MIGRATION_PATH/V*.java", which does not match
          # "$JAVA_MIGRATION_PATH/sub/V7__nested.java".
          mkdir -p "$MIGRATION_PATH/sub" "$JAVA_MIGRATION_PATH/sub/deep"
          printf 'CREATE TABLE nested (id int);\n' > "$MIGRATION_PATH/sub/V6__nested.sql"
          printf 'class V7__nested {}\n' > "$JAVA_MIGRATION_PATH/sub/V7__nested.java"
          printf 'class V8__deeper {}\n' > "$JAVA_MIGRATION_PATH/sub/deep/V8__deeper.java"
          printf 'class NestedHelper {}\n' > "$JAVA_MIGRATION_PATH/sub/NestedHelper.java"
          git add -A && git commit -q -m "base: nested migrations"
          BASE_SHA="$(git rev-parse HEAD)"

          printf 'CREATE TABLE nested (id int, x int);\n' > "$MIGRATION_PATH/sub/V6__nested.sql"
          git add -A && git commit -q -m "edit a nested SQL migration"
          if run_gate "$BASE_SHA"; then fail "modified nested SQL migration should fail (exit 1)"; fi
          echo "OK: modified nested SQL migration fails"
          git reset -q --hard "$BASE_SHA"

          printf 'class V7__nested { int x; }\n' > "$JAVA_MIGRATION_PATH/sub/V7__nested.java"
          git add -A && git commit -q -m "edit a nested Java migration"
          if run_gate "$BASE_SHA"; then fail "modified nested Java migration should fail (exit 1)"; fi
          echo "OK: modified nested Java migration fails"
          git reset -q --hard "$BASE_SHA"

          printf 'class V8__deeper { int x; }\n' > "$JAVA_MIGRATION_PATH/sub/deep/V8__deeper.java"
          git add -A && git commit -q -m "edit a two-level nested Java migration"
          if run_gate "$BASE_SHA"; then fail "modified two-level nested Java migration should fail (exit 1)"; fi
          echo "OK: modified two-level nested Java migration fails"
          git reset -q --hard "$BASE_SHA"

          git rm -q "$JAVA_MIGRATION_PATH/sub/V7__nested.java"
          git commit -q -m "delete a nested Java migration"
          if run_gate "$BASE_SHA"; then fail "deleted nested Java migration should fail (exit 1)"; fi
          echo "OK: deleted nested Java migration fails"
          git reset -q --hard "$BASE_SHA"

          printf 'class NestedHelper { int y; }\n' > "$JAVA_MIGRATION_PATH/sub/NestedHelper.java"
          git add -A && git commit -q -m "edit a nested non-migration helper"
          run_gate "$BASE_SHA" || fail "nested non-V helper edit must pass (exit 0)"
          echo "OK: nested non-V*.java helper edit passes"
          git reset -q --hard "$BASE_SHA"

          echo "All self-test scenarios passed."

  check-migration-version-monotonicity:
    name: Check Migration Version Monotonicity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # REQUIRED: full history so the three-dot merge-base diff
          # ("$BASE_SHA...HEAD") and "git ls-tree $BASE_SHA" can resolve.
          # Do not lower this.
          fetch-depth: 0
          persist-credentials: false

      # Event-aware base-revision resolution. This is the ONLY place
      # event type is interpreted; the gate step (and its hermetic
      # mirror) consume the resulting $BASE_SHA verbatim, so the
      # SHARED block stays byte-identical and verify-gate-mirror-parity
      # still passes.
      #   pull_request -> the PR base tip (unchanged behavior).
      #   push         -> github.event.before, the pre-push tip; the
      #                    before...HEAD diff catches a V49-style
      #                    mutation introduced by the merge-commit.
      #   zero-SHA / unresolved (branch creation, first push,
      #   force-push, shallow) -> fall back to merge-base vs
      #   origin/main, then HEAD^, and FAIL loudly if neither
      #   resolves (a poisoned push must never silently pass).
      - name: Resolve base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # >>> SHARED-BLOCK:baserev:BEGIN
          # =========================================================
          # SHARED BASE-REVISION RESOLVER LOGIC -- keep this block
          # BYTE-IDENTICAL with the copy in
          # `check-migration-version-monotonicity` and the hermetic
          # mirror in `self-test-base-revision-resolution`. The
          # `verify-gate-mirror-parity` job diffs all extracted copies
          # and fails CI if they drift, so a typo in one place is
          # caught before it can ship.
          # =========================================================
          #
          # Event-aware base-revision resolution. This is the ONLY
          # place event type is interpreted; the gate step (and its
          # hermetic mirror) consume the resulting SHA verbatim as
          # $BASE_SHA, so the gate SHARED blocks stay byte-identical.
          #   pull_request -> the PR base tip (unchanged behavior).
          #   push         -> github.event.before, the pre-push tip;
          #                    the before...HEAD diff catches a
          #                    V49-style mutation introduced by the
          #                    merge-commit.
          #   zero-SHA / unresolved (branch creation, first push,
          #   force-push, shallow) -> fall back to merge-base vs
          #   origin/main, then HEAD^, and FAIL loudly if neither
          #   resolves (a poisoned push must never silently pass).
          #
          # Reads EVENT_NAME / PR_BASE_SHA / PUSH_BEFORE_SHA from the
          # environment. Prints ONLY the resolved SHA on stdout (the
          # caller is responsible for exporting it to $GITHUB_ENV, so
          # this block is hermetic and reusable from the self-test).
          # Diagnostics go to stderr. Exits 1 (fail-loud) if no safe
          # base can be resolved.
          resolve_base_revision() {
            local zero_sha="0000000000000000000000000000000000000000"
            local candidate

            resolve_base_revision_fallback() {
              # Prefer the merge-base against the protected mainline so
              # only commits unique to this push/tip are evaluated.
              if git rev-parse --verify --quiet origin/main >/dev/null; then
                local mb
                if mb="$(git merge-base origin/main HEAD 2>/dev/null)" && [ -n "$mb" ]; then
                  printf '%s' "$mb"
                  return 0
                fi
              fi
              # Otherwise the immediate parent, if HEAD has one.
              if git rev-parse --verify --quiet "HEAD^" >/dev/null; then
                git rev-parse "HEAD^"
                return 0
              fi
              return 1
            }

            if [ "${EVENT_NAME:-}" = "pull_request" ]; then
              candidate="${PR_BASE_SHA:-}"
            else
              candidate="${PUSH_BEFORE_SHA:-}"
            fi

            # Treat the zero-SHA sentinel or any non-resolvable value
            # as unresolved and fall back; never let it silently pass.
            if [ -z "$candidate" ] || [ "$candidate" = "$zero_sha" ] \
               || ! git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
              echo "Base revision '$candidate' for event '${EVENT_NAME:-}' is unresolved (zero-SHA, missing, or shallow). Falling back." >&2
              if ! candidate="$(resolve_base_revision_fallback)"; then
                echo "ERROR: could not resolve any safe base revision (no origin/main merge-base and no HEAD parent)." >&2
                echo "Refusing to pass the migration gate without a base to diff against." >&2
                return 1
              fi
              echo "Resolved fallback base revision: $candidate" >&2
            fi

            printf '%s' "$candidate"
            return 0
          }
          # =========================================================
          # END SHARED BASE-REVISION RESOLVER LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:baserev:END

          if ! BASE_SHA="$(resolve_base_revision)"; then
            exit 1
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Using BASE_SHA=$BASE_SHA (event=$EVENT_NAME)"

      - name: Enforce monotonic, non-duplicate Flyway versions
        run: |
          set -euo pipefail

          MIGRATION_PATH="src/main/resources/db/migration"

          # >>> SHARED-BLOCK:monotonicity:BEGIN
          # =========================================================
          # SHARED PARSE+GATE LOGIC -- keep this block BYTE-IDENTICAL
          # with the mirror in `self-test-version-monotonicity-gate`
          # so a typo or semantic drift in one place is caught by the
          # hermetic self-test before it can ship. The hermetic
          # `verify-gate-mirror-parity` job diffs the two extracted
          # copies and fails CI if they drift.
          # =========================================================
          #
          # Parse a Flyway *versioned* migration filename into a
          # normalized, zero-padded, dot-joined numeric key suitable
          # for plain string comparison.  Flyway version grammar:
          # leading 'V', then the version, then '__', then the
          # description.  Within the version, '.' and '_' are
          # interchangeable segment separators (V2_1 == V2.1) and each
          # segment is a non-negative integer.  Every segment is
          # zero-padded to 10 digits, so a lexical compare of two keys
          # equals Flyway's numeric, segment-wise ordering -- this is
          # exactly what makes V9 (...0009) sort BEFORE V10 (...0010)
          # instead of the wrong lexical "10" < "9".  Repeatable (R__)
          # and any non-versioned file yields an empty key so callers
          # skip it (Flyway does not order repeatables by version).
          parse_version_key() {
            local name="$1"
            local base="${name##*/}"
            case "$base" in
              V*__*.sql) : ;;
              *) printf '' ; return 0 ;;
            esac
            local ver="${base#V}"
            ver="${ver%%__*}"
            case "$ver" in
              ''|*[!0-9._]*) printf '' ; return 0 ;;
            esac
            local key="" seg pad rest="$ver"
            rest="${rest//_/.}"
            local IFS=.
            for seg in $rest; do
              [ -z "$seg" ] && seg=0
              # ACCEPTED LIMITATION (INFO): "10#$seg" forces base-10 so
              # a leading-zero segment is not parsed as octal. It still
              # overflows a 64-bit signed integer for a >=19-digit (and
              # certainly any >=26-digit) segment. Unreachable for real
              # Flyway versions, which are small integers -- documented,
              # not silently relied upon.
              printf -v pad '%010d' "$((10#$seg))"
              key="${key}.${pad}"
            done
            printf '%s' "${key#.}"
          }

          # Run the monotonicity + duplicate gate for a merge-base SHA.
          # Pure git + shell, NO database.  Returns 0 on pass, 1 on
          # violation, and prints a developer-facing diagnostic naming
          # the offending file(s) and the conflicting/blocking version.
          run_version_gate() {
            local base_sha="$1"
            local added_file added_key blocking_key="" blocking_file=""
            local violations=0 k

            # Highest migration version already present at the
            # merge-base (the state that is effectively already
            # merged on the base branch).
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              k="$(parse_version_key "$f")"
              [ -z "$k" ] && continue
              if [ -z "$blocking_key" ] || [ "$k" \> "$blocking_key" ]; then
                blocking_key="$k"
                blocking_file="$f"
              fi
            done <<EOF
          $(git ls-tree -r --name-only "$base_sha" -- "$MIGRATION_PATH" 2>/dev/null || true)
          EOF

            # Files ADDED on this branch relative to the merge-base.
            # Use --name-only (no status column) so filenames containing
            # whitespace are NOT truncated by an awk field split -- a
            # migration added as 'V5__has space.sql' must still reach
            # parse_version_key intact and be evaluated by the gate.
            # ACCEPTED LIMITATION (INFO): --name-only would still split
            # on an *embedded newline* inside a filename (the read loop
            # is newline-delimited). Unreachable for Flyway filenames,
            # whose grammar forbids newlines -- documented, not relied
            # upon silently.
            local added_list
            added_list="$(git diff --name-only --diff-filter=A "${base_sha}...HEAD" -- "$MIGRATION_PATH")"

            # (1)+(2) Monotonicity: every newly-added version must be
            # strictly greater than the highest already-merged version.
            while IFS= read -r added_file; do
              [ -z "$added_file" ] && continue
              added_key="$(parse_version_key "$added_file")"
              [ -z "$added_key" ] && continue
              if [ -n "$blocking_key" ] && { [ "$added_key" \< "$blocking_key" ] || [ "$added_key" = "$blocking_key" ]; }; then
                echo "ERROR: new migration '$added_file' has a version <= the highest"
                echo "       already-merged migration. Flyway runs with out-of-order"
                echo "       DISABLED, so this would fail 'flyway validate' at app startup."
                echo "       blocked by already-merged: '$blocking_file'"
                echo "       Renumber your migration ABOVE the current highest version."
                violations=1
              fi
            done <<EOF
          $added_list
          EOF

            # (3) No duplicate versions across the full HEAD set
            # (existing + newly added). Two files mapping to the same
            # parsed version key collide in Flyway's version space.
            local dup
            dup="$(
              git ls-tree -r --name-only HEAD -- "$MIGRATION_PATH" 2>/dev/null \
                | while IFS= read -r f; do
                    [ -z "$f" ] && continue
                    k="$(parse_version_key "$f")"
                    [ -z "$k" ] && continue
                    printf '%s\t%s\n' "$k" "$f"
                  done \
                | sort \
                | awk -F'\t' '{ if ($1==prev) { print prevf; print $2 } prev=$1; prevf=$2 }' \
                | sort -u
            )"
            if [ -n "$dup" ]; then
              echo "ERROR: two Flyway migrations share the same parsed version:"
              echo "$dup"
              echo "       Each migration version must be unique."
              violations=1
            fi

            return "$violations"
          }
          # =========================================================
          # END SHARED PARSE+GATE LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:monotonicity:END

          if run_version_gate "$BASE_SHA"; then
            echo "Flyway migration versions are monotonic and unique. Check passed."
            exit 0
          fi

          echo ""
          echo "Out-of-order or duplicate Flyway migration version detected."
          echo "Flyway in this project validates with out-of-order DISABLED;"
          echo "an out-of-order or duplicate version passes file-immutability"
          echo "but FAILS 'flyway validate' on the next deploy."
          echo "Rebase onto the base branch and renumber above the highest version."
          exit 1

  self-test-version-monotonicity-gate:
    name: Self-test Version Monotonicity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Assert version gate fails on out-of-order / duplicate and passes on clean / new-highest
        run: |
          set -euo pipefail

          MIGRATION_PATH="src/main/resources/db/migration"

          # >>> SHARED-BLOCK:monotonicity:BEGIN
          # =========================================================
          # SHARED PARSE+GATE LOGIC -- keep this block BYTE-IDENTICAL
          # with the mirror in `self-test-version-monotonicity-gate`
          # so a typo or semantic drift in one place is caught by the
          # hermetic self-test before it can ship. The hermetic
          # `verify-gate-mirror-parity` job diffs the two extracted
          # copies and fails CI if they drift.
          # =========================================================
          #
          # Parse a Flyway *versioned* migration filename into a
          # normalized, zero-padded, dot-joined numeric key suitable
          # for plain string comparison.  Flyway version grammar:
          # leading 'V', then the version, then '__', then the
          # description.  Within the version, '.' and '_' are
          # interchangeable segment separators (V2_1 == V2.1) and each
          # segment is a non-negative integer.  Every segment is
          # zero-padded to 10 digits, so a lexical compare of two keys
          # equals Flyway's numeric, segment-wise ordering -- this is
          # exactly what makes V9 (...0009) sort BEFORE V10 (...0010)
          # instead of the wrong lexical "10" < "9".  Repeatable (R__)
          # and any non-versioned file yields an empty key so callers
          # skip it (Flyway does not order repeatables by version).
          parse_version_key() {
            local name="$1"
            local base="${name##*/}"
            case "$base" in
              V*__*.sql) : ;;
              *) printf '' ; return 0 ;;
            esac
            local ver="${base#V}"
            ver="${ver%%__*}"
            case "$ver" in
              ''|*[!0-9._]*) printf '' ; return 0 ;;
            esac
            local key="" seg pad rest="$ver"
            rest="${rest//_/.}"
            local IFS=.
            for seg in $rest; do
              [ -z "$seg" ] && seg=0
              # ACCEPTED LIMITATION (INFO): "10#$seg" forces base-10 so
              # a leading-zero segment is not parsed as octal. It still
              # overflows a 64-bit signed integer for a >=19-digit (and
              # certainly any >=26-digit) segment. Unreachable for real
              # Flyway versions, which are small integers -- documented,
              # not silently relied upon.
              printf -v pad '%010d' "$((10#$seg))"
              key="${key}.${pad}"
            done
            printf '%s' "${key#.}"
          }

          # Run the monotonicity + duplicate gate for a merge-base SHA.
          # Pure git + shell, NO database.  Returns 0 on pass, 1 on
          # violation, and prints a developer-facing diagnostic naming
          # the offending file(s) and the conflicting/blocking version.
          run_version_gate() {
            local base_sha="$1"
            local added_file added_key blocking_key="" blocking_file=""
            local violations=0 k

            # Highest migration version already present at the
            # merge-base (the state that is effectively already
            # merged on the base branch).
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              k="$(parse_version_key "$f")"
              [ -z "$k" ] && continue
              if [ -z "$blocking_key" ] || [ "$k" \> "$blocking_key" ]; then
                blocking_key="$k"
                blocking_file="$f"
              fi
            done <<EOF
          $(git ls-tree -r --name-only "$base_sha" -- "$MIGRATION_PATH" 2>/dev/null || true)
          EOF

            # Files ADDED on this branch relative to the merge-base.
            # Use --name-only (no status column) so filenames containing
            # whitespace are NOT truncated by an awk field split -- a
            # migration added as 'V5__has space.sql' must still reach
            # parse_version_key intact and be evaluated by the gate.
            # ACCEPTED LIMITATION (INFO): --name-only would still split
            # on an *embedded newline* inside a filename (the read loop
            # is newline-delimited). Unreachable for Flyway filenames,
            # whose grammar forbids newlines -- documented, not relied
            # upon silently.
            local added_list
            added_list="$(git diff --name-only --diff-filter=A "${base_sha}...HEAD" -- "$MIGRATION_PATH")"

            # (1)+(2) Monotonicity: every newly-added version must be
            # strictly greater than the highest already-merged version.
            while IFS= read -r added_file; do
              [ -z "$added_file" ] && continue
              added_key="$(parse_version_key "$added_file")"
              [ -z "$added_key" ] && continue
              if [ -n "$blocking_key" ] && { [ "$added_key" \< "$blocking_key" ] || [ "$added_key" = "$blocking_key" ]; }; then
                echo "ERROR: new migration '$added_file' has a version <= the highest"
                echo "       already-merged migration. Flyway runs with out-of-order"
                echo "       DISABLED, so this would fail 'flyway validate' at app startup."
                echo "       blocked by already-merged: '$blocking_file'"
                echo "       Renumber your migration ABOVE the current highest version."
                violations=1
              fi
            done <<EOF
          $added_list
          EOF

            # (3) No duplicate versions across the full HEAD set
            # (existing + newly added). Two files mapping to the same
            # parsed version key collide in Flyway's version space.
            local dup
            dup="$(
              git ls-tree -r --name-only HEAD -- "$MIGRATION_PATH" 2>/dev/null \
                | while IFS= read -r f; do
                    [ -z "$f" ] && continue
                    k="$(parse_version_key "$f")"
                    [ -z "$k" ] && continue
                    printf '%s\t%s\n' "$k" "$f"
                  done \
                | sort \
                | awk -F'\t' '{ if ($1==prev) { print prevf; print $2 } prev=$1; prevf=$2 }' \
                | sort -u
            )"
            if [ -n "$dup" ]; then
              echo "ERROR: two Flyway migrations share the same parsed version:"
              echo "$dup"
              echo "       Each migration version must be unique."
              violations=1
            fi

            return "$violations"
          }
          # =========================================================
          # END SHARED PARSE+GATE LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:monotonicity:END

          WORK="$(mktemp -d)"
          cd "$WORK"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI Self Test"

          mkdir -p "$MIGRATION_PATH"
          printf 'CREATE TABLE a (id int);\n' > "$MIGRATION_PATH/V1__a.sql"
          printf 'CREATE TABLE b (id int);\n' > "$MIGRATION_PATH/V9__b.sql"
          printf 'CREATE TABLE c (id int);\n' > "$MIGRATION_PATH/V10__c.sql"
          git add -A
          git commit -q -m "base: V1, V9, V10 (max merged = V10)"
          BASE_SHA="$(git rev-parse HEAD)"
          git switch -q -c feature

          fail() { echo "SELF-TEST FAILED: $1"; exit 1; }

          # --- Scenario 1: clean diff (no migration changes) -> pass ---
          git commit -q --allow-empty -m "no migration changes"
          run_version_gate "$BASE_SHA" >/dev/null || fail "clean diff should pass (exit 0)"
          echo "OK: clean diff passes"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 2: new HIGHEST version (V11) -> pass ---
          printf 'CREATE TABLE d (id int);\n' > "$MIGRATION_PATH/V11__d.sql"
          git add -A && git commit -q -m "add V11"
          run_version_gate "$BASE_SHA" >/dev/null || fail "new highest version should pass (exit 0)"
          echo "OK: new highest version (V11) passes"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 3: new version LOWER than merged max (V5 < V10) -> fail ---
          printf 'CREATE TABLE e (id int);\n' > "$MIGRATION_PATH/V5__e.sql"
          git add -A && git commit -q -m "add V5 behind merged V10"
          if run_version_gate "$BASE_SHA" >/dev/null; then fail "version <= merged max should fail (exit 1)"; fi
          echo "OK: lower version (V5 < merged V10) fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 4: new version EQUAL to merged max (V10) -> fail ---
          printf 'CREATE TABLE f (id int);\n' > "$MIGRATION_PATH/V10__dup.sql"
          git add -A && git commit -q -m "add V10 duplicate"
          if run_version_gate "$BASE_SHA" >/dev/null; then fail "duplicate of merged max should fail (exit 1)"; fi
          echo "OK: duplicate version (V10 == merged V10) fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 5: numeric (not lexical) ordering V9 vs V10 ---
          # Lexically "9" > "10"; numerically 9 < 10. A genuinely new
          # V9 added after merged V10 must FAIL -> proves numeric compare.
          git rm -q "$MIGRATION_PATH/V9__b.sql"
          git commit -q -m "drop V9 so the re-add is a genuine add"
          printf 'CREATE TABLE g (id int);\n' > "$MIGRATION_PATH/V9__g.sql"
          git add -A && git commit -q -m "re-add V9 after merged V10 exists"
          if run_version_gate "$BASE_SHA" >/dev/null; then fail "V9 after merged V10 must fail numerically (exit 1)"; fi
          echo "OK: numeric ordering enforced (V9 < V10, not lexical)"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 6: two NEW files above max sharing a version -> fail ---
          printf 'x\n' > "$MIGRATION_PATH/V20__x.sql"
          printf 'y\n' > "$MIGRATION_PATH/V20__y.sql"
          git add -A && git commit -q -m "two new files both V20"
          if run_version_gate "$BASE_SHA" >/dev/null; then fail "two new files sharing a version should fail (exit 1)"; fi
          echo "OK: duplicate among newly-added files fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 7: dotted/underscore version above max (V10_1) -> pass ---
          printf 'z\n' > "$MIGRATION_PATH/V10_1__patch.sql"
          git add -A && git commit -q -m "add V10_1 patch (> V10)"
          run_version_gate "$BASE_SHA" >/dev/null || fail "V10_1 (> V10) should pass (exit 0)"
          echo "OK: dotted version V10_1 > V10 passes"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 8: non-versioned repeatable migration added -> pass ---
          printf 'r\n' > "$MIGRATION_PATH/R__refresh_view.sql"
          git add -A && git commit -q -m "add repeatable migration"
          run_version_gate "$BASE_SHA" >/dev/null || fail "repeatable (R__) migration should be ignored (exit 0)"
          echo "OK: repeatable (R__) migration ignored"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 9: spaced filename out-of-order (V5 < V10) -> fail ---
          # A filename containing a space must NOT be truncated by the
          # added-file extraction; it must reach parse_version_key whole
          # so an out-of-order spaced migration still FAILS the gate.
          printf 'CREATE TABLE h (id int);\n' > "$MIGRATION_PATH/V5__has space.sql"
          git add -A && git commit -q -m "add spaced V5 behind merged V10"
          if run_version_gate "$BASE_SHA" >/dev/null; then fail "spaced out-of-order migration must fail (exit 1)"; fi
          echo "OK: spaced out-of-order migration (V5__has space.sql < V10) fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 10: underscore<->dot equivalence collision -> fail ---
          # V20_1 and V20.1 normalize to the SAME parsed key (the
          # '_'->'.' rewrite is load-bearing). Both are above merged max
          # so monotonicity alone would pass; the duplicate-detection
          # arm must still FAIL them as a version-space collision.
          printf 'p\n' > "$MIGRATION_PATH/V20_1__a.sql"
          printf 'q\n' > "$MIGRATION_PATH/V20.1__b.sql"
          git add -A && git commit -q -m "V20_1 and V20.1 collide after normalization"
          if run_version_gate "$BASE_SHA" >/dev/null; then fail "underscore/dot equivalence collision must fail (exit 1)"; fi
          echo "OK: V20_1 vs V20.1 normalization collision fails"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 11: undo migration (U*) added -> pass/ignored ---
          # Undo migrations are not version-ordered by Flyway's forward
          # validate path; parse_version_key only matches 'V*__*.sql',
          # so a 'U*__*.sql' yields an empty key and is skipped. Pins
          # the "undo not version-ordered" contract alongside R__ (8).
          printf 'u\n' > "$MIGRATION_PATH/U10__undo_c.sql"
          git add -A && git commit -q -m "add undo migration U10"
          run_version_gate "$BASE_SHA" >/dev/null || fail "undo (U*) migration should be ignored (exit 0)"
          echo "OK: undo (U*) migration ignored"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 12: first-ever migration on an empty base -> pass ---
          # Build a SECOND base with NO migration directory at all, then
          # add the very first V1 migration. With no already-merged
          # version there is no blocking_key, so the first migration
          # must PASS.
          EMPTY_WORK="$(mktemp -d)"
          (
            cd "$EMPTY_WORK"
            git init -q
            git config user.email "ci@example.com"
            git config user.name "CI Self Test"
            git commit -q --allow-empty -m "empty base: no migration dir"
            EMPTY_BASE="$(git rev-parse HEAD)"
            git switch -q -c feature
            mkdir -p "$MIGRATION_PATH"
            printf 'CREATE TABLE first (id int);\n' > "$MIGRATION_PATH/V1__first.sql"
            git add -A && git commit -q -m "add first-ever migration V1"
            run_version_gate "$EMPTY_BASE" >/dev/null || fail "first-ever migration on empty base should pass (exit 0)"
          )
          echo "OK: first-ever migration on an empty base passes"
          rm -rf "$EMPTY_WORK"

          # --- Scenario 13: new-highest + modify-existing in same PR ->
          # version gate PASSES ---
          # Monotonicity is ORTHOGONAL to immutability. A PR that adds a
          # new highest version (V11) while also editing an existing
          # migration (V1) must PASS the *version* gate -- the edit is
          # the immutability job's concern, not this one. This pins that
          # separation of duties so a future change does not accidentally
          # couple the two gates.
          printf 'CREATE TABLE k (id int);\n' > "$MIGRATION_PATH/V11__k.sql"
          printf 'CREATE TABLE a (id int, extra text);\n' > "$MIGRATION_PATH/V1__a.sql"
          git add -A && git commit -q -m "add new highest V11 AND modify existing V1"
          run_version_gate "$BASE_SHA" >/dev/null || fail "new-highest + modify-existing must PASS the version gate (orthogonal to immutability)"
          echo "OK: new-highest + modify-existing passes the version gate (orthogonal to immutability)"
          git reset -q --hard "$BASE_SHA"

          # --- Scenario 14: migrations in SUBFOLDERS are version-gated too ---
          # Flyway scans db/migration recursively. Both the merged-highest scan
          # (git ls-tree -r) and the added-files scan use the directory pathspec
          # and parse the BASENAME, so nesting must not hide a bad version.
          mkdir -p "$MIGRATION_PATH/sub"
          printf 'CREATE TABLE n1 (id int);\n' > "$MIGRATION_PATH/sub/V5__nested_low.sql"
          git add -A && git commit -q -m "add nested out-of-order V5"
          if run_version_gate "$BASE_SHA" >/dev/null; then fail "nested out-of-order version must FAIL the version gate"; fi
          echo "OK: nested out-of-order version fails"
          git reset -q --hard "$BASE_SHA"

          mkdir -p "$MIGRATION_PATH/sub"
          printf 'CREATE TABLE n2 (id int);\n' > "$MIGRATION_PATH/sub/V10__nested_dup.sql"
          git add -A && git commit -q -m "add nested duplicate V10"
          if run_version_gate "$BASE_SHA" >/dev/null; then fail "nested duplicate version must FAIL the version gate"; fi
          echo "OK: nested duplicate version fails"
          git reset -q --hard "$BASE_SHA"

          mkdir -p "$MIGRATION_PATH/sub"
          printf 'CREATE TABLE n3 (id int);\n' > "$MIGRATION_PATH/sub/V12__nested_ok.sql"
          git add -A && git commit -q -m "add nested new-highest V12"
          run_version_gate "$BASE_SHA" >/dev/null || fail "nested new-highest version must PASS the version gate"
          echo "OK: nested new-highest version passes"
          git reset -q --hard "$BASE_SHA"

          echo "All version-monotonicity self-test scenarios passed."

  self-test-base-revision-resolution:
    name: Self-test Base Revision Resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hermetic: no checkout, only throwaway git repos in $TMPDIR, so the token needs no scope at all.
    permissions: {}

    steps:
      - name: Assert the resolver picks the right base per event and fails loud when none resolves
        run: |
          set -euo pipefail

          # >>> SHARED-BLOCK:baserev:BEGIN
          # =========================================================
          # SHARED BASE-REVISION RESOLVER LOGIC -- keep this block
          # BYTE-IDENTICAL with the copy in
          # `check-migration-version-monotonicity` and the hermetic
          # mirror in `self-test-base-revision-resolution`. The
          # `verify-gate-mirror-parity` job diffs all extracted copies
          # and fails CI if they drift, so a typo in one place is
          # caught before it can ship.
          # =========================================================
          #
          # Event-aware base-revision resolution. This is the ONLY
          # place event type is interpreted; the gate step (and its
          # hermetic mirror) consume the resulting SHA verbatim as
          # $BASE_SHA, so the gate SHARED blocks stay byte-identical.
          #   pull_request -> the PR base tip (unchanged behavior).
          #   push         -> github.event.before, the pre-push tip;
          #                    the before...HEAD diff catches a
          #                    V49-style mutation introduced by the
          #                    merge-commit.
          #   zero-SHA / unresolved (branch creation, first push,
          #   force-push, shallow) -> fall back to merge-base vs
          #   origin/main, then HEAD^, and FAIL loudly if neither
          #   resolves (a poisoned push must never silently pass).
          #
          # Reads EVENT_NAME / PR_BASE_SHA / PUSH_BEFORE_SHA from the
          # environment. Prints ONLY the resolved SHA on stdout (the
          # caller is responsible for exporting it to $GITHUB_ENV, so
          # this block is hermetic and reusable from the self-test).
          # Diagnostics go to stderr. Exits 1 (fail-loud) if no safe
          # base can be resolved.
          resolve_base_revision() {
            local zero_sha="0000000000000000000000000000000000000000"
            local candidate

            resolve_base_revision_fallback() {
              # Prefer the merge-base against the protected mainline so
              # only commits unique to this push/tip are evaluated.
              if git rev-parse --verify --quiet origin/main >/dev/null; then
                local mb
                if mb="$(git merge-base origin/main HEAD 2>/dev/null)" && [ -n "$mb" ]; then
                  printf '%s' "$mb"
                  return 0
                fi
              fi
              # Otherwise the immediate parent, if HEAD has one.
              if git rev-parse --verify --quiet "HEAD^" >/dev/null; then
                git rev-parse "HEAD^"
                return 0
              fi
              return 1
            }

            if [ "${EVENT_NAME:-}" = "pull_request" ]; then
              candidate="${PR_BASE_SHA:-}"
            else
              candidate="${PUSH_BEFORE_SHA:-}"
            fi

            # Treat the zero-SHA sentinel or any non-resolvable value
            # as unresolved and fall back; never let it silently pass.
            if [ -z "$candidate" ] || [ "$candidate" = "$zero_sha" ] \
               || ! git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
              echo "Base revision '$candidate' for event '${EVENT_NAME:-}' is unresolved (zero-SHA, missing, or shallow). Falling back." >&2
              if ! candidate="$(resolve_base_revision_fallback)"; then
                echo "ERROR: could not resolve any safe base revision (no origin/main merge-base and no HEAD parent)." >&2
                echo "Refusing to pass the migration gate without a base to diff against." >&2
                return 1
              fi
              echo "Resolved fallback base revision: $candidate" >&2
            fi

            printf '%s' "$candidate"
            return 0
          }
          # =========================================================
          # END SHARED BASE-REVISION RESOLVER LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:baserev:END

          MIGRATION_PATH="src/main/resources/db/migration"
          JAVA_MIGRATION_PATH="src/main/java/db/migration"
          DATA_PATH="src/main/resources/db/data"

          # Local copy of the REAL immutability gate one-liner. This is
          # deliberately NOT wrapped in a SHARED-BLOCK:immutability
          # sentinel: that id must keep EXACTLY two occurrences (the
          # production gate + its dedicated mirror) so check_pair
          # immutability stays valid. Scenario 2 still exercises the
          # genuine `git diff --diff-filter=MDRCT base...HEAD` behavior
          # end-to-end on a real V49 mutation -- the headline
          # regression that crash-looped Railway. Kept behaviourally
          # in sync with the shared block, including the three-arm
          # pathspec scoping ('*.sql' + '**/V*.java' + '*.csv').
          run_gate() {
            local base_sha="$1"
            local changed
            changed=$(git diff --name-status --diff-filter=MDRCT "${base_sha}...HEAD" -- \
              "$MIGRATION_PATH/*.sql" ":(glob)$JAVA_MIGRATION_PATH/**/V*.java" "$DATA_PATH/*.csv")
            if [ -z "$changed" ]; then
              return 0
            fi
            return 1
          }

          fail() { echo "SELF-TEST FAILED: $1"; exit 1; }

          # Hermetic repo: no checkout, no network.
          WORK="$(mktemp -d)"
          cd "$WORK"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI Self Test"

          mkdir -p "$MIGRATION_PATH"
          printf 'CREATE TABLE existing (id int);\n' > "$MIGRATION_PATH/V49__existing.sql"
          git add -A
          git commit -q -m "base tip (pre-push 'before')"
          BEFORE_SHA="$(git rev-parse HEAD)"

          printf 'CREATE TABLE next_table (id int);\n' > "$MIGRATION_PATH/V50__next.sql"
          git add -A
          git commit -q -m "advance HEAD with a clean add (acts as merge tip)"
          HEAD_SHA="$(git rev-parse HEAD)"

          # --- Scenario 1: pull_request + valid PR base -> PR_BASE_SHA ---
          OUT="$(EVENT_NAME=pull_request PR_BASE_SHA="$BEFORE_SHA" PUSH_BEFORE_SHA="$HEAD_SHA" resolve_base_revision)"
          [ "$OUT" = "$BEFORE_SHA" ] || fail "pull_request must resolve to PR_BASE_SHA (got '$OUT', want '$BEFORE_SHA')"
          echo "OK: pull_request resolves to PR_BASE_SHA"

          # --- Scenario 2: push + valid before -> PUSH_BEFORE_SHA, then
          # feed it through the REAL immutability gate on a planted V49
          # modify across before...HEAD -> MUST exit 1 (the headline
          # regression that crash-looped Railway, now executable). ---
          OUT="$(EVENT_NAME=push PR_BASE_SHA="" PUSH_BEFORE_SHA="$BEFORE_SHA" resolve_base_revision)"
          [ "$OUT" = "$BEFORE_SHA" ] || fail "push must resolve to PUSH_BEFORE_SHA (got '$OUT', want '$BEFORE_SHA')"
          # Plant a V49-style mutation on top of HEAD: the merge tip
          # edits an already-merged migration. before...HEAD must catch it.
          printf 'CREATE TABLE existing (id int, poisoned text);\n' > "$MIGRATION_PATH/V49__existing.sql"
          git add -A
          git commit -q -m "merge-commit mutates already-merged V49 (the Railway crash-loop)"
          POISONED_HEAD="$(git rev-parse HEAD)"
          if run_gate "$OUT"; then
            fail "push->V49-modify across before...HEAD MUST fail the immutability gate (exit 1)"
          fi
          echo "OK: push resolves to PUSH_BEFORE_SHA and the V49 mutation trips the real gate (exit 1)"
          git reset -q --hard "$HEAD_SHA"

          # --- Scenario 3: push + zero-SHA before, origin/main present
          # -> falls back to merge-base origin/main HEAD ---
          ZERO_SHA="0000000000000000000000000000000000000000"
          git branch -f main "$BEFORE_SHA"
          # Simulate a remote-tracking ref the resolver looks for.
          git update-ref refs/remotes/origin/main "$BEFORE_SHA"
          EXPECTED_MB="$(git merge-base origin/main HEAD)"
          OUT="$(EVENT_NAME=push PR_BASE_SHA="" PUSH_BEFORE_SHA="$ZERO_SHA" resolve_base_revision)"
          [ "$OUT" = "$EXPECTED_MB" ] || fail "zero-SHA push with origin/main must fall back to merge-base (got '$OUT', want '$EXPECTED_MB')"
          echo "OK: zero-SHA + origin/main falls back to merge-base origin/main HEAD"
