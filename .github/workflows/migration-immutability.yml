          #     one-shot contract steps, a header could not express "the earlier expand
          #     migration", and they would otherwise be a silent hole in this gate.
          #   * Java: an added V*.java at any depth under src/main/java/db/migration is not
          #     parsed; it must carry `// contract-of: V<n>` (destructive) or
          #     `// non-destructive` (author's statement), otherwise the gate fails.
          #   * SQL `-- non-destructive` marker: same semantics as the Java one. A line that is
          #     EXACTLY `-- non-destructive` (surrounding whitespace only, nothing after it) is the
          #     author's statement that a parser hit is a false positive, e.g. an ADD CHECK / CREATE
          #     UNIQUE INDEX on a column the SAME file adds NULL, which no existing row or
          #     previous-app write can violate. The file is then not judged. Put the reason on the
          #     next comment line; review owns it. It replaces abusing `-- contract-of: V<n>` as an
          #     escape hatch for such files.
          #
          # SQL is read by ONE left-to-right tokenizer (no regex stripping, which
          # was evadable: `VALUES ('--'); DROP TABLE x;` hid the DROP behind a
          # fake comment). It understands: '...' with '' escapes,
          # E'...' with backslash escapes, U&'...' (Unicode-escape strings), "quoted
          # identifiers" with "" escapes (U&"..." identifiers tokenize the same way, the
          # U& stays in the code text), $tag$...$tag$ dollar quoting, -- comments and
          # NESTED /* */ comments. The dollar-tag scan is a linear \G match (a
          # substr($s,$i) copy per `$` made a 5 MB run of `$` quadratic).
          # FAIL CLOSED: an unbalanced quote, dollar tag or comment makes the whole
          # file destructive (reason UNPARSEABLE).
          #
          # Each statement (split on top-level ;) is DESTRUCTIVE when its code
          # (comments dropped, literals blanked) contains:
          #   DROP <anything>, EXCEPT an allow-list. EVERY DROP <kind> is destructive
          #       (TABLE, SEQUENCE, TYPE, DOMAIN, VIEW, FUNCTION, TRIGGER, SCHEMA, EXTENSION,
          #       OWNED BY, FOREIGN TABLE, POLICY, RULE, AGGREGATE, COLUMN, a bare/quoted
          #       column name, ... and kinds nobody has thought of yet) unless <kind> is:
          #         inside an ALTER statement: INDEX | CONSTRAINT | DEFAULT | NOT NULL |
          #                                    EXPRESSION | IDENTITY
          #         at top level:              INDEX
          #       INDEX / EXPRESSION / IDENTITY are non-reserved words, so a column can be
          #       named that. `ALTER TABLE t DROP identity;` (directly followed by `,`,
          #       `;`, CASCADE or RESTRICT, and NOT preceded by `ALTER [COLUMN] <col>`) is
          #       a column drop and is flagged; `ALTER COLUMN c DROP IDENTITY` is allowed.
          #   TRUNCATE
          #   RENAME (table, column, constraint, index, ...). Index renames are
          #       deliberately kept destructive (fail closed): add a contract-of
          #       header if the rename is intentional.
          #   SET NOT NULL
          #   ALTER [COLUMN] <col> [SET DATA] TYPE
          #   ADD [CONSTRAINT <name>] CHECK | UNIQUE | PRIMARY KEY | FOREIGN KEY |
          #       EXCLUDE, and ADD ... REFERENCES (existing rows / the previous
          #       app version's writes can violate it)
          #   CREATE UNIQUE INDEX (same reason)
          #   SET SCHEMA (the previous app version still addresses the old schema)
          #   DROP INDEX / DROP CONSTRAINT of a UNIQUE or PRIMARY KEY or EXCLUDE object, or of a
          #       DYNAMICALLY named one: a rollback runs the previous app against a schema
          #       without it, and its ON CONFLICT (cols) then fails (e.g. DeviceTokenRepository's
          #       ON CONFLICT (token) needs ux_device_tokens_token). The object name is read
          #       after IF EXISTS / CONCURRENTLY, schema prefix ignored, and all comma-listed
          #       DROP INDEX names are checked. Destructive when the name matches
