          git branch -D main >/dev/null 2>&1 || true

          # --- Scenario 4: zero-SHA, no origin/main, HEAD^ exists
          # -> falls back to HEAD^ ---
          EXPECTED_PARENT="$(git rev-parse 'HEAD^')"
          OUT="$(EVENT_NAME=push PR_BASE_SHA="" PUSH_BEFORE_SHA="$ZERO_SHA" resolve_base_revision)"
          [ "$OUT" = "$EXPECTED_PARENT" ] || fail "zero-SHA push with no origin/main must fall back to HEAD^ (got '$OUT', want '$EXPECTED_PARENT')"
          echo "OK: zero-SHA + no origin/main falls back to HEAD^"

