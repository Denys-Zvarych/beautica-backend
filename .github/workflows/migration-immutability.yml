                push @cl, $cur;
                for my $cl (@cl) {
                  next unless $cl =~ /\bADD\s+(?:(COLUMN)\s+)?(?:IF\s+NOT\s+EXISTS\s+)?("q"|\w+)\s+(.*)\z/is;
                  my ($explicit, $name, $rest) = ($1, $2, $3);
                  next if !$explicit && uc($name) =~ /\A(?:CONSTRAINT|CHECK|UNIQUE|PRIMARY|FOREIGN|EXCLUDE|NOT)\z/;
                  $rest =~ s/\bIS\s+NOT\s+NULL\b//ig;
                  # DEFAULT NULL (also (NULL), NULL::type) is no usable default for NOT NULL.
                  $rest =~ s/\bDEFAULT\s*(?:\(\s*NULL(?:\s*::\s*\w+)?\s*\)|NULL\b(?:\s*::\s*\w+)?)//ig;
                  next unless $rest =~ /\bNOT\s+NULL\b/i;
                  next if $rest =~ /\b(?:DEFAULT|GENERATED)\b/i;
                  return 1;
                }
                return 0;
              }

              sub ddl_shape_reason {
                my ($c) = @_;
                my $id = qr/(?:"q"|[\w.%]+)/;
                my $nm = qr/$id(?:\s*\([^()]*\))?/;
                if ($c =~ /\A\s*DROP\s+(?:TABLE|VIEW|MATERIALIZED\s+VIEW|SEQUENCE|TYPE|DOMAIN|FUNCTION|PROCEDURE|SCHEMA|EXTENSION|TRIGGER|POLICY|RULE|AGGREGATE|FOREIGN\s+TABLE|ROLE|USER|DATABASE|OWNED\s+BY|COLUMN|INDEX(?:\s+CONCURRENTLY)?|CONSTRAINT)\b(?:\s+IF\s+EXISTS)?\s+$nm(?:\s*,\s*$nm)*(?:\s+ON\s+$id)?(?:\s+(?:CASCADE|RESTRICT))?\s*\z/i) {
                  return code_reason($c);
                }
                if ($c =~ /\A\s*TRUNCATE\s+(?:TABLE\s+)?(?:ONLY\s+)?$id(?:\s*,\s*$id)*(?:\s+(?:RESTART|CONTINUE)\s+IDENTITY)?(?:\s+(?:CASCADE|RESTRICT))?\s*\z/i) {
                  return "TRUNCATE";
                }
                if ($c =~ /\A\s*ALTER\s+(?:TABLE|INDEX|SEQUENCE|VIEW|MATERIALIZED\s+VIEW|TYPE|DOMAIN|FOREIGN\s+TABLE)\s+(?:IF\s+EXISTS\s+)?(?:ONLY\s+)?$id\s+\S/i) {
                  return code_reason($c);
                }
                if ($c =~ /\A\s*CREATE\s+UNIQUE\s+INDEX\s+(?:CONCURRENTLY\s+)?(?:IF\s+NOT\s+EXISTS\s+)?$id\s+ON\b/i) {
                  return "CREATE UNIQUE INDEX";
                }
                return "";
              }

              sub all_code {
                my ($sql, $depth, $acc) = @_;
                return if $depth > 6;
                my $st = tokenize($sql);
                if (!defined $st) { $$acc .= " $sql "; return }
                for my $x (@$st) {
                  $$acc .= " " . $x->[0] . " ";
                  for my $b (@{$x->[1]}) { all_code($b, $depth + 1, $acc) }
                }
              }

              sub has_exec {
                my ($sql, $depth) = @_;
                return 1 if $depth > 6;
                my $st = tokenize($sql);
                if (!defined $st) {
                  $ESC = 1 if $sql =~ /\\|U&/i;
                  return ($sql =~ /\bEXECUTE\b/i) ? 1 : 0;
                }
                my $found = 0;
                for my $x (@$st) {
                  $found = 1 if $x->[0] =~ /\bEXECUTE\b/i;
                  for my $b (@{$x->[1]}) {
                    $found = 1 if has_exec($b, $depth + 1);
                  }
                }
                return $found;
              }

              sub inner_bodies {
                my ($b) = @_;
                my $st = tokenize($b);
                return () unless defined $st;
                my @r;
                for my $x (@$st) { push @r, @{$x->[1]} }
                return @r;
              }

              sub leaves {
                my ($sql, $depth, $out) = @_;
                return if $depth > 6;
                my $st = tokenize($sql);
                return unless defined $st;
                for my $x (@$st) {
                  for my $b (@{$x->[1]}) {
                    my @in = inner_bodies($b);
                    if (@in) { leaves($b, $depth + 1, $out) } else { push @$out, $b }
                  }
                }
              }

              sub analyze {
                # mode: 0 = file top level (code), 1 = literal in a non-dynamic context
                # (only full DDL-shaped statements count), 2 = dynamic-SQL context (full rules).
                my ($sql, $depth, $mode, $data) = @_;
                return "NESTING TOO DEEP" if $depth > 6;
                my $stmts = tokenize($sql);
                if (!defined $stmts) {
                  return "UNPARSEABLE (unbalanced quote, dollar tag or comment)" if $depth == 0;
                  my @parts = split /;/, $sql;
                  return "" if $mode == 1 && $data && (grep { /\S/ } @parts) > 1;
                  for my $st (@parts) {
                    my $r = $mode == 1 ? ddl_shape_reason($st) : code_reason($st);
                    return $r if $r;
                  }
                  return "";
                }
                if ($depth == 0) {
                  $WIDE = has_exec($sql, 0);
                  return "escape-encoded literal in dynamic-SQL file; add contract-of if intentional" if $WIDE && $ESC;
                }
                return "" if $mode == 1 && $data && (grep { $_->[0] =~ /\S/ || @{$_->[1]} } @$stmts) > 1;
                for my $st (@$stmts) {
                  my ($code, $bodies, $stesc) = @$st;
                  my $r = $mode == 1 ? ddl_shape_reason($code) : code_reason($code);
                  return $r if $r;
                  # EXECUTE of anything but a literal chain (EXECUTE FUNCTION/PROCEDURE and GRANT EXECUTE ON excepted).
                  $NONLIT = 1 if $mode != 1 && $code =~ /\bEXECUTE\b/i && $code !~ /\bEXECUTE\s+(?:FUNCTION|PROCEDURE|ON)\b/i && $code !~ /\bEXECUTE\s+\x27\x27(?:\s*\|\|\s*\x27\x27)*\s*(?:USING\b|INTO\b|\z)/i;
                  return "escape-encoded literal in a non-data statement; add contract-of if intentional" if $stesc && $code !~ /\A\s*(?:INSERT|UPDATE|DELETE|COMMENT|CREATE|ALTER|COPY|VALUES)\b/i;
                  my $dyn = $WIDE || $code =~ /\A\s*DO\b/i || $code =~ /\bEXECUTE\b/i || $code =~ /\bCREATE\s+(?:OR\s+REPLACE\s+)?(?:FUNCTION|PROCEDURE)\b/i;
                  my $cdata = $mode == 0 ? (($code =~ /\A\s*(?:INSERT|UPDATE|COMMENT\s+ON|COPY)\b/i) ? 1 : 0) : $data;
                  my @scan = @$bodies;
                  push @scan, join("", @$bodies) if @$bodies > 1;
                  for my $b (@scan) {
                    $r = analyze($b, $depth + 1, $dyn ? 2 : 1, $cdata);
                    return $r if $r;
                  }
                }
                if ($depth == 0 && $WIDE) {
                  my @all;
                  leaves($sql, 0, \@all);
                  if (@all > 1) {
                    my $r = analyze(join("", @all), 1, 2, 0);
                    return $r if $r;
                  }
                }
                if ($depth == 0) {
                  my $acc = "";
                  all_code($sql, 0, \$acc);
                  if ($acc =~ /\b(?:decode|convert_from)\s*\(/i || $acc =~ /\bdblink/i || ($acc =~ /\bformat\s*\(/i && $acc =~ /\b(?:EXECUTE|PERFORM)\b/i)) {
                    return "obfuscation-capable dynamic SQL (decode/convert_from/dblink/format with EXECUTE|PERFORM); add contract-of if intentional";
                  }
                  return "EXECUTE of a non-literal (variable/parameter/expression) in dynamic SQL; add contract-of if intentional" if $NONLIT;
                }
                return "";
              }

              print analyze($_, 0, 0, 0);
            '
          }

          # check_contract_header <file> <reason> <comment-lead-regex>; prints the error, returns 1 on violation.
          check_contract_header() {
            local f="$1" reason="$2" lead="$3" header ver own refs
            header="$(git show "HEAD:$f" | grep -E "^${lead}contract-of:[[:space:]]*V[0-9]+[[:space:]]*\$" | head -n 1 || true)"
            if [ -z "$header" ]; then
              echo "ERROR: new migration '$f' is destructive ($reason) but has no contract-of: V<n> header (add one if intentional)."
              return 1
            fi
            ver="$(printf '%s' "$header" | sed -E 's/^.*contract-of:[[:space:]]*V([0-9]+)[[:space:]]*$/\1/')"
            own="$(basename "$f" | sed -nE 's/^V([0-9]+)([._][0-9]+)*__.*$/\1/p')"
            if [ -z "$own" ]; then
              echo "ERROR: cannot parse the version of destructive migration '$f'."
              return 1
            fi
            if [ "$((10#$ver))" -ge "$((10#$own))" ]; then
              echo "ERROR: '$f' (V$own, $reason): 'contract-of: V$ver' must name an EARLIER migration."
              return 1
            fi
            refs="$(git ls-tree -r --name-only HEAD -- "$MIGRATION_PATH" "$JAVA_MIGRATION_PATH" | sed 's|.*/||' | grep -E "^V0*${ver}__.*\.(sql|java)$" || true)"
            if [ -z "$refs" ]; then
              echo "ERROR: '$f' (V$own, $reason): 'contract-of: V$ver' names no existing migration V${ver}__*."
              return 1
            fi
            return 0
          }

          run_destructive_gate() {
            local since="$1"
            local added f base reason violations=0
            added="$(git diff --name-only --diff-filter=A "${since}...HEAD" -- "$MIGRATION_PATH")"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              base="${f##*/}"
              case "$base" in
                R__*.sql)
                  echo "ERROR: new repeatable migration '$f' is not allowed (the repo has none): a repeatable file is re-applied on every checksum change, so it cannot be an expand/contract step. Use a versioned V<n>__*.sql migration."
                  violations=1
                  continue ;;
                V*.sql) : ;;
                *) continue ;;
              esac
              if git show "HEAD:$f" | grep -qE '^[[:space:]]*--[[:space:]]*non-destructive[[:space:]]*$'; then
                continue
              fi
              reason="$(git show "HEAD:$f" | destructive_reason)"
              [ -z "$reason" ] && continue
              check_contract_header "$f" "$reason" '--[[:space:]]*' || violations=1
            done <<EOF
          $added
          EOF
            added="$(git diff --name-only --diff-filter=A "${since}...HEAD" -- "$JAVA_MIGRATION_PATH")"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              base="${f##*/}"
              case "$base" in
                V*.java) : ;;
                *) continue ;;
              esac
              if git show "HEAD:$f" | grep -qE '^[[:space:]]*//[[:space:]]*non-destructive[[:space:]]*$'; then
                continue
              fi
              check_contract_header "$f" "Java migration is not parsed" '[[:space:]]*//[[:space:]]*' || violations=1
            done <<EOF
          $added
          EOF
            return "$violations"
          }
          # =========================================================
          # END SHARED DESTRUCTIVE-MIGRATION GATE LOGIC
          # =========================================================
          # >>> SHARED-BLOCK:destructive:END

          WORK="$(mktemp -d)"
          cd "$WORK"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI Self Test"

          mkdir -p "$MIGRATION_PATH"
          # Pre-existing destructive history is exempt: only ADDED files are scanned.
          printf 'CREATE TABLE old_t (id int, legacy int);\n' > "$MIGRATION_PATH/V1__existing.sql"
          printf 'ALTER TABLE old_t DROP COLUMN legacy;\n' > "$MIGRATION_PATH/V2__old_destructive_no_header.sql"
          printf 'ALTER TABLE old_t ADD COLUMN new_col int;\n' > "$MIGRATION_PATH/V3__expand.sql"
          git add -A
          git commit -q -m "base: existing migrations"
          BASE_SHA="$(git rev-parse HEAD)"
          git switch -q -c feature

          # Q is a literal single quote, so fixtures with quotes can live in double-quoted shell strings.
          Q="'"
          fail() { echo "SELF-TEST FAILED: $1"; exit 1; }
          reset() { git reset -q --hard "$BASE_SHA"; }
          add() { mkdir -p "$(dirname "$MIGRATION_PATH/$1")"; printf '%b\n' "$2" > "$MIGRATION_PATH/$1"; git add -A; git commit -q -m "add $1"; }
          add_java() { mkdir -p "$(dirname "$JAVA_MIGRATION_PATH/$1")"; printf '%b\n' "$2" > "$JAVA_MIGRATION_PATH/$1"; git add -A; git commit -q -m "add $1"; }
          expect_fail() { if run_destructive_gate "$BASE_SHA" >/dev/null; then fail "$1"; fi; echo "OK: $1 -> rejected"; reset; }
          expect_pass() { run_destructive_gate "$BASE_SHA" >/dev/null || fail "$1"; echo "OK: $1 -> accepted"; reset; }

          # --- Scenario 1: no new migrations (old destructive V2 is exempt) -> pass ---
          git commit -q --allow-empty -m "no migration changes"
          expect_pass "existing destructive migration is not flagged"

          # --- Scenario 2: destructive, no header -> fail ---
          add V4__drop_legacy.sql 'ALTER TABLE old_t DROP COLUMN legacy;'
          expect_fail "DROP COLUMN without header"

          # --- Scenario 3: destructive with valid header -> pass ---
          add V4__drop_legacy.sql '-- contract-of: V3\nALTER TABLE old_t DROP COLUMN legacy;'
          expect_pass "DROP COLUMN with valid header"

          # --- Scenario 4: header names a non-existent version -> fail ---
          add V4__drop_legacy.sql '-- contract-of: V99\nALTER TABLE old_t DROP COLUMN legacy;'
          expect_fail "header naming a non-existent version"

          # --- Scenario 5: header names itself / a later version -> fail ---
          add V4__drop_legacy.sql '-- contract-of: V4\nALTER TABLE old_t DROP COLUMN legacy;'
          expect_fail "header naming its own version"

          # --- Scenario 6: non-destructive -> pass ---
          add V4__add_col.sql 'ALTER TABLE old_t ADD COLUMN other int;\nCREATE INDEX ix_old_t_other ON old_t (other);\nALTER TABLE old_t ALTER COLUMN other DROP NOT NULL;\nALTER TABLE old_t ALTER COLUMN other DROP DEFAULT;\nALTER TABLE old_t DROP CONSTRAINT IF EXISTS some_fk;\nDROP INDEX IF EXISTS ix_x;\nALTER TABLE old_t ALTER COLUMN other DROP IDENTITY;\nALTER TABLE old_t ALTER COLUMN other DROP IDENTITY IF EXISTS;\nALTER TABLE old_t ALTER COLUMN other DROP EXPRESSION;'
          expect_pass "non-destructive DDL (ADD/CREATE INDEX/DROP NOT NULL/DROP CONSTRAINT/DROP INDEX/ALTER COLUMN DROP IDENTITY|EXPRESSION)"

          # --- Scenario 6b: SQL `-- non-destructive` marker (same semantics as the Java one) ---
          add V4__slug.sql '-- non-destructive\n-- CHECK + UNIQUE target a column added NULL in this file.\nALTER TABLE old_t ADD COLUMN slug varchar(60);\nALTER TABLE old_t ADD CONSTRAINT ck_slug CHECK (slug IS NULL OR length(slug) > 2);\nCREATE UNIQUE INDEX ux_old_t_slug ON old_t (slug) WHERE slug IS NOT NULL;'
          expect_pass "SQL ADD CHECK + CREATE UNIQUE INDEX with a -- non-destructive marker line"
          add V4__slug.sql 'ALTER TABLE old_t ADD COLUMN slug varchar(60);\nCREATE UNIQUE INDEX ux_old_t_slug ON old_t (slug) WHERE slug IS NOT NULL;'
          expect_fail "SQL CREATE UNIQUE INDEX without marker or header"
          add V4__slug.sql '-- non-destructive because reasons\nCREATE UNIQUE INDEX ux_old_t_slug ON old_t (slug);'
          expect_fail "SQL marker with trailing text is not the marker"
          add V4__slug.sql '-- this file is non-destructive\nCREATE UNIQUE INDEX ux_old_t_slug ON old_t (slug);'
          expect_fail "SQL marker not at the start of the comment is not the marker"
          add V4__slug.sql '// non-destructive\nCREATE UNIQUE INDEX ux_old_t_slug ON old_t (slug);'
          expect_fail "Java-style // marker does not count in an SQL file"

          # --- Scenario 7: each destructive form is detected ---
          i=0
          for stmt in \
            'DROP TABLE IF EXISTS old_t;' \
            'ALTER TABLE old_t DROP legacy;' \
            'alter table old_t drop column if exists legacy;' \
            'ALTER TABLE old_t RENAME TO new_t;' \
            'ALTER TABLE old_t RENAME COLUMN legacy TO l2;' \
            'ALTER INDEX ix_old RENAME TO ix_new;' \
            'ALTER TABLE old_t ALTER COLUMN legacy SET NOT NULL;' \
            'ALTER TABLE old_t ALTER COLUMN legacy TYPE bigint;' \
            'ALTER TABLE old_t ALTER COLUMN legacy SET DATA TYPE bigint;' \
            'DROP VIEW v_old;' \
            'DROP MATERIALIZED VIEW mv_old;' \
            'DROP SEQUENCE seq_old;' \
            'DROP TYPE type_old;' \
            'DROP DOMAIN dom_old;' \
            'DROP FUNCTION fn_old();' \
            'DROP PROCEDURE proc_old();' \
            'DROP TRIGGER trg_old ON old_t;' \
            'DROP SCHEMA sch_old;' \
            'DROP EXTENSION ext_old;' \
            'TRUNCATE old_t;' \
            'truncate table old_t;' \
            'ALTER TABLE old_t ADD CONSTRAINT ck_x CHECK (legacy > 0);' \
            'ALTER TABLE old_t ADD CHECK (legacy > 0);' \
            'ALTER TABLE old_t ADD CONSTRAINT uq_x UNIQUE (legacy);' \
            'ALTER TABLE old_t ADD UNIQUE (legacy);' \
            'ALTER TABLE old_t DROP "legacy";' \
            'ALTER TABLE old_t DROP COLUMN "legacy";' \
            'DROP OWNED BY some_role;' \
            'DROP FOREIGN TABLE ft_old;' \
            'DROP POLICY p_old ON old_t;' \
            'DROP RULE r_old ON old_t;' \
            'DROP AGGREGATE agg_old(int);' \
            'DROP FUTURE_KIND thing_old;' \
            'CREATE UNIQUE INDEX ux_old ON old_t (legacy);' \
            'CREATE UNIQUE INDEX CONCURRENTLY ux_old2 ON old_t (legacy);' \
            'ALTER TABLE old_t ADD PRIMARY KEY (id);' \
            'ALTER TABLE old_t ADD CONSTRAINT pk_x PRIMARY KEY (id);' \
            'ALTER TABLE old_t ADD FOREIGN KEY (legacy) REFERENCES other_t (id);' \
            'ALTER TABLE old_t ADD COLUMN ref_id int REFERENCES other_t (id);' \
            'ALTER TABLE old_t ADD EXCLUDE USING gist (legacy WITH =);' \
            'ALTER TABLE old_t SET SCHEMA other_schema;' \
            'ALTER TABLE old_t DROP identity;' \
            'ALTER TABLE old_t DROP identity, ADD COLUMN z int;' \
            'ALTER TABLE old_t DROP expression;' \
            'ALTER TABLE old_t DROP index;' \
            'ALTER TABLE old_t DROP IF EXISTS legacy;'; do
            i=$((i + 1))
            add "V4__form_$i.sql" "$stmt"
            expect_fail "destructive form: $stmt"
          done

          # --- Scenario 8: destructive words in comments / strings are ignored ---
          add V4__comments.sql "-- we will DROP TABLE later and RENAME stuff\n/* ALTER COLUMN x SET NOT NULL */\n/* nested /* DROP TABLE x */ still a comment: TRUNCATE y */\nINSERT INTO old_t (legacy) VALUES (1); -- DROP COLUMN\nCOMMENT ON TABLE old_t IS ${Q}drop table and rename${Q};\nINSERT INTO old_t (legacy) VALUES (${Q}it${Q}${Q}s; DROP TABLE x${Q});"
          expect_pass "destructive keywords inside comments, nested comments and string literals"

          # --- Scenario 9: evasions of the old comment/string stripping must be detected ---
          add V4__ev1.sql "INSERT INTO old_t (legacy) VALUES (${Q}--${Q}); DROP TABLE x;"
          expect_fail "evasion: VALUES ('--'); DROP TABLE x;"
          add V4__ev2.sql "SELECT ${Q}/*${Q}; DROP TABLE x; SELECT ${Q}*/${Q};"
          expect_fail "evasion: SELECT '/*'; DROP TABLE x; SELECT '*/';"
          add V4__ev3.sql "SELECT E${Q}\\${Q}${Q}; DROP TABLE x;"
          expect_fail "evasion: SELECT E'\\''; DROP TABLE x;"
          # The old stripper read E'\'' as E'\' + a string that swallowed the DROP up to the next quote.
          add V4__ev3b.sql "SELECT E${Q}\\${Q}${Q}; DROP TABLE x; SELECT ${Q}${Q};"
          expect_fail "evasion: SELECT E'\\''; DROP TABLE x; SELECT '';"
          # Standard (non-E) string: backslash is literal, so '\' ends the string and the DROP is real code
          # (guards against applying E-string escapes to every string).
          add V4__ev4.sql "SELECT ${Q}\\${Q}; DROP TABLE x; SELECT ${Q}${Q};"
          expect_fail "evasion: standard string with a trailing backslash"
          add V4__ev5.sql "DO \$\$ BEGIN EXECUTE ${Q}DROP TABLE x${Q}; END \$\$;"
          expect_fail "DO block with EXECUTE 'DROP TABLE x'"
          add V4__ev6.sql "DO \$tag\$ BEGIN DROP TABLE x; END \$tag\$;"
          expect_fail "DO block with direct DDL in a tagged dollar body"
          add V4__ev7.sql "EXECUTE format(${Q}ALTER TABLE %I DROP COLUMN legacy${Q}, ${Q}old_t${Q});"
          expect_fail "EXECUTE format('ALTER TABLE %I DROP COLUMN ...')"
          add V4__ev8.sql "DO \$\$ BEGIN EXECUTE ${Q}DR${Q} || ${Q}OP TABLE x${Q}; END \$\$;"
          expect_fail "EXECUTE with a DROP split across concatenated literals"
          add V4__ev9.sql "CREATE FUNCTION f() RETURNS void AS \$\$ BEGIN DROP TABLE x; END \$\$ LANGUAGE plpgsql;\nSELECT f();"
          expect_fail "DDL hidden in a CREATE FUNCTION body"

          # Whole-file mode: EXECUTE anywhere => every literal in the file is analysed, plus their join.
          add V4__dyn1.sql "EXECUTE E${Q}\\\\x44ROP TABLE users${Q};"
          expect_fail "EXECUTE E'\\x44ROP TABLE users' (escape-encoded literal)"
          add V4__dyn2.sql "EXECUTE U&${Q}\\\\0044ROP TABLE users${Q};"
          expect_fail "EXECUTE U&'\\0044ROP TABLE users' (escape-encoded literal)"
          add V4__dyn3.sql "CREATE FUNCTION run_sql(q text) RETURNS void AS \$\$ BEGIN EXECUTE q; END \$\$ LANGUAGE plpgsql;\nSELECT run_sql(${Q}DROP TABLE users${Q});"
          expect_fail "function with EXECUTE q + SELECT run_sql('DROP TABLE users')"
          add V4__dyn4.sql "EXECUTE ${Q}SELECT 1${Q};\nCALL p(${Q}DROP TABLE x${Q});"
          expect_fail "CALL p('DROP TABLE x') in a file with EXECUTE"
          add V4__dyn5.sql "DO \$\$ DECLARE s text := ${Q}DR${Q}; BEGIN s := s || ${Q}OP TABLE x${Q}; EXECUTE s; END \$\$;"
          expect_fail "DECLARE s := 'DR'; s := s || 'OP TABLE x'; EXECUTE s;"
          add V4__dyn6.sql "SELECT 1;\nEXECUTE ${Q}SELECT 1${Q};\nSELECT E${Q}a\\\\nb${Q};"
          expect_fail "benign E'..\\n' literal in a file with EXECUTE fails closed"
          add V4__dyn7.sql "ALTER TABLE old_t DROP U&\"leg\\\\0061cy\";"
          expect_fail "DROP of a U&\"..\" identifier"

          # --- Scenario 10: unbalanced quote / dollar tag / comment fails closed ---
          add V4__open1.sql "INSERT INTO old_t (legacy) VALUES (${Q}oops);"
          expect_fail "unbalanced single quote fails closed"
          add V4__open2.sql "SELECT \$tag\$ never closed;"
          expect_fail "unbalanced dollar tag fails closed"
          add V4__open3.sql 'SELECT 1; /* open /* nested */ still open'
          expect_fail "unbalanced nested comment fails closed"
          add V4__open4.sql 'SELECT "oops;'
          expect_fail "unbalanced quoted identifier fails closed"

          # --- Scenario 11: benign DO block with no DDL passes ---
          add V4__benign_do.sql "DO \$\$ BEGIN RAISE NOTICE ${Q}migrating, nothing to drop table${Q}; END \$\$;"
          expect_pass "benign DO block (RAISE NOTICE only)"
          add V4__benign_exec.sql "EXECUTE ${Q}SELECT 1${Q};"
          expect_pass "benign EXECUTE 'SELECT 1'"
          add V4__benign_idents.sql "SELECT U&\"d\\\\0061ta\" FROM old_t;\nINSERT INTO old_t (legacy) VALUES (E${Q}a\\\\nb${Q});"
          expect_pass "U&\"..\" identifier and E'..\\n' literal without EXECUTE"

          # --- Scenario 12: an ADDED repeatable R__*.sql is rejected (the repo has none), at any depth ---
          add R__views.sql 'DROP VIEW IF EXISTS v_old;'
          expect_fail "repeatable R__ migration is rejected"
          add R__benign.sql 'SELECT 1;'
          expect_fail "even a benign repeatable R__ migration is rejected"
          add sub/R__nested.sql 'SELECT 1;'
          expect_fail "nested repeatable R__ migration is rejected"

          # --- Scenario 13: Java migrations need a header ---
          add_java V4__JavaMigration.java 'package db.migration;\npublic class V4__JavaMigration {}'
          expect_fail "Java migration without a header"
          add_java V4__JavaMigration.java '// non-destructive\npackage db.migration;\npublic class V4__JavaMigration {}'
          expect_pass "Java migration with // non-destructive"
          add_java V4__JavaMigration.java '// contract-of: V3\npackage db.migration;\npublic class V4__JavaMigration {}'
          expect_pass "Java migration with a valid // contract-of"
          add_java V4__JavaMigration.java '// contract-of: V99\npackage db.migration;\npublic class V4__JavaMigration {}'
          expect_fail "Java migration whose contract-of names a non-existent version"
          mkdir -p "$JAVA_MIGRATION_PATH"
          printf 'package db.migration;\npublic class V1__Old {}\n' > "$JAVA_MIGRATION_PATH/V9__Old.java"
          git add -A
          git commit -q -m "base: existing java migration"
          BASE_SHA="$(git rev-parse HEAD)"
          git commit -q --allow-empty -m "no java changes"
          expect_pass "existing Java migration without a header is not flagged"

          # --- Scenario 14: migrations in SUBFOLDERS are scanned (Flyway scans recursively) ---
          # The pathspec "$MIGRATION_PATH/V*.sql" does not match "$MIGRATION_PATH/sub/V200__x.sql".
          add sub/V200__nested_destructive.sql 'ALTER TABLE old_t DROP COLUMN legacy;'
          expect_fail "destructive SQL in a subfolder without header"
          add sub/V200__nested_destructive.sql '-- contract-of: V3\nALTER TABLE old_t DROP COLUMN legacy;'
          expect_pass "destructive SQL in a subfolder with a valid header"
          add sub/deeper/V201__nested_deep.sql 'DROP TABLE old_t;'
          expect_fail "destructive SQL two folders deep without header"
          add_java sub/V202__NestedJava.java 'package db.migration;\npublic class V202__NestedJava {}'
          expect_fail "Java migration in a subfolder without a header"
          add_java sub/V202__NestedJava.java '// non-destructive\npackage db.migration;\npublic class V202__NestedJava {}'
          expect_pass "Java migration in a subfolder with // non-destructive"
          add_java sub/Helper.java 'package db.migration;\npublic class Helper {}'
          expect_pass "non-V*.java helper in a subfolder is out of scope"
          # contract-of may name a migration that lives in a subfolder.
          add sub/V50__expand.sql 'ALTER TABLE old_t ADD COLUMN c50 int;'
          add V60__contract.sql '-- contract-of: V50\nALTER TABLE old_t DROP COLUMN legacy;'
          expect_pass "contract-of naming a migration in a subfolder"

          # --- Scenario 15 (audit cycle 3): helper that pins WHICH rule fired, not just that something did ---
          reason_has() {
            local want="$1" sql="$2" got
            got="$(printf '%b' "$sql" | destructive_reason)"
            case "$got" in
              *"$want"*) echo "OK: reason '$want' <- ${sql%%\\n*}" ;;
              *) fail "expected reason containing '$want', got '$got' for: $sql" ;;
            esac
          }

          # MEDIUM 1: dropping a unique index / PK / unique constraint (or a dynamically named one) breaks the
          # previous app's ON CONFLICT after a rollback. Plain non-unique index/constraint drops stay allowed.
          i=0
          for stmt in \
            'DROP INDEX ux_device_tokens_token;' \
            'DROP INDEX IF EXISTS ux_device_tokens_token;' \
            'DROP INDEX CONCURRENTLY ux_device_tokens_token;' \
            'DROP INDEX CONCURRENTLY IF EXISTS public.ux_device_tokens_token;' \
            'DROP INDEX idx_ok, uq_second;' \
            'DROP INDEX uq_x CASCADE;' \
            'DROP INDEX uk_x;' \
            'DROP INDEX idx_bookings_cancel_token;' \
            'DROP INDEX IF EXISTS "ux_quoted";' \
            'ALTER TABLE device_tokens DROP CONSTRAINT device_tokens_pkey;' \
            'ALTER TABLE device_tokens DROP CONSTRAINT IF EXISTS pk_cities;' \
            'ALTER TABLE old_t DROP CONSTRAINT old_t_legacy_key;' \
            'ALTER TABLE old_t DROP CONSTRAINT uq_salons_owner_id;' \
            'ALTER TABLE old_t DROP CONSTRAINT old_t_legacy_unique;' \
            'ALTER TABLE old_t DROP CONSTRAINT in_app_notification_dedup_uq;' \
            'ALTER TABLE old_t DROP CONSTRAINT no_overlapping_bookings;' \
            'ALTER TABLE old_t DROP CONSTRAINT unknown_name_x;' \
            'ALTER TABLE old_t DROP CONSTRAINT fk_ok, DROP CONSTRAINT uq_y;'; do
            i=$((i + 1))
            add "V4__uidx_$i.sql" "$stmt"
            expect_fail "should_flag_when_uniqueIndexOrConstraintDropped: $stmt"
          done
          add V4__uidx_dyn1.sql "DO \$\$ BEGIN EXECUTE format(${Q}ALTER TABLE %I DROP CONSTRAINT %I${Q}, ${Q}t${Q}, ${Q}c${Q}); END \$\$;"
          expect_fail "should_flag_when_dropConstraintNameIsFormatI"
          add V4__uidx_dyn2.sql "DO \$\$ DECLARE r record; BEGIN FOR r IN SELECT conname FROM pg_constraint LOOP EXECUTE ${Q}ALTER TABLE t DROP CONSTRAINT ${Q} || r.conname; END LOOP; END \$\$;"
          expect_fail "should_flag_when_dropConstraintNameIsConcatenatedVariable"
          add V4__uidx_dyn3.sql "DO \$\$ BEGIN EXECUTE ${Q}DROP INDEX ${Q} || quote_ident(v_name); END \$\$;"
          expect_fail "should_flag_when_dropIndexNameIsConcatenatedVariable"
          add V4__uidx_dyn4.sql "DO \$\$ DECLARE cname text; BEGIN ALTER TABLE t DROP CONSTRAINT cname; END \$\$;"
          expect_fail "should_flag_when_dropConstraintNameIsPlpgsqlVariable"
          reason_has "unique/primary-key" 'DROP INDEX ux_device_tokens_token;'
          reason_has "unique/primary-key" 'ALTER TABLE t DROP CONSTRAINT t_pkey;'
          reason_has "dynamic-named" "DO \$\$ BEGIN EXECUTE format(${Q}ALTER TABLE %I DROP CONSTRAINT %I${Q}, 1, 2); END \$\$;"
          add V4__uidx_ok.sql 'DROP INDEX idx_foo;\nDROP INDEX IF EXISTS idx_a, ix_b;\nDROP INDEX CONCURRENTLY IF EXISTS public.idx_c;\nALTER TABLE old_t DROP CONSTRAINT IF EXISTS chk_x;\nALTER TABLE old_t DROP CONSTRAINT fk_old_t_other;\nALTER TABLE old_t DROP CONSTRAINT service_definitions_service_type_id_fkey;\nALTER TABLE old_t DROP CONSTRAINT in_app_notification_dedup_key_chk;'
          expect_pass "should_pass_when_nonUniqueIndexOrConstraintDropped"

          # LOW (re-audit): whitespace padding must not hide a later name from the 400-char look-ahead.
          # Whitespace runs are collapsed once (linear); a comma with no name after it, or a name that
          # touches the window end, fails closed.
          pad500="$(printf '\\n%.0s' $(seq 500))"
          add V4__pad1.sql "DROP INDEX idx_a,${pad500}ux_device_tokens_token;"
          expect_fail "should_flag_when_500NewlinesPadTheUniqueNameAfterComma"
          add V4__pad2.sql "DROP INDEX idx_a,${pad500}idx_b;"
          expect_pass "should_pass_when_500NewlinesPadANonUniqueNameAfterComma"
          padnames="$(printf 'idx_p%03d, ' $(seq 1 39))"
          add V4__pad3.sql "DROP INDEX ${padnames}idx_masters_booking_slug;"
          expect_fail "should_flag_when_400CharWindowCutsADenylistedNameShort"
          add V4__pad4.sql "DROP INDEX ${padnames}idx_ok_name;"
          expect_fail "should_flag_when_namePastTheWindowEndCannotBeFullyRead"
          add V4__pad5.sql 'DROP INDEX idx_a,'
          expect_fail "should_flag_when_dropIndexListEndsAfterComma"
          # INFO (re-audit): `$` is a valid identifier character; the name must not be cut at it.
          add V4__dollar1.sql "DROP INDEX idx_x\$_key;"
          expect_fail "should_flag_when_indexNameContainsDollar"
          add V4__dollar2.sql "ALTER TABLE old_t DROP CONSTRAINT fk_x\$y;"
          expect_fail "should_flag_when_constraintNameContainsDollar"

          # LOW (re-audit): DEFAULT NULL is not a default for NOT NULL purposes.
          add V4__addnn6.sql 'ALTER TABLE old_t ADD COLUMN c int DEFAULT NULL NOT NULL;'
          expect_fail "should_flag_when_addColumnDefaultNullNotNull"
          add V4__addnn7.sql 'ALTER TABLE old_t ADD COLUMN c int NOT NULL default null::int;'
          expect_fail "should_flag_when_addColumnNotNullDefaultNullCast"
          add V4__addnn8.sql 'ALTER TABLE old_t ADD COLUMN c int DEFAULT (NULL) NOT NULL;'
          expect_fail "should_flag_when_addColumnDefaultParenNullNotNull"
          add V4__addnn9.sql 'ALTER TABLE old_t ADD COLUMN c int DEFAULT 0 NOT NULL;\nALTER TABLE old_t ADD COLUMN d int DEFAULT NULLIF(1, 1) NOT NULL;'
          expect_pass "should_pass_when_defaultIsNotLiteralNull"

          # Hardening (re-audit): a function that EXECUTEs a variable/parameter is a "run text" helper.
          add V4__exnl1.sql "CREATE FUNCTION run_text(t text) RETURNS void AS \$\$ BEGIN EXECUTE t; END \$\$ LANGUAGE plpgsql;"
          expect_fail "should_flag_when_functionExecutesAParameter"
          add V4__exnl2.sql "CREATE FUNCTION f() RETURNS void AS \$\$ BEGIN EXECUTE ${Q}SELECT 1${Q}; END \$\$ LANGUAGE plpgsql;"
          expect_pass "should_pass_when_functionExecutesOnlyALiteral"
          add V4__exnl3.sql 'CREATE TRIGGER trg BEFORE INSERT ON old_t FOR EACH ROW EXECUTE FUNCTION fn();\nGRANT EXECUTE ON FUNCTION fn() TO PUBLIC;'
          expect_pass "should_pass_when_executeFunctionTriggerOrGrantExecute"

          # MEDIUM 2: PG18 table-constraint NOT NULL, both spellings.
          add V4__nn1.sql 'ALTER TABLE old_t ADD CONSTRAINT nn_legacy NOT NULL legacy;'
          expect_fail "should_flag_when_addNamedNotNullConstraint"
          add V4__nn2.sql 'ALTER TABLE old_t ADD NOT NULL legacy;'
          expect_fail "should_flag_when_addUnnamedNotNullConstraint"
          reason_has "ADD NOT NULL" 'ALTER TABLE old_t ADD CONSTRAINT nn_legacy NOT NULL legacy;'

          # LOW 2: ADD COLUMN ... NOT NULL without DEFAULT / GENERATED fails existing rows or the previous app's INSERTs.
          add V4__addnn1.sql 'ALTER TABLE old_t ADD COLUMN c int NOT NULL;'
          expect_fail "should_flag_when_addColumnNotNullWithoutDefault"
          add V4__addnn2.sql 'ALTER TABLE old_t ADD c int NOT NULL;'
          expect_fail "should_flag_when_addColumnKeywordOmittedNotNullWithoutDefault"
          add V4__addnn3.sql 'ALTER TABLE old_t ADD COLUMN a int DEFAULT 1 NOT NULL, ADD COLUMN IF NOT EXISTS b numeric(10,2) NOT NULL;'
          expect_fail "should_flag_when_secondAddColumnClauseIsNotNullWithoutDefault"
          add V4__addnn4.sql 'ALTER TABLE old_t ADD COLUMN c int NOT NULL DEFAULT 0;'
          expect_pass "should_pass_when_addColumnNotNullWithDefault"
          add V4__addnn5.sql 'ALTER TABLE old_t ADD COLUMN c int DEFAULT 0 NOT NULL;\nALTER TABLE old_t ADD COLUMN d int GENERATED ALWAYS AS (legacy + 1) STORED NOT NULL;\nALTER TABLE old_t ADD COLUMN e int NULL;\nALTER TABLE old_t ADD COLUMN f int;\nALTER TABLE old_t ADD COLUMN g int CHECK (g IS NOT NULL);'
          expect_pass "should_pass_when_addColumnHasDefaultGeneratedOrIsNullable"

          # INFO: each of these can break the previous app version's queries.
          i=0
          for stmt in \
            'ALTER TABLE old_t DETACH PARTITION old_t_2025;' \
            'ALTER TABLE old_t DETACH PARTITION old_t_2025 CONCURRENTLY;' \
            'ALTER TABLE child_t NO INHERIT parent_t;' \
            'ALTER TABLE old_t ENABLE ROW LEVEL SECURITY;' \
            'ALTER TABLE old_t FORCE ROW LEVEL SECURITY;'; do
            i=$((i + 1))
            add "V4__info_$i.sql" "$stmt"
            expect_fail "should_flag_when_breakingStructuralForm: $stmt"
          done
          # Deliberately NOT destructive: REVOKE (role grants only; the app connects as the owner role that
          # runs Flyway) and DROP DEFAULT (the standard last step of the add-with-default expand pattern;
          # flagging it would block routine safe migrations).
          add V4__info_ok.sql 'REVOKE ALL ON old_t FROM PUBLIC;\nALTER TABLE old_t ALTER COLUMN legacy DROP DEFAULT;\nALTER TABLE old_t DISABLE ROW LEVEL SECURITY;'
          expect_pass "should_pass_when_revokeOrDropDefaultOrDisableRls"

          # LOW 1: literals are scanned in EVERY file (no EXECUTE needed): a previous migration may have
          # created run_sql(text) with EXECUTE, and dblink_exec runs its text argument remotely.
          add V4__lit1.sql "SELECT run_sql(${Q}DROP TABLE users${Q});"
          expect_fail "should_flag_when_runSqlGetsDropTableWithoutExecuteInFile"
          add V4__lit2.sql "CALL p(${Q}DROP TABLE x${Q});"
          expect_fail "should_flag_when_callGetsDropTableLiteral"
          add V4__lit3.sql "SELECT dblink_exec(${Q}dbname=x${Q}, ${Q}DROP TABLE users${Q});"
          expect_fail "should_flag_when_dblinkExecGetsDropTable"
          add V4__lit4.sql "SELECT run_sql(${Q}SELECT 1; DROP TABLE users${Q});"
          expect_fail "should_flag_when_dropIsSecondStatementInsideLiteral"
          add V4__lit5.sql "SELECT run_sql(${Q}ALTER TABLE old_t DROP COLUMN legacy${Q});"
          expect_fail "should_flag_when_alterDropColumnLiteralPassedToFunction"
          add V4__lit6.sql "SELECT run_sql(${Q}TRUNCATE old_t${Q});"
          expect_fail "should_flag_when_truncateLiteralPassedToFunction"
          add V4__lit7.sql "SELECT run_sql(${Q}DR${Q} || ${Q}OP TABLE users${Q});"
          expect_fail "should_flag_when_dropSplitAcrossLiteralsPassedToFunction"
          add V4__lit8.sql "SELECT run_sql(E${Q}\\\\x44ROP TABLE users${Q});"
          expect_fail "should_flag_when_escapeEncodedLiteralPassedToFunctionWithoutExecute"
          add V4__lit9.sql "SELECT run_sql(U&${Q}\\\\0044ROP TABLE users${Q});"
          expect_fail "should_flag_when_unicodeEscapeLiteralPassedToFunctionWithoutExecute"
          reason_has "DROP TABLE" "SELECT run_sql(${Q}DROP TABLE users${Q});"
          reason_has "escape-encoded literal in a non-data statement" "SELECT run_sql(E${Q}\\\\x44ROP TABLE users${Q});"
          # Benign data literals (English and Ukrainian prose that merely contains the word "drop") still pass.
          add V4__lit_ok1.sql "INSERT INTO old_t (legacy) VALUES (${Q}Please drop off the package${Q}), (${Q}drop table and rename${Q}), (${Q}Залиште посилку (drop off) біля дверей${Q});\nUPDATE old_t SET legacy = 1 WHERE ${Q}x${Q} = ${Q}we drop it later${Q};\nCOMMENT ON COLUMN old_t.legacy IS ${Q}ALTER TABLE is not run here; drop off${Q};\nSELECT ${Q}drop off${Q}, ${Q}truncate the story${Q}, ${Q}rename me${Q};"
          expect_pass "should_pass_when_dataLiteralsMentionDropOffOrTruncateInProse"
          add V4__lit_ok2.sql "INSERT INTO old_t (legacy) VALUES (${Q}it${Q}${Q}s; DROP TABLE x${Q});\nINSERT INTO old_t (legacy) VALUES (E${Q}a\\\\nb${Q});\nSELECT format(${Q}%s${Q}, 1);"
          expect_pass "should_pass_when_dataLiteralHasEmbeddedSemicolonOrEscapeInInsert"

          # LOW 3: obfuscation (format('DR%sP TABLE x','O'), convert_from(decode(..,'hex'),..), dblink) cannot be
          # decoded statically. Fail CLOSED with a contract-of header as the only way through.
          add V4__obf1.sql "DO \$\$ BEGIN EXECUTE format(${Q}DR%sP TABLE x${Q}, ${Q}O${Q}); END \$\$;"
          expect_fail "should_flag_when_formatWithExecuteBuildsDrop"
          add V4__obf2.sql "DO \$\$ BEGIN PERFORM format(${Q}DR%sP TABLE x${Q}, ${Q}O${Q}); END \$\$;"
          expect_fail "should_flag_when_formatWithPerform"
          add V4__obf3.sql "SELECT run_sql(convert_from(decode(${Q}44524f50205441424c452075736572730a${Q}, ${Q}hex${Q}), ${Q}UTF8${Q}));"
          expect_fail "should_flag_when_convertFromDecodeHex"
          add V4__obf4.sql "SELECT decode(${Q}41${Q}, ${Q}hex${Q});"
          expect_fail "should_flag_when_decodeCalled"
          add V4__obf5.sql "SELECT convert_from(${Q}x${Q}::bytea, ${Q}UTF8${Q});"
          expect_fail "should_flag_when_convertFromCalled"
          add V4__obf6.sql "SELECT dblink_connect(${Q}dbname=x${Q});"
          expect_fail "should_flag_when_dblinkCalled"
          add V4__obf7.sql "SELECT dblink_exec(${Q}dbname=x${Q}, chr(68) || ${Q}ROP TABLE users${Q});"
          expect_fail "should_flag_when_dblinkExecBuildsDropFromChr"
          reason_has "obfuscation-capable" "DO \$\$ BEGIN EXECUTE format(${Q}DR%sP TABLE x${Q}, ${Q}O${Q}); END \$\$;"
          reason_has "obfuscation-capable" "SELECT decode(${Q}41${Q}, ${Q}hex${Q});"
          reason_has "obfuscation-capable" "SELECT dblink_connect(${Q}dbname=x${Q});"
          # format() without EXECUTE/PERFORM is plain string formatting and passes.
          add V4__obf_ok.sql "SELECT format(${Q}%s items${Q}, 3);"
          expect_pass "should_pass_when_formatWithoutExecuteOrPerform"
          # The way through is a contract-of header (chosen over a new marker: it needs no extra parser path
          # and is already validated against a real earlier migration).
          add V4__obf_hdr.sql "-- contract-of: V3\nDO \$\$ BEGIN EXECUTE format(${Q}ALTER TABLE %I ADD COLUMN c2 int${Q}, ${Q}old_t${Q}); END \$\$;"
          expect_pass "should_pass_when_obfuscationPrimitiveCarriesContractOf"
          add V4__obf_hdr_bad.sql "-- contract-of: V99\nSELECT decode(${Q}41${Q}, ${Q}hex${Q});"
          expect_fail "should_flag_when_obfuscationHeaderNamesMissingVersion"

          echo "All destructive-migration self-test scenarios passed."

      # Release-PR exemption mirror: hermetic, throwaway repos, decision matrix of the SHARED scope block.
      - name: Assert the destructive-gate scope skips only same-repo dev to main and dev-sourced main merges
        run: |
          set -euo pipefail

          # >>> SHARED-BLOCK:scope:BEGIN
          # =========================================================
          # SHARED DESTRUCTIVE-GATE SCOPE DECISION -- keep this block
          # BYTE-IDENTICAL with the mirror in
          # `self-test-base-revision-resolution`. The
          # `verify-gate-mirror-parity` job diffs the two copies.
          # =========================================================
          #
          # Prints exactly one word: `skip-release-pr`, `skip-release-merge` or `gate`.
          # Only the destructive (expand/contract) step consults it; the
          # immutability and monotonicity gates ALWAYS run.
          #
          # Why a release is exempt: its range holds only migrations that
          # already passed this gate in their PR into dev, and merged
          # migrations are immutable, so a failure there is unfixable.
          #
          # pull_request: skip ONLY for base main + head branch dev + head repo
          #   == this repo (a fork's dev must not count). Every PR into dev,
          #   hotfix/* into main, and anything else is gated.
          # push to main: BASE_SHA is github.event.before = the OLD main tip, so
          #   after a release MERGE COMMIT the range old-main...HEAD is the whole
          #   release and would fail the same way. Skip ONLY when HEAD is a
          #   two-parent merge whose second parent is already an ancestor of
          #   origin/dev (everything merged came through dev, hence was gated).
          #   A hotfix merge (second parent not in dev), a squash/rebase merge
          #   (one parent), an octopus merge, a direct push, or a missing
          #   origin/dev all stay gated (fail closed).
          # Reads EVENT_NAME / BASE_REF / HEAD_REF / HEAD_REPO / REPO / REF from the environment.
          destructive_gate_scope() {
            local p2
            if [ "${EVENT_NAME:-}" = "pull_request" ]; then
              if [ "${BASE_REF:-}" = "main" ] && [ "${HEAD_REF:-}" = "dev" ] \
                 && [ -n "${REPO:-}" ] && [ "${HEAD_REPO:-}" = "${REPO}" ]; then
                echo "skip-release-pr"
                return 0
              fi
              echo "gate"
              return 0
            fi
            if [ "${EVENT_NAME:-}" = "push" ] && [ "${REF:-}" = "refs/heads/main" ]; then
              if p2="$(git rev-parse --verify --quiet "HEAD^2^{commit}")" \
                 && ! git rev-parse --verify --quiet "HEAD^3" >/dev/null \
                 && git rev-parse --verify --quiet "origin/dev^{commit}" >/dev/null \
                 && git merge-base --is-ancestor "$p2" origin/dev; then
                echo "skip-release-merge"
                return 0
              fi
            fi
            echo "gate"
            return 0
          }
          # =========================================================
          # END SHARED DESTRUCTIVE-GATE SCOPE DECISION
          # =========================================================
          # >>> SHARED-BLOCK:scope:END

          fail() { echo "FAIL: $*"; exit 1; }

          W="$(mktemp -d)"
          cd "$W"
          git init -q -b main .
          git config user.email t@t
          git config user.name t
          git config commit.gpgsign false
          git commit -q --allow-empty -m base
          git checkout -q -b dev
          git commit -q --allow-empty -m dev-1
          git update-ref refs/remotes/origin/dev dev
          git checkout -q main
          git checkout -q -b hotfix
          git commit -q --allow-empty -m hotfix-1
          git checkout -q main

          expect() {
            local name="$1" want="$2" got
            got="$(destructive_gate_scope)"
            [ "$got" = "$want" ] || fail "$name: got '$got', want '$want'"
            echo "OK: $name -> $want"
          }

          R="o/r"
          # --- pull_request matrix ---
          EVENT_NAME=pull_request BASE_REF=main HEAD_REF=dev HEAD_REPO="$R" REPO="$R" REF="" expect "should_skip_when_sameRepoDevToMain" skip-release-pr
          EVENT_NAME=pull_request BASE_REF=main HEAD_REF=dev HEAD_REPO="fork/r" REPO="$R" REF="" expect "should_gate_when_forkDevToMain" gate
          EVENT_NAME=pull_request BASE_REF=main HEAD_REF=hotfix/x HEAD_REPO="$R" REPO="$R" REF="" expect "should_gate_when_hotfixToMain" gate
          EVENT_NAME=pull_request BASE_REF=dev HEAD_REF=feat/x HEAD_REPO="$R" REPO="$R" REF="" expect "should_gate_when_featToDev" gate
          EVENT_NAME=pull_request BASE_REF=dev HEAD_REF=dev HEAD_REPO="$R" REPO="$R" REF="" expect "should_gate_when_devToDev" gate
          EVENT_NAME=pull_request BASE_REF=main HEAD_REF=feat/x HEAD_REPO="$R" REPO="$R" REF="" expect "should_gate_when_featToMain" gate
          EVENT_NAME=pull_request BASE_REF=main HEAD_REF=dev HEAD_REPO="" REPO="$R" REF="" expect "should_gate_when_headRepoEmpty" gate
          EVENT_NAME=pull_request BASE_REF=main HEAD_REF=dev HEAD_REPO="" REPO="" REF="" expect "should_gate_when_bothReposEmpty" gate

          # --- push to main ---
          # Release: merge commit, second parent = dev tip (in origin/dev).
          git checkout -q main
          git merge -q --no-ff -m release dev
          EVENT_NAME=push BASE_REF="" HEAD_REF="" HEAD_REPO="" REPO="$R" REF=refs/heads/main expect "should_skip_when_releaseMergeCommitOnMain" skip-release-merge
          EVENT_NAME=push BASE_REF="" HEAD_REF="" HEAD_REPO="" REPO="$R" REF=refs/heads/dev expect "should_gate_when_pushToDev" gate
          # Hotfix: merge commit whose second parent is NOT in origin/dev.
          git merge -q --no-ff -m hotfix-merge hotfix
          EVENT_NAME=push BASE_REF="" HEAD_REF="" HEAD_REPO="" REPO="$R" REF=refs/heads/main expect "should_gate_when_hotfixMergeOnMain" gate
          # Direct commit / squash-style (one parent).
          git commit -q --allow-empty -m direct
          EVENT_NAME=push BASE_REF="" HEAD_REF="" HEAD_REPO="" REPO="$R" REF=refs/heads/main expect "should_gate_when_directCommitOnMain" gate
          # Missing origin/dev fails closed.
          git checkout -q --detach main~2
          git update-ref -d refs/remotes/origin/dev
          EVENT_NAME=push BASE_REF="" HEAD_REF="" HEAD_REPO="" REPO="$R" REF=refs/heads/main expect "should_gate_when_originDevMissing" gate

          echo "All destructive-gate scope self-test scenarios passed."

  verify-gate-mirror-parity:
    name: Verify Gate <-> Mirror Parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Assert every SHARED block is byte-identical across gate and mirror
        run: |
          set -euo pipefail

          WF=".github/workflows/migration-immutability.yml"

          # Extract every region delimited by the sentinel markers
          # "# >>> SHARED-BLOCK:<id>:BEGIN" / ":END" for a given <id>.
          # awk prints the lines strictly BETWEEN the two marker lines
          # (markers excluded), and concatenates every occurrence of
          # that <id> in file order. The two production/mirror copies
          # therefore extract as one stream each pairing collapses to.
          # We then split that stream back into the N occurrences and
          # diff occurrence #1 against every other occurrence. Each id
          # declares its expected occurrence count: the single-gate ids
          # (immutability, monotonicity) have exactly 2 (production gate
          # + self-test mirror); baserev has 3 (the resolver is shared
          # by BOTH gate jobs plus its self-test mirror).
          extract_occurrence() {
            local id="$1" want="$2"
            awk -v id="$id" -v want="$want" '
              $0 ~ ("# >>> SHARED-BLOCK:" id ":BEGIN") { n++; cap=(n==want?1:0); next }
              $0 ~ ("# >>> SHARED-BLOCK:" id ":END")   { if (n==want) exit; cap=0; next }
              cap { print }
            ' "$WF"
          }

          check_pair() {
            local id="$1" expected="$2"
            local a b count i
            count="$(grep -c "# >>> SHARED-BLOCK:${id}:BEGIN" "$WF")"
            if [ "$count" -ne "$expected" ]; then
              echo "PARITY FAILED: expected exactly ${expected} '${id}' SHARED blocks, found ${count}"
              exit 1
            fi
            a="$(mktemp)"
            extract_occurrence "$id" 1 > "$a"
            if [ ! -s "$a" ]; then
              echo "PARITY FAILED: extracted an empty '${id}' SHARED block"
              exit 1
            fi
            i=2
            while [ "$i" -le "$count" ]; do
              b="$(mktemp)"
              extract_occurrence "$id" "$i" > "$b"
              if [ ! -s "$b" ]; then
                echo "PARITY FAILED: extracted an empty '${id}' SHARED block (occurrence ${i})"
                exit 1
              fi
              if ! diff -u "$a" "$b"; then
                echo "PARITY FAILED: '${id}' SHARED block occurrence ${i} differs from occurrence 1."
                echo "The SHARED block must be BYTE-IDENTICAL across the production"
                echo "job(s) and its hermetic mirror. Re-sync the copies."
                exit 1
              fi
              i=$((i + 1))
            done
            echo "OK: all ${count} '${id}' SHARED block copies are byte-identical"
          }

          check_pair immutability 2
          check_pair monotonicity 2
          check_pair baserev 3
          check_pair destructive 2
          check_pair scope 2

          echo "All SHARED gate<->mirror blocks are byte-identical."
