            cd "$ROOT_WORK"
            git init -q
            git config user.email "ci@example.com"
            git config user.name "CI Self Test"
            mkdir -p "$MIGRATION_PATH"
            printf 'CREATE TABLE only (id int);\n' > "$MIGRATION_PATH/V1__only.sql"
            git add -A
            git commit -q -m "root commit (no parent, no origin/main)"
            if EVENT_NAME=push PR_BASE_SHA="" PUSH_BEFORE_SHA="$ZERO_SHA" resolve_base_revision >/dev/null 2>&1; then
              fail "root commit with no base MUST fail loud (exit 1), never silently pass"
