          # is the join of all innermost literals in file order.
          # ESCAPES: in a file with EXECUTE, any E'...' literal that contains a
          # backslash, or any U&'...' literal, fails closed with "escape-encoded literal
          # in dynamic-SQL file; add contract-of if intentional". Chosen over decoding
          # \xHH / \NNN / \uXXXX / U& escapes because a decoder is one more surface to
          # get wrong (UESCAPE, octal, surrogate pairs, standard_conforming_strings) and
          # a legitimate migration has no reason to hide SQL behind escapes; the author
          # can state intent with a contract-of header.
          # A file that only mentions EXECUTE (GRANT/REVOKE EXECUTE ON FUNCTION) is analysed in the
