          # rev-parse --verify -> fallback path taken, NOT silent pass.
          # HEAD^ still exists here so it must resolve to that, proving
          # an unresolvable candidate is treated as unresolved (not
          # passed through verbatim, which would later break the gate). ---
          OUT="$(EVENT_NAME=push PR_BASE_SHA="" PUSH_BEFORE_SHA="not-a-real-sha-deadbeef" resolve_base_revision)"
          [ "$OUT" = "$EXPECTED_PARENT" ] || fail "garbage PUSH_BEFORE_SHA must take the fallback path, not pass verbatim (got '$OUT', want '$EXPECTED_PARENT')"
          echo "OK: unresolvable/garbage PUSH_BEFORE_SHA takes the fallback path (no silent pass)"

          echo "All base-revision-resolution self-test scenarios passed."

      # Phase 370 D6 mirror (merged into this job to save a runner; parity of the SHARED block is still
      # enforced by verify-gate-mirror-parity). Hermetic: builds a throwaway git repo, no checkout.
