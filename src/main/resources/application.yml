spring:
  application:
    name: beautica-backend

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 120000
      max-lifetime: 1200000
      idle-timeout: 300000
      minimum-idle: 2              # Low startup footprint on Railway 512MB; pool grows on demand
      maximum-pool-size: 10        # App container (512MB, -Xmx256m); Flyway pool 2 + headroom; max_connections default 100, confirm in M7. No pooler: if a transaction-mode pooler is ever added, revisit server-side prepares (prepareThreshold).
      connection-timeout: 20000    # Fail faster under pool saturation; 30s was masking exhaustion (was 30000)
      leak-detection-threshold: 10000  # Alert on connections held > 10 s — indicates a blocking or long-running query
      # Server-side ceiling on EVERY application statement — the backstop this pool never had.
      # statement_timeout previously appeared only inside individual migrations (SET LOCAL in
      # V139/V159/V165 and friends), so no runtime query had any ceiling at all: a single
      # pathological plan (the Phase 326 zero-trigram sequential scan was one, at 119 ms x 240
      # requests/minute/IP) could hold all 10 connections until the client gave up, and
      # connection-timeout above then queues logins and booking writes behind it. leak-detection
      # only LOGS at 10 s; this one actually aborts, and it does so in the database, where a
      # runaway statement keeps burning CPU long after the JVM has walked away.
      #
      # 5 s is ~40x the slowest legitimate statement measured on this schema (the salon-board
      # partition reads, low tens of ms) and well inside connection-timeout, so an abort surfaces
      # as one failed request instead of pool-wide starvation.
      #
      # Does NOT reach Flyway on prod/local: FlywayDataSourceConfig builds its own HikariConfig
      # and never reads spring.datasource.hikari.*. It DOES reach Flyway under the `test` profile
      # (that config is @Profile("!test"), so Flyway borrows the Testcontainers-backed main pool)
      # — which is safe because migrations that need longer already SET LOCAL statement_timeout
      # inside their own transaction, overriding this session default; V173 does the same.
      connection-init-sql: SET statement_timeout = '5s'

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100

  cache:
    type: caffeine

  thymeleaf:
    cache: true   # explicit — prevents accidental cache=false if a sibling profile adds thymeleaf.* keys

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # Image uploads are bounded at 5 MB — aligned with MediaService.MAX_FILE_BYTES (5 MB).
      # Oversized requests are rejected at the Tomcat layer before reaching the controller.
      # max-request-size sits 1 MB above max-file-size: the request cap counts the multipart
      # envelope (boundaries + part headers) too, so at 5MB an exactly-5 MB image got a 413.
      # The per-file cap (and the service-level caps) still enforce 5 MB per file / per request
      # total (SupportService.MAX_TOTAL_BYTES).
      max-file-size: 5MB
      max-request-size: 6MB
      # Explicit temp directory avoids platform-specific default locations on non-Railway hosts.
      location: ${java.io.tmpdir}/beautica-uploads

  mail:
    host: smtp-relay.brevo.com
    port: 587
    # SMTP transport only (Phase 374): optional, unused in prod (app.mail.transport=brevo-api builds no
    # JavaMailSenderImpl; Railway Hobby blocks SMTP egress anyway).
    username: ${BREVO_SMTP_LOGIN:}
    password: ${BREVO_SMTP_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # pinned by MailTimeoutConfigTest — 0/absent = infinite hang
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  # forward-headers-strategy is intentionally omitted (defaults to 'none').
  # Setting it to 'framework' (ForwardedHeaderFilter) would strip X-Forwarded-For before
  # AuthRateLimitFilter runs, and 'native' (Tomcat RemoteIpValve) rewrites remoteAddr from it,
  # either of which makes IP-based rate limiting ineffective. The raw XFF header is read
  # directly by AuthRateLimitFilter. Consequence: behind the TLS proxy the app sees http, so the
  # same-origin admin review POSTs get a scoped CORS entry in SecurityConfig.
  compression:
    # Gzip responses at the Tomcat layer. Deliberately set HERE (shared config), not per
    # profile: it is transport-level and profile-independent, and a prod-only value is how
    # a setting ships untested. The `test` profile exercises it for real — the integration
    # suite drives the app over TestRestTemplate on
    # HttpComponentsClientHttpRequestFactory(HttpClients.createDefault()), and Apache
    # HttpClient 5's default exec chain includes ContentCompressionExec, so it negotiates
    # `Accept-Encoding: gzip` and transparently decodes. MockMvc slice tests bypass Tomcat
    # and are unaffected. Nothing upstream compresses: there is no reverse proxy in the
    # image (the Dockerfile runs the jar directly) and Railway's edge proxies the origin
    # response rather than encoding it — so this is the only place compression can happen.
    # Double-compression is not a risk regardless: a proxy that receives an already
    # Content-Encoding'd response does not re-encode it.
    enabled: true
    # Biggest win is the paginated list endpoints, which are maximally gzip-friendly:
    # every avatarUrl on GET /bookings/me repeats the same long R2 host + `avatars/` prefix
    # per row, and JSON key names repeat verbatim on every element.
    #
    # SCOPE = application/json ONLY. Narrowed from the former
    # `application/json,application/problem+json,text/html,text/plain`:
    #   - application/json is the only content type this app emits at volume — every REST
    #     handler plus GlobalExceptionHandler (a @RestControllerAdvice returning ApiResponse,
    #     i.e. application/json — NOT problem+json). No ProblemDetail exists anywhere, so the
    #     problem+json alias was dead forward-cover and is dropped (YAGNI).
    #   - text/html is produced by exactly two endpoints, the Thymeleaf review pages
    #     (CategoryRequestReviewController, ServiceTypeSuggestionReviewController). Their FORM
    #     pages embed a 32-byte review token TWICE next to attacker-chosen displayName /
    #     suggestedName — the ONE place in the app where a secret and attacker-influenced text
    #     share one compressible body (a textbook BREACH oracle). Dropping text/html costs
    #     nothing (result pages are ~807 B, and the threshold below is inert anyway) and closes
    #     that co-location. text/plain had no producer at all.
    #
    # BREACH on the remaining application/json auth responses is ACCEPTED, not mitigated.
    # POST /auth/{login,refresh,register} return an AuthResponse carrying two raw JWTs plus a
    # reflected `email`, and they ARE gzipped today (884 B -> 624 B on the wire — the "too
    # small to ever compress" belief is false; see ResponseCompressionIT). This is safe here
    # because BREACH is structurally inapplicable:
    #   - Bearer-only + STATELESS, no cookies, CSRF disabled => an attacker has NO
    #     ambient-authority primitive to force the victim's browser to replay the request
    #     under attacker-chosen conditions (BREACH's precondition);
    #   - every call mints a FRESH token => no stable secret to recover byte-by-byte across
    #     repeated observations.
    # >>> FUTURE MAINTAINER WARNING: if you add a cookie-based session, a CSRF token reflected
    # >>> in a response body, or any other ambient-authority credential co-located with
    # >>> attacker-influenced input, BREACH becomes LIVE and you MUST exclude those paths from
    # >>> compression. server.compression has no path-exclusion knob, so that needs a servlet
    # >>> Filter / response wrapper — do not just trust this note to stay true.
    mime-types: application/json
    # INERT in this application — kept only as a documented floor for any future handler that
    # sets Content-Length explicitly (none does today). Measured, not assumed
    # (ResponseCompressionIT#should_gzipSubThresholdBody_when_responseIsChunked): Spring MVC's
    # Jackson converter streams JSON with NO Content-Length, so every JSON response goes out
    # Transfer-Encoding: chunked with contentLength == -1. Tomcat's gate is
    # `contentLength == -1 || contentLength > min`; the first arm short-circuits, so this
    # threshold gates NOTHING for chunked bodies — all JSON here is compressed regardless of
    # size, from 70-byte 404s upward. (The earlier comment claiming a single-entity body
    # "would miss the default entirely" and that <1KB "risks growing a small body" was wrong on
    # both counts: the growth already happens at every size and the threshold is not what
    # prevents it.) Left at 1KB rather than deleted so it is pinned by that test and takes
    # effect immediately should a handler ever back-fill Content-Length.
    min-response-size: 1KB
  tomcat:
    # Swallow up to 6 MB of an oversized request body so Tomcat returns a clean 413
    # rather than aborting the TCP connection mid-stream. Matches max-request-size above.
    max-swallow-size: 6MB

notification:
  outbox:
    reclaim:
      # Minimum age (from updated_at) before a PROCESSING notification_outbox row is treated as
      # stranded by a crashed/killed instance (most commonly a Railway rolling-deploy teardown
      # mid-dispatch) and reclaimed back to PENDING (or DEAD if retries are exhausted) by
      # NotificationOutboxReclaimJob. Must comfortably exceed NotificationOutboxDrainWorker's
      # worst-case Phase 2 dispatch window for a full batch (~33 min at BATCH_SIZE=50) — see
      # NotificationOutboxDrainWorker#drain() javadoc.
      stale-claim-threshold: 60m
  inapp:
    # Phase 335 — retention window for the in-app notification feed (in_app_notification):
    # rows (read or unread) older than this are hard-deleted by InAppNotificationCleanupJob's
    # daily sweep. Validated to [7, 365] by InAppNotificationRetentionProperties.
    retention-days: 90
    cleanup:
      # Kill switch, checked at the top of every scheduled run (not a bean-creation gate — see
      # InAppNotificationCleanupProperties javadoc). Production default is on; the test profile
      # turns it off so the real scheduler never fires mid @SpringBootTest.
      enabled: true
      # Off the top of the hour and clear of the existing 03:00-03:57 UTC cleanup cluster
      # (outbox purge 03:00, verification 03:17, password-reset 03:42, refresh-token 03:57) —
      # see InAppNotificationCleanupJob's javadoc. Overridable for ops tuning / test pinning.
      cron: "0 12 4 * * *"
      batch-size: 1000
      max-batches-per-run: 50

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Mail health disabled: SMTP (Brevo) failures are non-fatal.
    # The email service degrades gracefully (silent log on MailException).
    # Fix BREVO_SMTP_KEY / BREVO_SMTP_LOGIN in Railway env vars separately.
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.beautica: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: INFO

springdoc:
  # Internal ops endpoints (InternalApiKeyFilter-guarded) never belong in the public spec the
  # mobile client is generated from. Guarded by InternalEndpointsOpenApiContractIT.
  paths-to-exclude: /api/v1/internal/**
  api-docs:
    path: /api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

beautica:
  # Deploy-environment identity (Phase 368). Each profile pins its own value (prod yml: prod,
  # staging yml: staging, local yml: local); EnvironmentFingerprintGuard cross-checks it against
  # Railway's injected environment name and the resource names. Default `local` = guard skipped.
  environment: local
  sms:
    # turbosms (default) | capture. capture mails every SMS to a Mailpit inbox instead of the
    # provider (staging only; the fingerprint guard rejects it in prod).
    mode: turbosms
    # Phase 389 — bare website host for the guest OTP SMS's last line `@host #code` (WebOTP on Chrome
    # Android, domain-bound autofill on iOS Safari). Blank (local/test) = no domain line. prod pins
    # beautica.app; staging reads OTP_SMS_DOMAIN. Validated at boot: lower-case bare host (no scheme,
    # port or path), at most 18 chars so the SMS stays one UCS-2 segment even with CRLF (OtpDomainRules).
    otp-domain: ""
  db:
    # PostgreSQL major the app expects (prod Railway postgres-ssl:18, CI and local postgres:18-alpine).
    # DatabaseServerVersionLogger WARNs on mismatch; it never fails boot.
    expected-major: 18

# Phase 371 (D3): Sentry error reporting, EU region. OFF here (base, local, test); application-prod.yml
# (so also prod,staging) turns it on and binds sentry.dsn. No sentry.dsn here on purpose: without it the
# Sentry auto-configuration (and the scrubber/options beans) never load in local or test. SENTRY_DSN comes
# only from the environment — blank = SDK disabled, app boots normally. Events come from the logback appender (ERROR only); 4xx business exceptions are
# not ERROR-logged. PII is stripped by common/observability/SentryPiiScrubber; in-app package and ignored
# exception types live in SentryOptionsConfig (no setter on SentryOptions, so not YAML-bindable).
# EnvironmentFingerprintGuard enforces the sentry-* rules; never set SENTRY_ENVIRONMENT / SENTRY_ENABLED.
sentry:
  enabled: false
  # Lower-case deployment token; the guard rejects any other value (e.g. a stray SENTRY_ENVIRONMENT).
  environment: ${beautica.environment}
  # Railway injects the commit SHA for GitHub deploys.
  release: beautica-backend@${RAILWAY_GIT_COMMIT_SHA:unknown}
  send-default-pii: false
  max-request-body-size: none
  sample-rate: 1.0
  # Root-scope breadcrumbs are dropped by the scrubber outside a request; 30 bounds the per-request copy.
  max-breadcrumbs: 30
  # Never trace health checks (UptimeRobot polls every 5 min; Railway probes too).
  ignored-transactions:
    - ".*/actuator(/.*)?"
  logs:
    enabled: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000      # 1 hour in ms
    refresh-token-expiration: 2592000000  # 30 days in ms
  cloudflare-r2:
    # Master kill-switch. When false (default), S3Config does NOT register an S3Client bean and
    # R2StorageService (Phase 7.4) will run in stub-safe mode. Set R2_ENABLED=true only when all
    # four CLOUDFLARE_R2_* env vars below are populated; S3Config fails fast otherwise.
    enabled: ${R2_ENABLED:false}
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
    access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID:}
    secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
    bucket: ${CLOUDFLARE_R2_BUCKET:beautica-media}
    endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
    # Endpoint host must end with .r2.cloudflarestorage.com unless this opt-out is true.
    allow-custom-endpoint: ${CLOUDFLARE_R2_ALLOW_CUSTOM_ENDPOINT:false}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}
    # Outbound HTTP timeouts (Duration). socket-timeout is per-read INACTIVITY, not a total deadline.
    connection-timeout: 5s
    socket-timeout: 30s
  # Phase 417 — Cloudflare edge-cache purge of deleted media (R2StorageService#deleteFiles). Blank zone-id or
  # purge-token = purge disabled (WARN at boot when R2 is enabled): a deleted object then stays edge-cached for
  # up to the 7-day s-maxage. The token is a Cache-Purge-only API token for zone beautica.app.
  cloudflare-cdn:
    zone-id: ${CLOUDFLARE_CDN_ZONE_ID:}
    purge-token: ${CLOUDFLARE_CDN_PURGE_TOKEN:}
    api-base-url: https://api.cloudflare.com/client/v4
    # Any other api-base-url is refused at boot unless this is true (SSRF guard; tests only).
    allow-custom-api-base-url: false
    connect-timeout: 2s
    read-timeout: 5s
  firebase:
    service-account: ${FIREBASE_SERVICE_ACCOUNT:}
    connect-timeout: 5s
    read-timeout: 10s
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  invite:
    token-expiration-hours: 48
    from-email: noreply@beautica.app
  # Phase 374 — outbound mail transport. smtp (spring.mail.*, local/test/staging) | brevo-api (prod, HTTPS
  # api.brevo.com:443). Set by the profile yml; no dedicated env var is documented, but like any property it CAN be
  # overridden (e.g. APP_MAIL_TRANSPORT) — the fingerprint guard therefore pins it: prod must resolve brevo-api
  # (prod-mail-transport), staging must resolve smtp (staging-mail-transport). Exactly one JavaMailSender bean exists.
  mail:
    transport: smtp
    # Blank = inline CID logo (SMTP output unchanged). Prod sets the hosted logo: the Brevo API cannot carry CID parts.
    logo-url: ""
    brevo-api:
      # Prod guard: base-url must be exactly https://api.brevo.com (prod-brevo-api-base-url); overridable elsewhere
      # only so tests can point at WireMock.
      base-url: https://api.brevo.com
      # Transactional-email + Account-read scoped key (xkeysib-…). Never logged. Required in prod (guard rule
      # prod-brevo-api-key-missing); must be blank in staging (staging-brevo-key-blank).
      api-key: ${BREVO_API_KEY:}
      connect-timeout: 3s
      # Read timeout = upload + Brevo processing + response. 10s for plain sends (a few KB of HTML); sends that
      # carry attachments (support contact, up to 5 MB, ~6.7 MB base64) get the longer budget below.
      read-timeout: 10s
      send-with-attachments-read-timeout: 30s
      sender-name: Beautica
  booking:
    # Phase 13.3 — guest booking. How many days ahead the public availability
    # endpoint (GET /book/{slug}/availability) will serve slots.
    availability-max-days: ${BOOKING_AVAILABILITY_MAX_DAYS:60}
    # Phase 13.4 — guest cancel by link. Minimum lead time (hours) before the
    # appointment during which a guest may still cancel via the cancel link.
    # A cancel request inside this window returns 422.
    cancel-window-hours: ${BOOKING_CANCEL_WINDOW_HOURS:2}
    sms:
      # Phase 22.7 — THE single "are we spending SMS money" switch. Read by SmsConfig, which uses
      # it to choose the SmsService bean itself (NoOpSmsService when false, TurbosmsService when
      # true), so it gates EVERY outbound booking SMS at once: walk-in confirmation, guest
      # confirmation, 24h reminder, cancellation, provider decline / salon closure / master removal
      # (phase 390). No call site branches on it.
      #
      # NOT gated by this flag: the guest phone-OTP (POST /api/v1/book/otp/send). An OTP is an auth
      # credential, not booking spend, so PhoneOtpService injects OtpSmsSender — an unconditional
      # bean in SmsConfig — and keeps delivering with this flag off. See OtpSmsSender's javadoc.
      #
      # Declared literally rather than left to the Java default so the state is discoverable from
      # config. @ConditionalOnProperty compares the value with equalsIgnoreCase, so `true`/`false`
      # are understood in ANY case (`TRUE` DOES start billing). It does NOT use Spring's relaxed
      # boolean binder, so `on`/`yes`/`1` match neither branch and leave the context with no
      # SmsService at all — the app then fails to start.
      #
      # MUST stay false in every committed profile (including local). Flip at release with
      # APP_BOOKING_SMS_ENABLED=true on Railway; needs TURBOSMS_TOKEN set, or the first send
      # throws a clean SmsDeliveryException. Sibling vendor gates: FIREBASE_ENABLED,
      # app.cloudflare-r2.enabled.
      enabled: ${APP_BOOKING_SMS_ENABLED:false}
      # Ukrainian SMS copy with {placeholder} tokens substituted at send time
      # (GuestBookingService / BookingReminderJob). Multiline via YAML block scalar.
      # Rendered text (a guest's appointment details) is never logged.
      confirmation: |-
        Beautica: Запис підтверджено!
        {masterName}, {serviceName}
        {date} о {time}

        Скасувати: {cancelUrl}
      reminder: |-
        Beautica: Нагадуємо!
        {serviceName} у {masterName}
        Завтра о {time}
      cancellation: |-
        Beautica: Ваш запис скасовано.
        {serviceName} у {masterName}
        {date} о {time}
      # Phase 390 — the guest provider-cancellation SMS (decline, salon closure, master removal) is
      # fixed copy in GuestProviderCancellationSmsText, not a template here (no provider text in it;
      # its length is pinned by tests). Do not re-add `decline:` / `decline-reason:` — nothing reads them.
      # Phase 431 — the guest reschedule SMS (provider moved a LINK guest's / walk-in's booking) has no
      # key here either, on the walk-in precedent below: its single source is
      # BookingSmsProperties.Sms#reschedule. Override with APP_BOOKING_SMS_RESCHEDULE (relaxed binding);
      # GuestRescheduleSmsText fails boot unless it keeps {date} and {time} and fits 2 UCS-2 segments.
      # Phase 22.7 — the walk-in confirmation (POST /api/v1/masters/{masterId}/bookings) is the ONE
      # template with no key here, deliberately (QA MEDIUM, 2026-08-18). Its text lives in exactly
      # one place: BookingSmsProperties.Sms#walkInConfirmation. A yml copy identical to that default
      # used to sit here, which made the Java literal dead code — two sources of truth for one
      # user-visible string, and mutating the Java one changed nothing in any profile.
      #
      # Do NOT re-add `walk-in-confirmation:` merely to make the copy visible from config; that
      # silently kills the Java default again. Add it only to genuinely OVERRIDE the text, and note
      # in the same commit that BookingSmsProperties' default is then no longer the live value.
      # Constraint that travels with the copy wherever it lives: it must carry NO {cancelUrl} — a
      # STAFF booking has cancel_token = NULL by the V137 CHECK, so there is no link to build and
      # the placeholder would render literally in a real client's message.
    # Phase 400 — guest review invite SMS (beautica.app/r/{token}) ~2h after a LINK visit is COMPLETED, never
    # 21:00-09:00 Kyiv (moved to 10:00), one per visit. Bound by ReviewInviteProperties (validated at boot). Needs BOTH
    # this flag and app.booking.sms.enabled; in staging (beautica.sms.mode=capture) the SMS lands in Mailpit.
    review-invite:
      # Default OFF. Turn on only after website 018 (policy that discloses invites) and 019 (/r/{token}) are live.
      enabled: ${APP_BOOKING_REVIEW_INVITE_ENABLED:false}
      # The website 018 privacy-policy version (e.g. 2026-11-01). Required when enabled — boot fails if blank.
      # Guests who accepted an older version are skipped (POLICY_VERSION).
      min-policy-version: ${APP_BOOKING_REVIEW_INVITE_MIN_POLICY_VERSION:}
      delay: 2h
      quiet-start: "21:00"
      quiet-end: "09:00"
      send-at: "10:00"
      stale-after: 72h
      ttl: 14d
      # Rows per claim / expiry statement per tick (D4a — every claim is LIMITed).
      batch-size: 50
      max-attempts: 3
      # One UCS-2 segment (<= 70 chars with the 22-char token) — checked at boot. Override for a non-prod web host.
      sms-text: "${APP_BOOKING_REVIEW_INVITE_SMS_TEXT:Оцініть ваш візит: beautica.app/r/{token}}"
      job:
        fixed-delay-ms: 60000
        initial-delay-ms: 60000
  booking-links:
    # Phase 375 (D6) — kill-switch for GET /api/v1/booking-links/mine. false = the app hides sharing,
    # the endpoint returns {shareEnabled:false, links:[]} and issues NO slug. Stays false in prod until
    # website 008 + 009 render beautica.app/book/{slug} on prod; then set BOOKING_LINKS_SHARE_ENABLED=true
    # on Railway (no release). local / staging / test turn it on in their own profile files.
    share-enabled: ${BOOKING_LINKS_SHARE_ENABLED:false}
    # Phase 375 (D5) — public website origin of the share URL ({web-base-url}/book/{slug}).
    # https, bare origin, no trailing slash — validated at boot (BookingLinksProperties).
    web-base-url: https://beautica.app
  booking-info:
    # Optional shared secret of the website's SSR Worker (website 008). A /book/**/info request carrying a
    # matching X-Beautica-Worker-Key header is rate-limited per CF-Connecting-IP (the visitor) instead of
    # per egress IP (BookingInfoWorkerProperties). Blank = feature off. Secret: never log it.
    worker-key: ${BOOKING_INFO_WORKER_KEY:}
  turnstile:
    # Phase 382 — Cloudflare Turnstile on POST /api/v1/book/otp/send (SMS-pumping protection). OFF here
    # (local, test, default): the verifier is a no-op and the token is ignored. application-prod.yml and
    # application-staging.yml switch it on; EnvironmentFingerprintGuard refuses a prod boot with it off.
    # `enabled` is deliberately NOT an env var. The secret is: TURNSTILE_SECRET_KEY (Railway only, never
    # committed, never logged).
    enabled: false
    secret-key: ${TURNSTILE_SECRET_KEY:}
    siteverify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    connect-timeout: 2s
    # connect 2s + read 2s = at most ~4s per request before failing closed (503); no retry.
    read-timeout: 2s
    # Hostname / action checks apply only when non-empty (prod). Cloudflare's test keys return a dummy
    # hostname/action, so staging leaves both empty.
    expected-hostnames: []
    expected-action: ""
    # Phase 401 — the guest review page (/r/{token}: submit + opt-out) renders its widget with this action.
    review-expected-action: ""
  admin-email: ${ADMIN_EMAIL:admin@beautica.app}
  support:
    # Fixed destination inbox for the Help / Contact-us feature
    # (POST /api/v1/support/contact). Env-driven; blank default does NOT fail
    # startup — when unset, the contact endpoint returns a clean 503 business
    # error instead of crashing the app or emailing an empty recipient.
    email: ${SUPPORT_EMAIL:}
  sms:
    # Turbosms SMS provider (Phase 13.1) — cheapest UA provider, shared SMS layer
    # for Phase 13 OTP + notifications. Env-driven token; blank default does NOT
    # fail startup (graceful degradation like app.support / R2 / Firebase) — a send
    # attempt with no token throws a clean SmsDeliveryException. The token is a
    # secret and is never logged.
    turbosms:
      token: ${TURBOSMS_TOKEN:}
      sender-name: ${TURBOSMS_SENDER_NAME:Beautica}
      base-url: ${TURBOSMS_BASE_URL:https://api.turbosms.ua/message/send.json}
      connect-timeout: 3s
      read-timeout: 5s
  telegram:
    # Phase 404 — opt-in Telegram reminder channel (TelegramConfig). OFF by default: NoOpTelegramMessenger
    # throws, so every message falls back to SMS. Write the flag as true/false (no relaxed binding).
    # mode: live (Bot API, prod only — TelegramEnvGuard refuses it on staging) | capture (Mailpit).
    # enabled=true + live fails boot unless token, username and webhook secret are all set (TelegramProperties).
    # The token is a secret and is never logged.
    enabled: ${APP_TELEGRAM_ENABLED:false}
    mode: live
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    api-base-url: https://api.telegram.org
    link-token-ttl: 30m
  json:
    # Global Jackson StreamReadConstraints (see JsonConfig / JsonConstraintsProperties).
    # max-string-length caps a single JSON string token at the PARSE phase so a multi-MB
    # value (e.g. a `comment`/`note`) is rejected before it is materialised onto the heap
    # and before @Size validation runs — closing a cross-cutting DoS-amplification gap.
    # 65536 chars = 64 KB: >16x headroom over the 4000-char largest free-text @Size field
    # while still blocking multi-MB payloads. Applies in every profile (incl. test).
    max-string-length: ${APP_JSON_MAX_STRING_LENGTH:65536}
    max-nesting-depth: ${APP_JSON_MAX_NESTING_DEPTH:64}
    max-number-length: ${APP_JSON_MAX_NUMBER_LENGTH:100}
  # Externally-reachable base URL of THIS backend. Used to build the admin
  # category-approval link in the notification email. Distinct from
  # app.frontend.base-url (the app origin) — the approval page is served here.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    # Keyed HMAC-SHA256 pepper for the 6-digit verification OTP. Distinct from
    # JWT_SECRET. Generate: openssl rand -base64 32. Empty default forces every
    # profile to supply a value or fail fast at startup (>= 32 chars required).
    otp-pepper: ${APP_OTP_PEPPER:}
    # Phase 397 D3 — keyed HMAC-SHA256 pepper for the stable phone hash (client blocks, phase-399 SMS
    # opt-outs). Dedicated, NOT APP_OTP_PEPPER: it can never rotate without orphaning every stored hash.
    # Generate: openssl rand -base64 32. Empty default forces every profile to supply one (>= 32 chars).
    phone-hash-pepper: ${PHONE_HASH_PEPPER:}
  verification:
    # Resend-surviving cumulative brute-force bound: after this many lifetime
    # failed verifies (NOT reset by resend) the account is locked for
    # lockout-duration. A couple of honest mistakes + a resend never trips it.
    cumulative-failure-threshold: 10
    lockout-duration: 15m
    # Abandoned unverified OTP rows older than this are nulled by the daily sweep.
    stale-code-retention: 24h
    # Minimum time between two consecutive OTP resend requests for the same account.
    # Overridden to 10s in the local profile so developers don't wait 60s during testing.
    resend-cooldown: 60s
  password-reset:
    # Reset tickets expired longer than this are hard-deleted by the daily sweep
    # (PasswordResetTokenCleanupJob) — keeps password_reset_tickets from growing
    # unbounded. A few days of buffer past the 10 min ticket TTL for support/forensic lookup.
    cleanup-retention: 7d
  refresh-token:
    # Refresh tokens expired longer than this are hard-deleted by the daily sweep
    # (RefreshTokenCleanupJob) — keeps refresh_tokens from growing unbounded, since rotation
    # only revokes (never deletes) predecessors and most sessions never hit explicit logout.
    # A week of buffer past the 30-day token TTL for incident / forensic lookup (reuse-detection
    # family revocations included) before the row is reclaimed.
    cleanup-retention: 7d
  password-reset-otp:
    # 6-digit OTP lifetime for the password-reset request/verify step (mirrors
    # app.verification's shape). Kept short — 15 minutes is plenty to check an inbox.
    otp-ttl: 15m
    # Per-code attempt cap before PasswordResetOtpProcessor treats the code as expired.
    max-attempts-per-code: 5
    # Resend-surviving cumulative brute-force bound: after this many lifetime failed
    # verifies (NOT reset by a fresh OTP request) the account is locked for lockout-duration.
    cumulative-failure-threshold: 10
    lockout-duration: 15m
    # Minimum time between two consecutive OTP requests for the same account. Shared by
    # both entry points (forgot-password and the authenticated change-password-from-settings
    # request-otp). Overridden to a shorter value in the local profile.
    resend-cooldown: 60s
    # Lifetime of the PasswordResetTicket minted after a successful OTP verification. Short
    # — the caller has just proven account ownership and is expected to complete the reset
    # immediately (unlike the old 1-hour email-link TTL).
    ticket-ttl: 10m
  rate-limit:
    # Per-IP cap for POST/DELETE /api/v1/devices/token (60 s window).
    # Other capacities (login/refresh/slots) use @Value defaults in RateLimitConfig.
    device-token-capacity: 30
    # POST/DELETE /api/v1/media/* — 10/min per IP; balances upload retries
    # (after a 400 on wrong MIME / oversize) with abuse prevention.
    media-upload-capacity: 10
    # POST /api/v1/auth/forgot-password — 3/hr per IP (60-min window).
    # Email-bomb surface; kept low. Decoupled from reset-password so a NAT-shared
    # client spamming forgot-password cannot lock out their own reset-confirm.
    forgot-password-capacity: 3
    # POST /api/v1/auth/reset-password — 10/hr per IP (60-min window).
    # Sends no email; higher cap tolerates legitimate new-password typo retries
    # against a single emailed token.
    reset-password-capacity: 10
    # POST /api/v1/auth/invite — 15/min per IP (60 s window). Timing-oracle + invite-email
    # flood guard (see RateLimitConfig#inviteCapacity). Local seeding raises it via
    # scripts/start-backend.sh (APP_RATE_LIMIT_INVITE_CAPACITY); prod keeps 15.
    invite-capacity: 15
    # Phase 414 D13 — the support e-mail's one-click moderation pages, per IP per 10 minutes: the GET confirm page
    # and the POST decision have separate buckets. Optional overrides (APP_RATE_LIMIT_MODERATION_ACTION_*).
    moderation-action-page-capacity: 30
    moderation-action-decision-capacity: 10
  # Phase 373 — guest/walk-in PII retention. GuestPiiRetentionJob anonymises guest_name/surname/
  # phone, guest notes and cancel_token of client-less LINK/STAFF bookings + visit headers this many
  # calendar months after ends_at. retention-months is validated >= 12 (privacy policy promise).
  # No env var: defaults are the production values.
  guest-pii-retention:
    enabled: true
    # Staggered from the 03:00 / 03:17 / 03:42 / 03:57 UTC cleanup cluster.
    cron: "0 27 3 * * *"
    retention-months: 12
    batch-size: 500
    max-batches-per-run: 200
  # Phase 396 — UGC moderation. No env var: defaults are the production values.
  moderation:
    # D2 (locked 2026-10-28): distinct eligible reporters (CLIENT with a COMPLETED booking at the provider) that
    # auto-hide a review.
    auto-hide-threshold: 3
    # Burst guard: this many OPEN review reports on one provider within burst-window hold those reports (no
    # auto-hide from them until support resolves) and flag the support e-mail as a burst.
    burst-threshold: 5
    burst-window: 10m
    # Audit-fix D16: at most this many auto-hides per provider (master or salon) per auto-hide-cap-window. A further
    # threshold hit holds that review's reports for support and sends a [BURST] e-mail instead of hiding.
    auto-hide-cap: 1
    auto-hide-cap-window: 24h
    # Phase 414 D4 — lifetime of a one-click action link in the support report e-mail (optional override
    # APP_MODERATION_ACTION_LINK_TTL, ISO-8601, PT1H..P30D).
    action-link-ttl: P7D
    retention:
      # D7 ContentReportRetentionJob: gone-target sweep + purge of reports whose target is gone > 1 year.
      enabled: true
      # Staggered from the 03:00 / 03:17 / 03:27 / 03:42 / 03:57 UTC cleanup cluster.
      cron: "0 37 3 * * *"
      # Same batching as guest-pii-retention: rows per statement, batch budget per statement kind per run.
      batch-size: 500
      max-batches-per-run: 200
  outbox:
    # Base64-encoded 32-byte (AES-256) symmetric key for OutboxPayloadCipher.
    # Generate with: openssl rand -base64 32
    # Empty default forces every profile (incl. test) to provide a value or fail fast at startup.
    payload-key: ${OUTBOX_PAYLOAD_KEY:}
  # app.internal-api-key is deliberately NOT defined in the base profile: a base default would
  # reach prod. It is mapped from INTERNAL_API_KEY in application-prod.yml (staging inherits it;
  # EnvironmentFingerprintGuard enforces non-blank, non-default, >= 32 chars) and given a dev-only
  # default in application-local.yml / application-test.yml. Any other profile fails fast on @NotBlank.
