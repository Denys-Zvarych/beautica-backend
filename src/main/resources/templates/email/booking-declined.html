<!DOCTYPE html>
<!--
  Template: email/booking-declined
  Variables: clientName (String), serviceName (String), comment (String, nullable)
-->
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Бронювання скасовано</title>
</head>
<body style="margin:0;padding:0;background-color:#E6DDD0;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#E6DDD0;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0"
             style="background:#FDFAF7;border:1px solid #D4C5B5;border-radius:16px;max-width:480px;width:100%;">
        <tr><td style="padding:40px 40px 0;">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

            <!-- Logo -->
            <tr><td align="center" style="padding-bottom:28px;">
              <img src="cid:beauticaLogo"
                   alt="Beautica"
                   width="64" height="64"
                   style="display:block;border:0;outline:none;border-radius:14px;"/>
            </td></tr>

            <!-- Status badge -->
            <tr><td align="center" style="padding-bottom:8px;">
              <span style="display:inline-block;background:#F0E0D6;color:#8B3A3A;
                           font-size:13px;font-weight:700;padding:6px 16px;border-radius:20px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
                ✕ Скасовано
              </span>
            </td></tr>

            <!-- Heading -->
            <tr><td style="color:#0D0906;font-size:22px;font-weight:700;line-height:1.3;
                           padding-top:16px;padding-bottom:8px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
              Бронювання скасовано
            </td></tr>

            <!-- Greeting -->
            <tr><td style="color:#3D2B1A;font-size:15px;line-height:1.7;padding-bottom:20px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
              Вітаємо, <strong th:text="${clientName}" style="color:#0D0906;">Клієнт</strong>!
              На жаль, виконавець скасував ваше бронювання.
            </td></tr>

            <!-- Booking details table -->
            <tr><td style="padding-bottom:28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="border:1px solid #D4C5B5;border-radius:10px;overflow:hidden;">
                <tr>
                  <td style="padding:12px 16px;background:#EDE4D7;font-weight:700;
                             color:#0D0906;font-size:14px;width:40%;
                             font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
                    Послуга
                  </td>
                  <td style="padding:12px 16px;color:#3D2B1A;font-size:14px;
                             font-family:'Nunito','Trebuchet MS',Arial,sans-serif;"
                      th:text="${serviceName}">
                    Назва послуги
                  </td>
                </tr>
                <tr th:if="${comment != null and !#strings.isEmpty(comment)}">
                  <td style="padding:12px 16px;background:#EDE4D7;font-weight:700;
                             color:#0D0906;font-size:14px;border-top:1px solid #D4C5B5;
                             font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
                    Причина
                  </td>
                  <td style="padding:12px 16px;color:#3D2B1A;font-size:14px;border-top:1px solid #D4C5B5;
                             font-family:'Nunito','Trebuchet MS',Arial,sans-serif;"
                      th:text="${comment}">
                    Причина відхилення
                  </td>
                </tr>
              </table>
            </td></tr>

            <!-- Suggestion -->
            <tr><td style="color:#3D2B1A;font-size:15px;line-height:1.7;padding-bottom:16px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
              Спробуйте обрати інший час або послугу на Beautica.
            </td></tr>
          </table>

        </td></tr>

        <!-- Footer -->
        <tr><td style="padding:24px 40px 32px;border-top:1px solid #EDE4D7;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr><td style="color:#9A836E;font-size:12px;line-height:1.6;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
              Це автоматичне повідомлення від Beautica.
            </td></tr>
          </table>
        </td></tr>
      </table>

      <!-- Bottom tagline -->
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">
        <tr><td align="center" style="padding-top:20px;">
          <span style="color:#9A836E;font-size:12px;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
            © Beautica — платформа краси
          </span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
