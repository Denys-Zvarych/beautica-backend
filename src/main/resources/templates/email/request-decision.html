<!DOCTYPE html>
<!--
  Template: email/request-decision (phase 491, NTF-35)
  Sent to the REQUESTER when an admin approved or rejected their category request or service-type
  suggestion. One template, approve and reject branches (D4). Layout is booking-declined-by-salon-provider.html's.
  Variables: approved (boolean), category (boolean — true = category request, false = service-type suggestion),
             name (String — category display name or suggested service name),
             reason (String, NULLABLE — set only on a reject with a non-blank reason).
  th:text only (HTML-escaped) — never th:utext: name and reason are user / admin free text.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Рішення щодо вашого запиту</title>
</head>
<body style="margin:0;padding:0;background-color:#E6DDD0;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#E6DDD0;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0"
             style="background:#FDFAF7;border:1px solid #D4C5B5;border-radius:16px;max-width:480px;width:100%;">
        <tr><td style="padding:40px 40px 0;">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

            <!-- Logo -->
            <tr><td align="center" style="padding-bottom:28px;">
              <img th:src="${logoSrc} ?: 'cid:beauticaLogo'"
                   alt="Beautica"
                   width="64" height="64"
                   style="display:block;border:0;outline:none;border-radius:14px;"/>
            </td></tr>

            <!-- Approve branch -->
            <tr th:if="${approved}"><td align="center" style="padding-bottom:8px;">
              <span style="display:inline-block;background:#E3EDD9;color:#3F5E2A;
                           font-size:13px;font-weight:700;padding:6px 16px;border-radius:20px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
                ✓ Схвалено
              </span>
            </td></tr>
            <tr th:if="${approved}"><td style="color:#3D2B1A;font-size:15px;line-height:1.7;
                           padding-top:16px;padding-bottom:28px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;"
                th:text="${category} ? |Ваш запит на категорію «${name}» схвалено.| : |Вашу пропозицію послуги «${name}» схвалено.|">
              Ваш запит на категорію «Назва» схвалено.
            </td></tr>

            <!-- Reject branch -->
            <tr th:if="${!approved}"><td align="center" style="padding-bottom:8px;">
              <span style="display:inline-block;background:#F5EDD6;color:#7A5200;
                           font-size:13px;font-weight:700;padding:6px 16px;border-radius:20px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
                Відхилено
              </span>
            </td></tr>
            <tr th:if="${!approved}"><td style="color:#3D2B1A;font-size:15px;line-height:1.7;
                           padding-top:16px;padding-bottom:20px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;"
                th:text="${category} ? |Ваш запит на категорію «${name}» відхилено.| : |Вашу пропозицію послуги «${name}» відхилено.|">
              Ваш запит на категорію «Назва» відхилено.
            </td></tr>
            <tr th:if="${!approved and reason != null}"><td style="padding-bottom:28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="border:1px solid #D4C5B5;border-radius:10px;overflow:hidden;">
                <tr>
                  <td style="padding:12px 16px;color:#3D2B1A;font-size:14px;line-height:1.6;
                             font-family:'Nunito','Trebuchet MS',Arial,sans-serif;"
                      th:text="|Причина: ${reason}|">
                    Причина: текст
                  </td>
                </tr>
              </table>
            </td></tr>
          </table>

        </td></tr>

        <!-- Footer -->
        <tr><td style="padding:24px 40px 32px;border-top:1px solid #EDE4D7;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr><td style="color:#9A836E;font-size:12px;line-height:1.6;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
              Це автоматичне повідомлення від Beautica.
            </td></tr>
          </table>
        </td></tr>
      </table>

      <!-- Bottom tagline -->
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">
        <tr><td align="center" style="padding-top:20px;">
          <span style="color:#9A836E;font-size:12px;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
            © Beautica — платформа краси
          </span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
