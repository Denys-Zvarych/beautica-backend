<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Нове звернення до підтримки</title>
</head>
<body style="margin:0;padding:0;background-color:#E6DDD0;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#E6DDD0;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="520" cellpadding="0" cellspacing="0"
             style="background:#FDFAF7;border:1px solid #D4C5B5;border-radius:16px;max-width:520px;width:100%;">
        <tr><td style="padding:40px 40px 0;">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

            <tr><td style="color:#0D0906;font-size:22px;font-weight:700;line-height:1.3;padding-bottom:12px;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
              Нове звернення до підтримки
            </td></tr>

            <!-- Sender identity — server-resolved from the JWT, auto-escaped -->
            <tr><td style="padding-bottom:20px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="background:#F3EBE0;border-radius:10px;">
                <tr><td style="padding:16px 18px;color:#3D2B1A;font-size:14px;line-height:1.8;
                               font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
                  <strong>Користувач (email):</strong> <span th:text="${senderEmail}">user@example.com</span><br/>
                  <strong>ID користувача:</strong> <span th:text="${senderUserId}">user-id</span><br/>
                  <span th:if="${subject != null and !subject.isBlank()}">
                    <strong>Тема:</strong> <span th:text="${subject}">Тема</span>
                  </span>
                </td></tr>
              </table>
            </td></tr>

            <!-- Message body — auto-escaped; preserves user line breaks -->
            <tr><td style="color:#3D2B1A;font-size:15px;line-height:1.7;padding-bottom:24px;
                           white-space:pre-wrap;word-break:break-word;
                           font-family:'Nunito','Trebuchet MS',Arial,sans-serif;"
                    th:text="${body}">
              Текст повідомлення
            </td></tr>

          </table>

        </td></tr>

        <tr><td style="padding:24px 40px 32px;border-top:1px solid #EDE4D7;">
          <span style="color:#9A836E;font-size:12px;line-height:1.6;
                       font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
            Відповідайте на цей лист, щоб написати користувачу напряму
            (Reply-To вже вказано). Вкладення, якщо є, додані до листа.
          </span>
        </td></tr>
      </table>

      <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="max-width:520px;width:100%;">
        <tr><td align="center" style="padding-top:20px;">
          <span style="color:#9A836E;font-size:12px;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
            © Beautica — платформа краси
          </span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
