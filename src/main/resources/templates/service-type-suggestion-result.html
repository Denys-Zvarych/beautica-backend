<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Результат</title>
</head>
<body style="margin:0;padding:0;background-color:#E6DDD0;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;">
  <div style="max-width:480px;margin:48px auto;padding:0 16px;">
    <div style="background:#FDFAF7;border:1px solid #D4C5B5;border-radius:16px;padding:40px;text-align:center;">
      <h1 style="color:#0D0906;font-size:22px;font-weight:700;margin:0 0 12px;"
          th:text="${heading}">Готово</h1>
      <p style="color:#3D2B1A;font-size:15px;line-height:1.7;margin:0;"
         th:text="${message}">Дію виконано.</p>
    </div>
  </div>
</body>
</html>
