# Deploy-environment identity (Phase 368) — EnvironmentFingerprintGuard skips `local`.
beautica:
  environment: local
  sms:
    # Local only: every SMS (guest-booking phone OTP included) is mailed to Mailpit
    # (http://localhost:8025, subject «[SMS] Код Beautica: NNNNNN. ...») instead of the provider, so no
    # env var is needed. Prod/staging/test keep their own value; the fingerprint guard still rejects
    # capture in prod. The OTP sender is ungated, so app.booking.sms.enabled below can stay false.
    mode: capture

# Phase 371: local never reports to Sentry, even with SENTRY_DSN exported. Forcing SENTRY_ENABLED=true with a
# non-loopback DSN fails boot (EnvironmentFingerprintGuard, rule sentry-local).
sentry:
  enabled: false

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/beautica?logServerErrorDetail=false
    username: beautica
    password: beautica
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false  # live-reload during local development

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterWrite=60m

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000      # 1 hour in ms
    refresh-token-expiration: 2592000000  # 30 days in ms
  cloudflare-r2:
    # Real R2 dev bucket. scripts/start-backend.sh exports these from the out-of-repo
    # secrets dir (r2.env); see docs/backend-phases/r2-local-setup-guide.md. Disabled by default.
    enabled: ${R2_ENABLED:false}
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
    access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID:}
    secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
    bucket: ${CLOUDFLARE_R2_BUCKET:beautica-media}
    endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
    allow-custom-endpoint: ${CLOUDFLARE_R2_ALLOW_CUSTOM_ENDPOINT:false}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}
  firebase:
    # Empty by default (push stays dark). scripts/start-backend.sh exports FIREBASE_SERVICE_ACCOUNT
    # (base64) + FIREBASE_ENABLED=true from the out-of-repo secrets dir when the file exists.
    service-account: ${FIREBASE_SERVICE_ACCOUNT:}
  frontend:
    base-url: http://localhost:3000
  invite:
    token-expiration-hours: 48
    from-email: noreply@beautica.app
  admin-email: ${ADMIN_EMAIL:dev-admin@localhost}
  # Dev-only default; never valid under prod/staging (EnvironmentFingerprintGuard rejects it).
  internal-api-key: ${INTERNAL_API_KEY:changeme-dev-only}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    # Local dev only — never use in prod. Generate prod value: openssl rand -base64 32.
    # Env-wrapped so a future profile copy can't silently reuse the committed dev value;
    # the default keeps local behaviour unchanged.
    otp-pepper: ${APP_OTP_PEPPER:local-dev-otp-pepper-not-for-prod-min32chars}
    # Phase 397 — local dev only; prod value: openssl rand -base64 32.
    phone-hash-pepper: ${PHONE_HASH_PEPPER:local-dev-phone-hash-pepper-not-for-prod-min32}
  verification:
    cumulative-failure-threshold: 10
    lockout-duration: 15m
    stale-code-retention: 24h
    resend-cooldown: 10s   # Short cooldown for local dev — avoid waiting 60 s between resend attempts
  password-reset:
    cleanup-retention: 7d
  refresh-token:
    cleanup-retention: 7d
  password-reset-otp:
    otp-ttl: 15m
    max-attempts-per-code: 5
    cumulative-failure-threshold: 10
    lockout-duration: 15m
    resend-cooldown: 10s   # Short cooldown for local dev — avoid waiting 60 s between requests
    ticket-ttl: 10m
  outbox:
    # Local dev only — never use in prod. Generate prod value with: openssl rand -base64 32
    payload-key: ${OUTBOX_PAYLOAD_KEY}
  booking:
    sms:
      # Phase 22.7 — restated here, not inherited, so a developer reading only the local profile
      # can see that no SMS leaves this machine: SmsConfig wires NoOpSmsService and every booking SMS is
      # logged instead of billed (the OTP goes to Mailpit via beautica.sms.mode=capture above). Hardcoded false with NO env placeholder — unlike the base
      # profile, local must not be flippable by a stray shell export.
      enabled: false
  telegram:
    # Phase 404 — local never reaches the Bot API: with APP_TELEGRAM_ENABLED=true messages go to Mailpit
    # (tg+<chatId>@telegram.local.invalid). Flag itself stays inherited (default false).
    mode: capture
    # Phase 406 D9 — fixed dev-only webhook secret so scripts/telegram-fake-update.sh can authenticate against
    # localhost (the script uses the same default). Not a real secret: local never registers a webhook.
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:local-dev-telegram-webhook-secret-0000}
  booking-links:
    # Phase 375 (D6) — sharing on locally (prod default is false); export
    # BOOKING_LINKS_SHARE_ENABLED=false to exercise the switched-off state.
    share-enabled: ${BOOKING_LINKS_SHARE_ENABLED:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
