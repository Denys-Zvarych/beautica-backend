services:
  postgres:
    image: postgres:18-alpine
    container_name: beautica-postgres
    environment:
      POSTGRES_DB: beautica
      POSTGRES_USER: beautica
      POSTGRES_PASSWORD: beautica
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - beautica-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautica -d beautica"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beautica-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: beautica-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    networks:
      - beautica-net

  mailpit:
    # Pinned to the version running locally (2026-11-19); bump deliberately. Seed scripts read SMS codes and invite
    # links out of it — MP_MAX_MESSAGES bounds the mailbox so long seeding sessions keep searches fast.
    image: axllent/mailpit:v1.30.0
    container_name: beautica-mailpit
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - beautica-net

networks:
  beautica-net:
    driver: bridge

volumes:
  beautica-pgdata:
